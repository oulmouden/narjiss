<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narjiss — Choisissez votre logement</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=13">
<style>
/* Étape 3 du parcours client. Dimensionné pour le grand écran tactile du
   bureau de vente : cibles d'au moins 44 px, aucune interaction au survol
   seul, contrastes tenant à deux mètres de distance. */

.nj-hero {
  padding: 1.1rem 1.5rem .8rem;
  background: linear-gradient(180deg, var(--sand) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border-subtle);
  text-align: center;
}
.nj-hero h1 {
  margin: 0 0 .25rem;
  font-family: var(--font-serif);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  color: var(--charcoal);
}
.nj-fil {
  display: flex; justify-content: center; gap: .4rem;
  margin: .5rem 0 0; padding: 0; list-style: none;
  font-size: .8rem; color: var(--muted);
}
.nj-fil li { display: flex; align-items: center; gap: .4rem; }
.nj-fil li::after { content: '›'; opacity: .5; }
[dir="rtl"] .nj-fil li::after { content: '‹'; }
.nj-fil li:last-child::after { content: ''; }
.nj-fil .nj-fil-actif { color: var(--ocean-deep); font-weight: 600; }

.nj-shell {
  display: grid; grid-template-columns: 290px 1fr;
  gap: var(--space-lg); align-items: start;
  max-width: 1500px; margin: 0 auto; padding: var(--space-lg) var(--space-md) 7rem;
}
@media (max-width: 900px) { .nj-shell { grid-template-columns: 1fr; } }

/* ── Filtres ───────────────────────────────────────────────────────── */
.nj-filtres {
  position: sticky; top: 1rem;
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-md);
}
@media (max-width: 900px) { .nj-filtres { position: static; } }
.nj-filtres h2 { margin: 0 0 .9rem; font-size: 1rem; color: var(--charcoal); }
.nj-champ { margin-bottom: 1rem; }
/* Le sélecteur de projet change de contexte, il ne filtre pas : il se
   détache visuellement des filtres qui le suivent. */
.nj-champ-projet {
  padding-bottom: 1rem; margin-bottom: 1rem;
  border-bottom: 1px solid var(--border-subtle);
}
.nj-champ-projet select { font-weight: 700; }
.nj-champ-projet option:disabled { color: var(--muted); }

.nj-champ > label {
  display: block; margin-bottom: .35rem;
  font-size: .78rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .03em;
}
.nj-champ select, .nj-champ input[type=range] {
  width: 100%; min-height: 44px;
  font-family: inherit; font-size: .95rem; color: var(--text);
}
.nj-champ select {
  padding: .5rem .6rem; background: var(--surface-raised);
  border: 1px solid var(--border-medium); border-radius: 10px;
}
.nj-valeur { float: right; font-weight: 700; color: var(--ocean-deep); text-transform: none; }
.nj-case {
  display: flex; align-items: center; gap: .6rem;
  min-height: 44px; font-size: .9rem; color: var(--text); cursor: pointer;
}
.nj-case input { width: 22px; height: 22px; accent-color: var(--ocean-deep); }
.nj-reinit {
  width: 100%; min-height: 44px; margin-top: .3rem;
  background: none; border: 1px solid var(--border-medium); border-radius: 10px;
  font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
}
.nj-reinit:hover { border-color: var(--sun); color: var(--sun); }

/* ── Résultats ─────────────────────────────────────────────────────── */
.nj-resultats-tete {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 1rem; margin-bottom: .9rem;
}
.nj-compteur { font-size: 1.05rem; font-weight: 700; color: var(--charcoal); }
.nj-legende { display: flex; flex-wrap: wrap; gap: .5rem; font-size: .75rem; }
.nj-legende span { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); }
.nj-legende i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.nj-immeuble { margin-bottom: var(--space-lg); }
.nj-immeuble > h2 {
  margin: 0 0 .6rem; padding-bottom: .4rem;
  font-family: var(--font-serif); font-size: 1.3rem; color: var(--charcoal);
  border-bottom: 2px solid var(--sand-dark);
}
.nj-immeuble > h2 small { font-size: .8rem; color: var(--muted); font-family: var(--font-sans); }
.nj-niveau { margin-bottom: 1rem; }
.nj-niveau h3 {
  margin: 0 0 .5rem; font-size: .82rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em;
}
.nj-lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .8rem; }

/* Code couleur repris de la grille Excel et du back-office : le conseiller
   retrouve les mêmes repères sur les trois supports. */
.nj-lot {
  position: relative; padding: .85rem .9rem;
  background: var(--surface); border: 2px solid var(--border-subtle);
  border-inline-start-width: 6px; border-radius: 12px;
  cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
}
.nj-lot:hover, .nj-lot:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow); outline: none; }
.nj-lot:focus-visible { border-color: var(--ocean); }
.nj-disponible { border-inline-start-color: var(--lot-dispo); }
.nj-optionne   { border-inline-start-color: var(--lot-optionne); }
.nj-reserve    { border-inline-start-color: var(--lot-reserve); }
.nj-vendu      { border-inline-start-color: var(--lot-vendu); opacity: var(--lot-vendu-opacite); cursor: not-allowed; }
.nj-vendu:hover { transform: none; box-shadow: none; }
.nj-choisi { border-color: var(--ocean); background: rgba(0, 174, 239, .06); }

.nj-lot-tete { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.nj-lot-num { font-weight: 700; font-size: .95rem; color: var(--charcoal); }
.nj-pastille {
  padding: .12rem .4rem; border-radius: 999px;
  font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
}
.nj-disponible .nj-pastille { background: var(--lot-dispo-bg); color: var(--lot-dispo); }
.nj-optionne   .nj-pastille { background: var(--lot-optionne-bg); color: var(--lot-optionne); }
.nj-reserve    .nj-pastille { background: var(--lot-reserve-bg); color: var(--lot-reserve); }
.nj-vendu      .nj-pastille { background: var(--lot-vendu-bg); color: var(--muted); }

.nj-lot-prix { margin: .45rem 0 .3rem; font-size: 1.25rem; font-weight: 700; color: var(--ocean-deep); }
.nj-lot-prix small { font-size: .7rem; font-weight: 600; color: var(--muted); }
.nj-lot-carac {
  display: flex; flex-wrap: wrap; gap: .3rem .7rem;
  margin: 0; padding: 0; list-style: none; font-size: .8rem; color: var(--muted);
}
.nj-lot-note {
  margin: .5rem 0 0; font-size: .76rem; font-style: italic;
  color: var(--muted); line-height: 1.35;
}
.nj-lot-pied { margin-top: .6rem; }
.nj-action { font-size: .8rem; font-weight: 700; color: var(--lot-dispo); }
.nj-action-off { color: var(--muted); font-weight: 500; }

/* Message affiché quand le projet choisi n'a pas encore de grille. */
.nj-choix-lien { color: var(--accent-solid); font-weight: 700; }
.nj-attente { text-align: start; max-width: 620px; }
.nj-attente p { margin: 0 0 .6rem; }
.nj-attente-liens { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 1rem !important; }


.nj-vide {
  padding: 2.5rem 1rem; text-align: center; color: var(--muted);
  background: var(--surface-raised); border-radius: var(--radius);
}

/* ── Barre de sélection ────────────────────────────────────────────── */
.nj-barre {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
  display: flex; align-items: center; gap: 1rem;
  padding: .7rem 1.2rem;
  background: var(--surface); border-top: 1px solid var(--border-medium);
  box-shadow: 0 -6px 24px rgba(0,0,0,.10);
  transform: translateY(100%); transition: transform .2s ease;
}
.nj-barre-active { transform: translateY(0); }
.nj-barre-titre { font-weight: 700; color: var(--charcoal); white-space: nowrap; }
.nj-barre-titre span { color: var(--ocean-deep); }
.nj-barre-liste { display: flex; flex-wrap: wrap; gap: .45rem; flex: 1; }
.nj-barre-vide { color: var(--muted); font-size: .85rem; }
.nj-jeton {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .35rem .3rem .6rem;
  background: var(--sand); border-radius: 999px; font-size: .8rem; font-weight: 600;
}
.nj-jeton-x {
  width: 26px; height: 26px; border: none; border-radius: 50%;
  background: var(--lot-vendu-bg); font-size: 1rem; line-height: 1; color: var(--muted); cursor: pointer;
}
.nj-jeton-x:hover { background: var(--sun); color: var(--on-accent); }
.nj-suivant {
  min-height: 46px; padding: 0 1.3rem;
  background: var(--accent-solid); border: none; border-radius: 10px;
  font: inherit; font-weight: 700; color: var(--on-accent); white-space: nowrap; cursor: pointer;
}
.nj-suivant:disabled { background: var(--sand-dark); color: var(--muted); cursor: not-allowed; }

@media (max-width: 700px) {
  .nj-barre { flex-wrap: wrap; }
  .nj-barre-liste { order: 3; width: 100%; }
  .nj-suivant { flex: 1; }
}

/* Lu par les lecteurs d'écran, invisible à l'œil. */
.nj-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
</style>
</head>
<body>

<div id="mainMenu"></div>

<section class="nj-hero">
  <h1 id="njTitre">Choisissez votre logement</h1>
  <p id="njSousTitre">Résidence Al Jawhara — Dcheira El Jihadia, Agadir</p>
  <ol class="nj-fil" id="njFil">
    <li>Vos critères</li>
    <li>Le projet</li>
    <li class="nj-fil-actif">Les logements</li>
    <li>Ma sélection</li>
    <li>Un conseiller</li>
  </ol>
</section>

<div class="nj-shell">
  <aside class="nj-filtres">
    <h2 id="njAffiner">Affiner</h2>

    <div class="nj-champ nj-champ-projet">
      <label for="fProjet" id="lblProjet">Projet</label>
      <select id="fProjet"></select>
    </div>
    <div class="nj-champ">
      <label for="fTypologie" id="lblTypologie">Type</label>
      <select id="fTypologie"></select>
    </div>
    <div class="nj-champ">
      <label for="fImmeuble" id="lblImmeuble">Immeuble</label>
      <select id="fImmeuble"></select>
    </div>
    <div class="nj-champ">
      <label for="fNiveau" id="lblNiveau">À partir de l'étage</label>
      <select id="fNiveau"></select>
    </div>
    <div class="nj-champ">
      <label for="fOrientation" id="lblOrientation">Orientation</label>
      <select id="fOrientation"></select>
    </div>
    <div class="nj-champ">
      <label for="fBudget"><span id="lblBudget">Budget maximum</span> <span class="nj-valeur" id="fBudgetVal">—</span></label>
      <input type="range" id="fBudget" min="0" max="100" value="100">
    </div>
    <div class="nj-champ">
      <label for="fSurface"><span id="lblSurface">Surface minimum</span> <span class="nj-valeur" id="fSurfaceVal">—</span></label>
      <input type="range" id="fSurface" min="0" max="100" value="0">
    </div>
    <div class="nj-champ">
      <label class="nj-case" for="fDispo">
        <input type="checkbox" id="fDispo">
        <span id="lblDispoSeuls">Uniquement les logements disponibles</span>
      </label>
    </div>
    <button type="button" class="nj-reinit" id="njReinit">Tout effacer</button>
  </aside>

  <main>
    <div class="nj-resultats-tete">
      <p class="nj-compteur" id="njCompteur">…</p>
      <p class="nj-legende" id="njLegende">
        <span><i style="background:var(--lot-dispo)"></i>Disponible</span>
        <span><i style="background:var(--lot-optionne)"></i>Optionné</span>
        <span><i style="background:var(--lot-reserve)"></i>Réservé</span>
        <span><i style="background:var(--lot-vendu)"></i>Vendu</span>
      </p>
    </div>
    <div id="njGrille"></div>
  </main>
</div>

<div class="nj-barre" id="njBarre">
  <p class="nj-barre-titre"><span id="njBarreLabel">Ma sélection</span> <span id="njBarreCompte">0/3</span></p>
  <div class="nj-barre-liste" id="njBarreListe"></div>
  <button type="button" class="nj-suivant" id="njSuivant" disabled>Parler à un conseiller →</button>
</div>

<p class="nj-sr" id="njLive" role="status" aria-live="polite"></p>

<div id="mainFooter"></div>

<script src="shared/menu.js?v=13"></script>
<script src="disponibilites.js?v=9"></script>
</body>
</html>
