<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Narjiss">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2430" media="(prefers-color-scheme: dark)">
<title>Narjiss — Choisissez votre logement</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=21">
<style>
/* Étape 3 du parcours client. Dimensionné pour le grand écran tactile du
   bureau de vente : cibles d'au moins 44 px, aucune interaction au survol
   seul, contrastes tenant à deux mètres de distance. */

.nj-hero {
  padding: .55rem 1.5rem .45rem;   /* en-tête compact */
  background: linear-gradient(180deg, var(--sand) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border-subtle);
  text-align: center;
}
.nj-hero h1 {
  margin: 0 0 .15rem;
  font-family: var(--font-serif);
  font-size: clamp(1.25rem, 2.4vw, 1.8rem);
  color: var(--charcoal);
}
/* Nom du projet, rappelé en tête des résultats : il reste visible quand on
   fait défiler jusqu'au plan (l'en-tête, lui, disparaît). */
.nj-projet-bandeau {
  margin: 0 0 .6rem; font-family: var(--font-serif);
  font-size: 1.15rem; font-weight: 700; color: var(--charcoal);
}
.nj-projet-bandeau:empty { display: none; }
/* Actions reprises de project.html : contact, bureau de vente, itinéraire.
   Cibles ≥ 44 px comme le reste de la page (borne tactile). */
.nj-hero-actions {
  display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem;
  margin: .7rem 0 0;
}
/* Six boutons désormais, plein écran compris : on gagne la place sur la taille
   plutôt qu'en les repoussant sur un second rang. */
.nj-hero-actions a,
.nj-hero-actions button {
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  min-height: 38px; padding: .4rem .8rem;
  border: 1px solid var(--border-subtle); border-radius: 8px;
  background: var(--surface); color: var(--ocean-deep);
  font-family: inherit; font-size: .8rem; font-weight: 700;
  text-decoration: none; cursor: pointer;
  transition: transform .15s ease, background .15s ease, color .15s ease;
}
/* display:inline-flex ci-dessus l'emporterait sur l'attribut hidden, qui ne
   vaut que « display:none » par défaut : le bouton resterait visible en vue
   Plan ou Liste, où il n'a aucune cible. */
.nj-hero-actions [hidden] { display: none; }
.nj-hero-actions .nj-act-or {
  color: var(--sun); border-color: var(--sun);
}
.nj-hero-actions .nj-act-or:hover {
  background: var(--sun); color: var(--on-accent); border-color: var(--sun);
}
.nj-hero-actions .nj-act-wa {
  background: var(--wa); color: #fff; border-color: var(--wa);
}
.nj-hero-actions a:hover,
.nj-hero-actions button:hover { transform: translateY(-2px); }
html[dir=rtl] .nj-hero-actions { font-family: var(--font-arabic); }

.nj-fil {
  display: flex; justify-content: center; gap: .4rem;
  margin: .5rem 0 0; padding: 0; list-style: none;
  font-size: .8rem; color: var(--muted);
}
.nj-fil li { display: flex; align-items: center; gap: .4rem; }
.nj-fil li::after { content: '›'; opacity: .5; }
[dir="rtl"] .nj-fil li::after { content: '‹'; }
.nj-fil li:last-child::after { content: ''; }
.nj-fil .nj-fil-actif { color: var(--ocean-deep); font-weight: 600; }

.nj-shell {
  display: grid; grid-template-columns: 290px 1fr;
  gap: var(--space-lg); align-items: start;
  max-width: 1500px; margin: 0 auto; padding: var(--space-lg) var(--space-md) 7rem;
}
/* Un élément de grille a min-width:auto — sa piste ne peut donc pas devenir
   plus étroite que son contenu. Un seul enfant trop large élargissait ainsi
   toute la page. On autorise explicitement le rétrécissement. */
.nj-shell > * { min-width: 0; }
@media (max-width: 900px) { .nj-shell { grid-template-columns: 1fr; } }

/* ── Filtres ───────────────────────────────────────────────────────── */
.nj-filtres {
  position: sticky; top: 1rem;
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space-md);
}
@media (max-width: 900px) { .nj-filtres { position: static; } }
.nj-filtres h2 { margin: 0 0 .9rem; font-size: 1rem; color: var(--charcoal); }
.nj-champ { margin-bottom: 1rem; }
/* Le sélecteur de projet change de contexte, il ne filtre pas : il se
   détache visuellement des filtres qui le suivent. */
.nj-champ-projet {
  padding-bottom: 1rem; margin-bottom: 1rem;
  border-bottom: 1px solid var(--border-subtle);
}
.nj-champ-projet select { font-weight: 700; }
.nj-champ-projet option:disabled { color: var(--muted); }

.nj-champ > label {
  display: block; margin-bottom: .35rem;
  font-size: .78rem; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .03em;
}
/* min-width:0 est indispensable ici : un <select> réclame par défaut la
   largeur de sa plus longue <option> (« Bayt Al Mawada — Données en cours de
   mise à jour » faisait 403px), et width:100% seul ne l'en empêche pas. */
.nj-champ select, .nj-champ input[type=range] {
  width: 100%; min-width: 0; min-height: 44px;
  font-family: inherit; font-size: .95rem; color: var(--text);
}
.nj-champ select {
  padding: .5rem .6rem; background: var(--surface-raised);
  border: 1px solid var(--border-medium); border-radius: 10px;
}
.nj-valeur { float: right; font-weight: 700; color: var(--ocean-deep); text-transform: none; }
.nj-case {
  display: flex; align-items: center; gap: .6rem;
  min-height: 44px; font-size: .9rem; color: var(--text); cursor: pointer;
}
.nj-case input { width: 22px; height: 22px; accent-color: var(--ocean-deep); }
.nj-reinit {
  width: 100%; min-height: 44px; margin-top: .3rem;
  background: none; border: 1px solid var(--border-medium); border-radius: 10px;
  font: inherit; font-weight: 600; color: var(--muted); cursor: pointer;
}
.nj-reinit:hover { border-color: var(--sun); color: var(--sun); }

/* ── Résultats ─────────────────────────────────────────────────────── */
.nj-resultats-tete {
  display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem; margin-bottom: .9rem;
}
.nj-compteur { font-size: 1.05rem; font-weight: 700; color: var(--charcoal); }
.nj-legende { display: flex; flex-wrap: wrap; gap: .5rem; font-size: .75rem; }
.nj-legende span { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); }
.nj-legende i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ── Bascule d'affichage ────────────────────────────────────────────── */
/* La bascule passe à la ligne plutôt que de déborder : sur un écran étroit,
   « Affichage · Plan · Maquette · Liste » réclame près de 300px. */
.nj-vue { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; min-width: 0; }
.nj-vue-label {
  font-size: .72rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em;
}
.nj-vue-btn {
  min-height: 36px; padding: .3rem .9rem;
  background: var(--surface); border: 1px solid var(--border-medium); border-radius: 999px;
  font: inherit; font-size: .82rem; font-weight: 600; color: var(--muted); cursor: pointer;
}
.nj-vue-btn:hover { border-color: var(--ocean); color: var(--text); }
.nj-vue-btn.is-active {
  background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent);
}
.nj-vue-btn:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* ── Plan de commercialisation ──────────────────────────────────────── */
.nj-plan-aide { margin: 0 0 1.1rem; font-size: .84rem; color: var(--muted); }
.nj-plan-imm { margin-bottom: var(--space-lg); }
.nj-plan-tete {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem;
  padding-bottom: .5rem; margin-bottom: .8rem;
  border-bottom: 2px solid var(--sand-dark);
}
.nj-plan-tete h2 {
  margin: 0; font-family: var(--font-serif); font-size: 1.3rem; color: var(--charcoal);
}
.nj-plan-compte { font-size: .85rem; font-weight: 700; color: var(--lot-dispo); }
.nj-plan-jauge {
  flex: 1; min-width: 90px; max-width: 220px; height: 7px;
  background: var(--sand-dark); border-radius: 999px; overflow: hidden;
}
.nj-plan-jauge span { display: block; height: 100%; background: var(--lot-dispo); }

/* Un etage = une ligne, du dernier au rez-de-chaussee. */
.nj-plan-etage {
  display: grid; grid-template-columns: 82px 1fr;
  align-items: center; gap: .6rem; margin-bottom: .45rem;
}
.nj-plan-niveau {
  font-size: .74rem; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em; text-align: end;
}
.nj-plan-lots { display: flex; flex-wrap: wrap; gap: .45rem; }

.nj-carreau {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 76px; min-height: 58px; padding: .3rem;
  border: 2px solid transparent; border-radius: 10px;
  font: inherit; cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.nj-carreau:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
.nj-carreau:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.nj-carreau:disabled { cursor: not-allowed; }
.nj-carreau-num { font-size: 1.02rem; font-weight: 800; line-height: 1.1; }
.nj-carreau-typo { font-size: .6rem; font-weight: 700; letter-spacing: .04em; opacity: .8; }
.nj-carreau-enveloppe { position: relative; display: inline-block; }
/* Bouton « détails » : discret, mais assez large pour le doigt. */
.nj-carreau-info {
  position: absolute; bottom: -4px; inset-inline-start: -4px;
  width: 24px; height: 24px; padding: 0;
  background: var(--surface); border: 1px solid var(--border-medium);
  border-radius: 50%; font: inherit; font-size: .72rem; font-weight: 800;
  font-style: italic; color: var(--muted); line-height: 1; cursor: pointer;
}
.nj-carreau-info:hover { border-color: var(--ocean); color: var(--accent-solid); }
.nj-carreau-info:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* ── Fiche d'un lot dans la fenêtre ─────────────────────────────────── */
.nj-fiche { width: 100%; padding: 1.2rem 1.4rem; text-align: start; }
.nj-fiche-prix {
  margin: 0 0 .9rem; font-size: 1.6rem; font-weight: 700; color: var(--accent-solid);
}
.nj-fiche-prix small { font-size: .8rem; font-weight: 600; color: var(--muted); }
.nj-fiche dl {
  display: grid; grid-template-columns: auto 1fr; gap: .35rem 1rem;
  margin: 0 0 1rem; font-size: .9rem;
}
.nj-fiche dt { color: var(--muted); font-weight: 600; }
.nj-fiche dd { margin: 0; color: var(--text); font-weight: 700; }
.nj-fiche-note { margin: 0 0 1rem; font-size: .85rem; font-style: italic; color: var(--muted); }
.nj-fiche .nj-medias { margin-top: 0; }

.nj-carreau-coche {
  position: absolute; top: -6px; inset-inline-end: -6px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--ocean); color: #fff;
  font-size: .72rem; line-height: 20px; text-align: center; font-weight: 800;
}

/* Memes couleurs que les cartes, l'Excel et le back-office. */
.nj-carreau.nj-disponible { background: var(--lot-dispo-bg); color: var(--lot-dispo); }
.nj-carreau.nj-optionne   { background: var(--lot-optionne-bg); color: var(--lot-optionne); }
.nj-carreau.nj-reserve    { background: var(--lot-reserve-bg); color: var(--lot-reserve); }
.nj-carreau.nj-vendu      { background: var(--lot-vendu-bg); color: var(--lot-vendu); }
.nj-carreau.nj-choisi     { border-color: var(--ocean); }

@media (max-width: 600px) {
  .nj-plan-etage { grid-template-columns: 58px 1fr; }
  .nj-carreau { width: 64px; min-height: 52px; }
}

.nj-immeuble { margin-bottom: var(--space-lg); }
.nj-immeuble > h2 {
  margin: 0 0 .6rem; padding-bottom: .4rem;
  font-family: var(--font-serif); font-size: 1.3rem; color: var(--charcoal);
  border-bottom: 2px solid var(--sand-dark);
}
.nj-immeuble > h2 small { font-size: .8rem; color: var(--muted); font-family: var(--font-sans); }
.nj-niveau { margin-bottom: 1rem; }
.nj-niveau h3 {
  margin: 0 0 .5rem; font-size: .82rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em;
}
.nj-lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .8rem; }

/* Code couleur repris de la grille Excel et du back-office : le conseiller
   retrouve les mêmes repères sur les trois supports. */
.nj-lot {
  position: relative; padding: .85rem .9rem;
  background: var(--surface); border: 2px solid var(--border-subtle);
  border-inline-start-width: 6px; border-radius: 12px;
  cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
}
.nj-lot:hover, .nj-lot:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow); outline: none; }
.nj-lot:focus-visible { border-color: var(--ocean); }
.nj-disponible { border-inline-start-color: var(--lot-dispo); }
.nj-optionne   { border-inline-start-color: var(--lot-optionne); }
.nj-reserve    { border-inline-start-color: var(--lot-reserve); }
.nj-vendu      { border-inline-start-color: var(--lot-vendu); opacity: var(--lot-vendu-opacite); cursor: not-allowed; }
.nj-vendu:hover { transform: none; box-shadow: none; }
.nj-choisi { border-color: var(--ocean); background: rgba(0, 174, 239, .06); }

.nj-lot-tete { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.nj-lot-num { font-weight: 700; font-size: .95rem; color: var(--charcoal); }
.nj-pastille {
  padding: .12rem .4rem; border-radius: 999px;
  font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
}
.nj-disponible .nj-pastille { background: var(--lot-dispo-bg); color: var(--lot-dispo); }
.nj-optionne   .nj-pastille { background: var(--lot-optionne-bg); color: var(--lot-optionne); }
.nj-reserve    .nj-pastille { background: var(--lot-reserve-bg); color: var(--lot-reserve); }
.nj-vendu      .nj-pastille { background: var(--lot-vendu-bg); color: var(--muted); }

.nj-lot-prix { margin: .45rem 0 .3rem; font-size: 1.25rem; font-weight: 700; color: var(--ocean-deep); }
.nj-lot-prix small { font-size: .7rem; font-weight: 600; color: var(--muted); }
.nj-lot-carac {
  display: flex; flex-wrap: wrap; gap: .3rem .7rem;
  margin: 0; padding: 0; list-style: none; font-size: .8rem; color: var(--muted);
}
.nj-lot-note {
  margin: .5rem 0 0; font-size: .76rem; font-style: italic;
  color: var(--muted); line-height: 1.35;
}
.nj-lot-pied { margin-top: .6rem; }
.nj-action { font-size: .8rem; font-weight: 700; color: var(--lot-dispo); }
.nj-action-off { color: var(--muted); font-weight: 500; }

/* Message affiché quand le projet choisi n'a pas encore de grille. */
.nj-choix-lien { color: var(--accent-solid); font-weight: 700; }
.nj-attente { text-align: start; max-width: 620px; }
.nj-attente p { margin: 0 0 .6rem; }
.nj-attente-liens { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 1rem !important; }


.nj-vide {
  padding: 2.5rem 1rem; text-align: center; color: var(--muted);
  background: var(--surface-raised); border-radius: var(--radius);
}

/* ── Boutons de consultation d'un lot ───────────────────────────────── */
.nj-medias { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
.nj-media-btn {
  display: inline-flex; align-items: center; gap: .3rem;
  min-height: 34px; padding: .25rem .6rem;
  background: var(--surface-raised); border: 1px solid var(--border-medium);
  border-radius: 8px; font: inherit; font-size: .74rem; font-weight: 700;
  color: var(--text); cursor: pointer;
}
.nj-media-btn:hover { border-color: var(--ocean); color: var(--accent-solid); }
.nj-media-btn:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.nj-media-btn span { font-size: .9rem; line-height: 1; }

/* Bouton « Ajouter à mes choix » de la fiche : action principale, pleine
   largeur sous les documents. Vert quand le lot est déjà retenu. */
.nj-fiche-choix {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  width: 100%; min-height: 46px; margin-top: .9rem; padding: .6rem 1rem;
  border: 1px solid var(--accent-solid); border-radius: 10px;
  background: var(--accent-solid); color: var(--on-accent);
  font: inherit; font-size: .95rem; font-weight: 800; cursor: pointer;
  transition: background .15s ease, color .15s ease, transform .12s ease;
}
.nj-fiche-choix:hover { transform: translateY(-1px); }
.nj-fiche-choix:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.nj-fiche-choix.is-in {
  background: var(--lot-dispo); border-color: var(--lot-dispo); color: #fff;
}
.nj-fiche-choix:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.nj-fiche-choix.is-off {
  background: var(--surface-raised); border-color: var(--border-medium);
  color: var(--muted); opacity: 1;
}
/* Ligne d'actions de la fiche : « Ajouter à mes choix » + « Vider ». */
.nj-fiche-actions { display: flex; gap: .5rem; margin-top: .9rem; }
.nj-fiche-actions .nj-fiche-choix { margin-top: 0; flex: 1; }
.nj-fiche-vider {
  flex: 0 0 auto; min-height: 46px; padding: 0 1rem;
  background: transparent; border: 1px solid var(--border-medium); border-radius: 10px;
  font: inherit; font-weight: 700; color: var(--muted); cursor: pointer;
}
.nj-fiche-vider:hover { border-color: var(--lot-vendu); color: var(--lot-vendu); }

/* ── Fenêtre de consultation ────────────────────────────────────────── */
body.nj-fige { overflow: hidden; }
/* Le <dialog> occupe tout l'écran et sert lui-même de fond ; les valeurs par
   défaut du navigateur (bordure, largeur ajustée au contenu, marge auto) sont
   remises à zéro. Le voile sombre passe par ::backdrop, qui vit lui aussi dans
   la couche supérieure. */
.nj-media-fond {
  position: fixed; inset: 0; z-index: 10000;
  width: 100%; max-width: none; height: 100%; max-height: none;
  margin: 0; border: 0; padding: 1rem;
  background: transparent; color: inherit;
  align-items: center; justify-content: center;
}
.nj-media-fond[open] { display: flex; }
.nj-media-fond::backdrop { background: rgba(0, 0, 0, .68); }
.nj-media-boite {
  display: flex; flex-direction: column;
  width: min(1100px, 100%); max-height: 92vh;
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.nj-media-tete {
  display: flex; align-items: center; gap: .6rem;
  padding: .8rem 1.1rem; border-bottom: 1px solid var(--border-subtle);
}
/* Le bloc de titres pousse « Fermer » à droite ; le retour reste collé à
   gauche. « space-between » aurait au contraire dispersé les trois éléments. */
.nj-media-titres {
  display: flex; align-items: baseline; gap: .5rem;
  margin-inline-end: auto; min-width: 0;
}
/* Le nom du projet domine : sur la carte du quartier, c'est lui le sujet —
   la référence du lot ne sert plus qu'à rappeler d'où l'on vient. */
.nj-media-projet {
  font-family: var(--font-serif); font-size: 1.35rem; font-weight: 700;
  color: var(--charcoal); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.nj-media-projet:empty { display: none; }
.nj-media-tete h2 {
  margin: 0;
  font-family: var(--font-serif); font-size: .98rem; font-weight: 600;
  color: var(--muted); white-space: nowrap; flex: none;
}
/* Le nom du projet précède la référence : c'est elle qui disparaît en premier
   quand la barre devient étroite. */
@media (max-width: 560px) {
  /* Masquée à l'œil mais pas au lecteur d'écran : c'est elle que
     aria-labelledby désigne pour nommer la fenêtre. */
  .nj-media-tete h2 {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  .nj-media-projet { font-size: 1.05rem; }
}
.nj-media-fermer {
  min-height: 40px; padding: .35rem 1rem;
  background: var(--accent-solid); border: none; border-radius: 8px;
  font: inherit; font-weight: 700; color: var(--on-accent); cursor: pointer;
}
/* Plein écran : discret à côté de « Fermer », qui reste l'action principale. */
.nj-media-plein {
  display: inline-flex; align-items: center; gap: .3rem;
  min-height: 32px; padding: .25rem .6rem;
  background: var(--surface-raised); border: 1px solid var(--border-medium);
  border-radius: 8px; font: inherit; font-size: .82rem; font-weight: 700;
  color: var(--text); white-space: nowrap; cursor: pointer; flex: none;
}
.nj-media-plein[hidden] { display: none; }
.nj-media-plein:hover { border-color: var(--ocean); color: var(--accent-solid); }
@media (max-width: 560px) {
  .nj-media-plein { font-size: 0; padding: .25rem .5rem; }
  .nj-media-plein::before { content: '⛶'; font-size: .95rem; }
}

/* En plein écran, la boîte n'est plus une fenêtre posée sur la page : elle EST
   l'écran. Sans ces règles, elle garderait ses 1100px et son plafond à 92vh,
   laissant de larges bandes noires autour du document. Deux blocs distincts :
   un sélecteur inconnu invaliderait toute la règle qui le contient. */
.nj-media-boite:fullscreen {
  width: 100%; max-width: none; height: 100%; max-height: none; border-radius: 0;
}
.nj-media-boite:fullscreen .nj-media-corps { --nj-media-h: calc(100vh - 118px); }
.nj-media-boite:fullscreen .nj-media-corps iframe { height: calc(100vh - 118px); }
.nj-media-boite:-webkit-full-screen {
  width: 100%; max-width: none; height: 100%; max-height: none; border-radius: 0;
}
.nj-media-boite:-webkit-full-screen .nj-media-corps { --nj-media-h: calc(100vh - 118px); }
.nj-media-boite:-webkit-full-screen .nj-media-corps iframe { height: calc(100vh - 118px); }
.nj-media-corps {
  flex: 1; min-height: 260px; overflow: auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-raised);
}
/* Un plan doit tenir en entier sans faire défiler : la fenêtre est plafonnée
   à 92vh, on retranche l'en-tête et la note de bas de fenêtre. */
.nj-media-corps { --nj-media-h: max(300px, calc(92vh - 118px)); }
.nj-media-corps img {
  display: block;
  max-width: 100%; max-height: var(--nj-media-h);
  width: auto; height: auto;
}
/* --nj-media-h est la hauteur que le corps peut montrer sans défiler : une
   iframe plus haute ferait apparaître une barre de défilement PAR-DESSUS son
   contenu, rognant la flèche droite de l'album. */
/* --nj-media-h est la hauteur que le corps peut montrer sans défiler.
   L'iframe la prend TOUTE : plafonnée plus bas, elle laissait de larges
   bandes vides au-dessus et au-dessous (le corps centre son contenu), et
   l'album s'affichait deux fois plus petit que la place disponible. */
.nj-media-corps iframe {
  width: 100%; height: var(--nj-media-h);
  border: 0; display: block;
}
.nj-media-vide { padding: 3rem 1rem; color: var(--muted); text-align: center; }

/* Comparateur de plans : le plan d'architecte est révélé par-dessus le plan
   commercial au fil du curseur. Les deux images occupent exactement la même
   boîte ; c'est un rognage (clip-path) qui découvre celle du dessus, jamais
   un redimensionnement — les cotes restent donc lisibles des deux côtés. */
/* La boîte épouse le plan du dessous, lui-même bridé en hauteur : le
   comparateur tient donc toujours dans la fenêtre, sans défilement. */
.nj-compare {
  position: relative; max-width: 100%; max-height: var(--nj-media-h);
  line-height: 0; touch-action: pan-y;
}
.nj-compare img {
  display: block;
  max-width: 100%; max-height: var(--nj-media-h);
  width: auto; height: auto;
  user-select: none; -webkit-user-drag: none;
}
.nj-compare .nj-compare-haut {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  /* --nj-x : position du curseur, en pourcentage */
  clip-path: inset(0 calc(100% - var(--nj-x, 50%)) 0 0);
}
/* Trait de séparation, purement décoratif : le vrai contrôle est l'input. */
.nj-compare-trait {
  position: absolute; top: 0; bottom: 0; left: var(--nj-x, 50%);
  width: 2px; margin-left: -1px; background: var(--sun);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .65); pointer-events: none;
}
.nj-compare-trait::after {
  content: "⇔";
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--sun); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; line-height: 1; box-shadow: var(--shadow);
}
/* Le curseur natif porte l'accessibilité (clavier, lecteur d'écran) : on le
   rend transparent et on l'étale sur toute l'image plutôt que de le cacher. */
.nj-compare-range {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; padding: 0; background: none; border: 0;
  appearance: none; -webkit-appearance: none; cursor: ew-resize;
}
.nj-compare-range::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none;
  width: 44px; height: 44px; border-radius: 50%; background: transparent;
}
.nj-compare-range::-moz-range-thumb {
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent;
}
.nj-compare-range:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
.nj-compare-lbl {
  position: absolute; top: .6rem; z-index: 2;
  padding: .2rem .6rem; border-radius: 999px;
  background: rgba(0, 0, 0, .6); color: #fff;
  font-size: .72rem; font-weight: 700; line-height: 1.6; pointer-events: none;
}
.nj-compare-lbl-g { left: .6rem; }
.nj-compare-lbl-d { right: .6rem; }
.nj-media-note {
  margin: 0; padding: .6rem 1.1rem;
  border-top: 1px solid var(--border-subtle);
  font-size: .78rem; color: var(--muted);
}

/* ── Maquette d'étage ───────────────────────────────────────────────────
   Remplace la maquette physique que le conseiller pose sur son bureau : on
   choisit un étage dans l'élévation à gauche, on voit le plateau à droite.
   La position de chaque lot y traduit son orientation réelle (sur rue, sur
   cour, traversant), ce qui est précisément ce que le client cherche. */
.nj-mq-aide { margin: 0 0 1.1rem; font-size: .84rem; color: var(--muted); }
.nj-mq-imm { margin-bottom: var(--space-xl); }
/* 210 px et non 152 : la colonne ne porte plus seulement les étages, mais le
   poste de travail du conseiller (sélecteur de lot + quatre documents + bureau
   de vente). En dessous, « Détails du lot » et « Bureau de vente » passaient
   sur deux lignes. */
.nj-mq-corps {
  display: grid; grid-template-columns: 210px minmax(0, 1fr);
  gap: var(--space-md); align-items: start; margin-top: .9rem;
}
.nj-mq-colonne { display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
/* Panneau « Mes choix » sous la liste des niveaux. */
.nj-mq-choix {
  background: var(--surface-raised); border: 1px solid var(--border-medium);
  border-radius: 10px; padding: .55rem .6rem;
}
.nj-mq-choix-tete {
  font-size: .7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .03em; color: var(--muted); margin-bottom: .4rem;
}
.nj-mq-choix-compte { color: var(--accent-solid); }
.nj-mq-choix-vide { margin: 0; font-size: .76rem; color: var(--muted); }
.nj-mq-choix-x {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  font-size: 1.15rem; line-height: 1; padding: 0 .3rem; min-height: 38px;
}
.nj-mq-choix-x:hover { color: var(--lot-vendu); }
/* Sélecteur du lot consulté + son × de retrait, sur une seule ligne. */
.nj-mq-choix-barre { display: flex; align-items: center; gap: .2rem; }
.nj-mq-choix-select {
  flex: 1 1 auto; min-width: 0; min-height: 44px; padding: .3rem .45rem;
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: 7px; font: inherit; font-size: .76rem; font-weight: 700;
  color: var(--text); cursor: pointer;
}
.nj-mq-choix-select:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
/* Documents du lot choisi : empilés, pleine largeur, 46 px de haut. Sur la
   borne tactile, des boutons côte à côte dans la colonne seraient intouchables.
   Chacun porte sa couleur en filet de gauche et en libellé : d'un coup d'œil le
   conseiller vise le bon, sans lire. Le fond reste neutre — quatre aplats de
   couleur pleine se disputeraient l'attention avec la maquette elle-même. */
.nj-mq-choix-actions { display: flex; flex-direction: column; gap: .35rem; margin-top: .5rem; }
.nj-mq-choix-actions .nj-media-btn {
  width: 100%; min-height: 46px; justify-content: flex-start; gap: .45rem;
  font-size: .8rem; padding: .3rem .6rem;
  border-inline-start-width: 4px; border-inline-start-style: solid;
}
.nj-mq-choix-actions .nj-media-btn span { font-size: 1rem; }
.nj-mq-choix-actions [data-fiche] { color: var(--ocean-deep); border-inline-start-color: var(--ocean-deep); }
.nj-mq-choix-actions [data-media="plan"] { color: var(--accent-solid); border-inline-start-color: var(--accent-solid); }
.nj-mq-choix-actions [data-media="tour"] { color: var(--sun); border-inline-start-color: var(--sun); }
.nj-mq-choix-actions [data-media="medias"] { color: var(--lot-dispo); border-inline-start-color: var(--lot-dispo); }
.nj-mq-choix-actions .nj-media-btn:hover { background: var(--surface); border-color: currentColor; }
/* Bureau de vente : seul lien sortant du panneau, donc plein et non filet —
   c'est une action, pas un document de plus. */
.nj-mq-choix-bureau {
  display: flex; align-items: center; justify-content: flex-start; gap: .45rem;
  margin-top: .5rem; min-height: 46px; padding: .3rem .6rem;
  background: var(--sun); border: 1px solid var(--sun); border-radius: 8px;
  font-size: .8rem; font-weight: 800; color: var(--on-accent); text-decoration: none;
}
.nj-mq-choix-bureau:hover { filter: brightness(1.08); }
.nj-mq-choix-bureau span { font-size: 1rem; line-height: 1; }
.nj-mq-choix-envoyer {
  margin-top: .5rem; width: 100%; min-height: 46px; padding: .35rem;
  background: var(--accent-solid); border: 1px solid var(--accent-solid); border-radius: 8px;
  font: inherit; font-size: .8rem; font-weight: 800; color: var(--on-accent); cursor: pointer;
}
.nj-mq-choix-envoyer:hover { filter: brightness(1.05); }
.nj-mq-choix-vider {
  margin-top: .35rem; width: 100%; min-height: 34px; padding: .3rem;
  background: transparent; border: 1px solid var(--border-medium); border-radius: 8px;
  font: inherit; font-size: .74rem; font-weight: 700; color: var(--muted); cursor: pointer;
}
.nj-mq-choix-vider:hover { border-color: var(--lot-vendu); color: var(--lot-vendu); }
@media (max-width: 760px) {
  .nj-mq-colonne { gap: .5rem; }
}
@media (max-width: 760px) {
  .nj-mq-corps { grid-template-columns: 1fr; }
  .nj-mq-etages { flex-direction: row; flex-wrap: wrap; }
  .nj-mq-etage { flex: 1 1 84px; }
}

/* Élévation : les étages empilés, le dernier en haut, comme la maquette. */
.nj-mq-etages { display: flex; flex-direction: column; gap: 3px; }
.nj-mq-etage {
  display: grid; gap: .18rem;
  min-height: 52px; padding: .45rem .6rem;
  background: var(--surface-raised);
  border: 1px solid var(--border-medium); border-radius: 8px;
  font: inherit; text-align: start; color: var(--text); cursor: pointer;
}
.nj-mq-etage:hover { border-color: var(--ocean); }
.nj-mq-etage.is-active {
  background: var(--accent-solid); border-color: var(--accent-solid); color: var(--on-accent);
}
.nj-mq-etage-nom { font-weight: 800; font-size: .95rem; line-height: 1; }
.nj-mq-etage-note { font-size: .7rem; opacity: .8; line-height: 1; }
.nj-mq-etage-jauge {
  height: 4px; border-radius: 999px; background: var(--sand-dark); overflow: hidden;
}
.nj-mq-etage-jauge span { display: block; height: 100%; background: var(--lot-dispo); }
.nj-mq-etage.is-active .nj-mq-etage-jauge { background: rgba(255, 255, 255, .35); }
.nj-mq-etage.is-active .nj-mq-etage-jauge span { background: #fff; }

/* Plateau */
.nj-mq-plateau {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: .7rem;
}
.nj-mq-plateau svg { display: block; width: 100%; height: auto; }

.nj-mq-dalle { fill: var(--surface-raised); stroke: var(--border-medium); }
.nj-mq-couloir { fill: var(--sand); }
.nj-mq-noyau { fill: var(--sand-dark); }
.nj-mq-cote {
  fill: var(--muted); font-size: 15px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
}

/* Un lot : rectangle coloré par statut, mêmes teintes que les pastilles. */
.nj-mq-lot { cursor: pointer; }
.nj-mq-lot rect.nj-mq-fond { stroke-width: 2; }
.nj-mq-lot .nj-mq-num { font-size: 26px; font-weight: 800; }
.nj-mq-lot .nj-mq-info { font-size: 14px; font-weight: 600; opacity: .78; }
.nj-mq-lot text { pointer-events: none; }

.nj-mq-lot.nj-disponible rect.nj-mq-fond { fill: var(--lot-dispo-bg); stroke: var(--lot-dispo); }
.nj-mq-lot.nj-disponible text { fill: var(--lot-dispo); }
.nj-mq-lot.nj-optionne  rect.nj-mq-fond { fill: var(--lot-optionne-bg); stroke: var(--lot-optionne); }
.nj-mq-lot.nj-optionne  text { fill: var(--lot-optionne); }
.nj-mq-lot.nj-reserve   rect.nj-mq-fond { fill: var(--lot-reserve-bg); stroke: var(--lot-reserve); }
.nj-mq-lot.nj-reserve   text { fill: var(--lot-reserve); }
.nj-mq-lot.nj-vendu     rect.nj-mq-fond { fill: var(--lot-vendu-bg); stroke: var(--lot-vendu); }
.nj-mq-lot.nj-vendu     text { fill: var(--lot-vendu); }
.nj-mq-lot.nj-vendu, .nj-mq-lot.nj-bloque { opacity: var(--lot-vendu-opacite); cursor: default; }
.nj-mq-lot.nj-bloque    rect.nj-mq-fond { fill: var(--lot-vendu-bg); stroke: var(--lot-vendu); }
.nj-mq-lot.nj-bloque    text { fill: var(--lot-vendu); }

.nj-mq-lot:hover rect.nj-mq-fond { stroke-width: 4; }
.nj-mq-lot:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.nj-mq-lot.nj-choisi rect.nj-mq-fond { stroke: var(--sun); stroke-width: 5; }
.nj-mq-coche { fill: var(--sun); }
.nj-mq-coche text { fill: #fff; font-size: 18px; font-weight: 800; }

/* Pastille « i » : ouvre la fiche sans déclencher la sélection. */
/* Vue « vrai plan » : le plan d'architecte tracé dans le back-office remplace
   le plateau schématique. Les contours reprennent exactement les couleurs de
   statut du plateau, pour que le code de lecture ne change pas d'une vue à
   l'autre. Le texte est cerné de blanc : sans cela il devient illisible sur
   les zones chargées du plan (mobilier, cotes, hachures). */
.nj-mq-reel { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
.nj-mq-plan-aide { margin: .5rem 0 0; font-size: .8rem; color: var(--muted); text-align: center; }

/* Bouton d'agrandissement, dans l'en-tête de l'immeuble. Cible ≥ 44 px : on
   le vise au doigt sur la borne. */
.nj-mq-agrandir {
  min-height: 44px; padding: .4rem 1rem;
  background: var(--surface); border: 1px solid var(--border-medium); border-radius: 999px;
  font: inherit; font-size: .82rem; font-weight: 700; color: var(--ocean-deep); cursor: pointer;
}
.nj-mq-agrandir:hover { border-color: var(--sun); color: var(--sun); }

/* Plein écran : devant le client, le plan prend tout. Les filtres et le menu
   disparaissent d'eux-mêmes puisqu'on n'agrandit que la section de
   l'immeuble ; le sélecteur d'étages reste, pour circuler dans le bâtiment
   sans avoir à ressortir. */
.nj-mq-imm:fullscreen {
  display: flex; flex-direction: column;
  margin: 0; padding: 1.2rem 1.5rem; background: var(--bg); overflow: auto;
  position: relative;
}
/* Sortie du plein écran. Le bouton d'agrandissement vit en haut de page,
   hors de la section : une fois celle-ci agrandie, il n'est plus à l'écran et
   il ne restait que la touche Échap — invisible pour qui ne la connaît pas.
   Cette sortie-ci est dans la section, donc affichée avec elle. */
.nj-mq-sortie { display: none; }
.nj-mq-imm:fullscreen .nj-mq-sortie {
  display: inline-flex; align-items: center; gap: .35rem;
  position: absolute; top: .9rem; inset-inline-end: 1.1rem; z-index: 5;
  min-height: 44px; padding: .5rem 1.1rem; border-radius: 999px;
  border: 1px solid var(--sun); background: var(--sun);
  color: #fff; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .22);
}
.nj-mq-imm:fullscreen .nj-mq-sortie:hover { filter: brightness(1.1); }
/* Légende de la maquette, posée sous le titre de l'immeuble. Étant à
   l'intérieur de la section, elle reste visible en plein écran (l'ancienne
   légende globale, hors de la section agrandie, disparaissait). */
.nj-mq-legende { margin: .1rem 0 .7rem; }
.nj-mq-imm:fullscreen .nj-mq-legende { flex: 0 0 auto; margin: .2rem 0 .8rem; }
.nj-mq-imm:fullscreen .nj-mq-corps { flex: 1; min-height: 0; }
.nj-mq-imm:fullscreen .nj-mq-plateau { height: 100%; display: flex; flex-direction: column; }
.nj-mq-imm:fullscreen .nj-mq-reel { flex: 1; min-height: 0; height: auto; max-height: 100%; }
.nj-mq-imm:fullscreen .nj-mq-etage { min-height: 60px; }
.nj-mq-lot polygon.nj-mq-forme { stroke-width: 4; fill-opacity: .42; }
.nj-mq-lot.nj-disponible polygon.nj-mq-forme { fill: var(--lot-dispo); stroke: var(--lot-dispo); }
.nj-mq-lot.nj-optionne   polygon.nj-mq-forme { fill: var(--lot-optionne); stroke: var(--lot-optionne); }
.nj-mq-lot.nj-reserve    polygon.nj-mq-forme { fill: var(--lot-reserve); stroke: var(--lot-reserve); }
.nj-mq-lot.nj-vendu      polygon.nj-mq-forme { fill: var(--lot-vendu); stroke: var(--lot-vendu); }
.nj-mq-lot.nj-bloque     polygon.nj-mq-forme { fill: var(--lot-vendu); stroke: var(--lot-vendu); }
.nj-mq-lot:hover polygon.nj-mq-forme { fill-opacity: .58; stroke-width: 6; }
.nj-mq-lot.nj-choisi polygon.nj-mq-forme { stroke: var(--sun); stroke-width: 7; }
.nj-mq-reel .nj-mq-num,
.nj-mq-reel .nj-mq-info { paint-order: stroke; stroke: var(--surface); stroke-width: 5; }

.nj-mq-info-btn circle { fill: var(--surface); stroke: var(--border-medium); stroke-width: 2; }
.nj-mq-info-btn text { fill: var(--muted); font-size: 17px; font-weight: 800; }
.nj-mq-info-btn:hover circle { stroke: var(--ocean); }

/* ── Barre de sélection ────────────────────────────────────────────── */
.nj-barre {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
  display: flex; align-items: center; gap: 1rem;
  padding: .7rem 1.2rem;
  background: var(--surface); border-top: 1px solid var(--border-medium);
  box-shadow: 0 -6px 24px rgba(0,0,0,.10);
  transform: translateY(100%); transition: transform .2s ease;
}
.nj-barre-active { transform: translateY(0); }
.nj-barre-titre { font-weight: 700; color: var(--charcoal); white-space: nowrap; }
.nj-barre-titre span { color: var(--ocean-deep); }
.nj-barre-liste { display: flex; flex-wrap: wrap; gap: .45rem; flex: 1; }
.nj-barre-vide { color: var(--muted); font-size: .85rem; }
.nj-jeton {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .35rem .3rem .6rem;
  background: var(--sand); border-radius: 999px; font-size: .8rem; font-weight: 600;
}
.nj-jeton-x {
  width: 26px; height: 26px; border: none; border-radius: 50%;
  background: var(--lot-vendu-bg); font-size: 1rem; line-height: 1; color: var(--muted); cursor: pointer;
}
.nj-jeton-x:hover { background: var(--sun); color: var(--on-accent); }
.nj-jeton-voir {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border: none; border-radius: 50%;
  background: var(--surface); color: var(--muted); cursor: pointer; padding: 0;
}
.nj-jeton-voir:hover { background: var(--accent-solid); color: var(--on-accent); }
/* Dimension posée ici : le SVG n'a pas de taille intrinsèque et occuperait
   sinon toute la largeur disponible du bouton. */
.nj-choix-voir svg { width: 15px; height: 15px; display: block; }
.nj-suivant {
  min-height: 46px; padding: 0 1.3rem;
  background: var(--accent-solid); border: none; border-radius: 10px;
  font: inherit; font-weight: 700; color: var(--on-accent); white-space: nowrap; cursor: pointer;
}
.nj-suivant:disabled { background: var(--sand-dark); color: var(--muted); cursor: not-allowed; }
/* Vider toute la sélection : action secondaire, discrète mais visible. */
.nj-vider {
  min-height: 46px; padding: 0 1rem;
  background: transparent; border: 1px solid var(--border-medium); border-radius: 10px;
  font: inherit; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer;
}
.nj-vider:hover { border-color: var(--lot-vendu); color: var(--lot-vendu); }
/* Bouton « retour à la fiche », en tête de la fenêtre média. Compact : il
   partage la barre avec le titre du lot et le bouton Fermer. */
.nj-media-retour {
  display: inline-flex; align-items: center; gap: .3rem;
  min-height: 32px; margin: 0; padding: .25rem .6rem;
  background: var(--surface-raised); border: 1px solid var(--border-medium);
  border-radius: 8px; font: inherit; font-size: .82rem; font-weight: 700;
  color: var(--text); white-space: nowrap; cursor: pointer; flex: none;
}
.nj-media-retour[hidden] { display: none; }
.nj-media-retour:hover { border-color: var(--ocean); color: var(--accent-solid); }
/* Sur mobile la barre est étroite : le libellé s'efface, la flèche suffit. */
@media (max-width: 560px) {
  .nj-media-retour { font-size: 0; padding: .25rem .5rem; }
  .nj-media-retour::before { content: '←'; font-size: .95rem; }
}

@media (max-width: 700px) {
  .nj-barre { flex-wrap: wrap; }
  .nj-barre-liste { order: 3; width: 100%; }
  .nj-suivant { flex: 1; }
}

/* Lu par les lecteurs d'écran, invisible à l'œil. */
.nj-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ── Mode « embarqué » (?embed) ────────────────────────────────────────────
   Ouvert dans la scène de la démonstration : on ne garde que ce qui sert à
   choisir un lot, et chaque immeuble adopte D'OFFICE la mise en page du
   bouton « Plein écran » (mêmes règles que .nj-mq-imm:fullscreen), sans
   dépendre de l'API Fullscreen — capricieuse dans un cadre. Le plan prend
   toute la hauteur ; l'élévation des étages et « Mes choix » restent à
   gauche. Filtres, aide, bouton d'agrandissement et barre du bas relèvent
   de la version site : masqués ici, comme en vrai plein écran. */
.nj-embed #mainMenu,
.nj-embed .nj-hero,
.nj-embed #mainFooter,
.nj-embed .nj-filtres,
.nj-embed .nj-mq-aide,
.nj-embed .nj-mq-agrandir,
.nj-embed .nj-barre { display: none !important; }
/* Le body réserve 68px pour le menu fixe, masqué ici : sans cette remise à
   zéro, une bande blanche pousse toute la page vers le bas. */
.nj-embed body { padding: 0 !important; margin: 0 !important; }
/* Le body du site est en flex colonne : avec « margin: 0 auto », la coquille
   devenait un item flex rétréci à son contenu, centré entre deux grands
   vides. On l'étale explicitement sur toute la largeur. */
.nj-embed .nj-shell {
  display: block; width: 100%; max-width: none; margin: 0; padding: 0;
}
/* Un immeuble = un écran (reprise des règles :fullscreen ci-dessus). */
.nj-embed .nj-mq-imm {
  display: flex; flex-direction: column; box-sizing: border-box;
  min-height: 100vh; min-height: 100svh;
  margin: 0; padding: 1rem 1.2rem; background: var(--bg);
}
.nj-embed .nj-mq-legende { flex: 0 0 auto; margin: .2rem 0 .8rem; }
.nj-embed .nj-mq-corps { flex: 1; min-height: 0; }
.nj-embed .nj-mq-plateau { height: 100%; display: flex; flex-direction: column; }
.nj-embed .nj-mq-reel { flex: 1; min-height: 0; height: auto; max-height: 100%; }
.nj-embed .nj-mq-etage { min-height: 60px; }

/* ── Bouton de repli des filtres ──────────────────────────────────
   Masqué par défaut : il n'existe que sur téléphone. */
.nj-filtres-bascule {
  display: none; width: 100%; min-height: 46px;
  align-items: center; justify-content: space-between; gap: .5rem;
  margin: .2rem 0 .8rem; padding: .6rem .8rem;
  border: 1px solid var(--border-medium); border-radius: 10px;
  background: var(--surface-raised); color: var(--text);
  font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
}
.nj-filtres-bascule::after { content: '▾'; font-size: .9rem; opacity: .7; }
.nj-filtres-bascule[aria-expanded="true"]::after { content: '▴'; }
.nj-filtres-bascule .nj-filtres-compte {
  margin-inline-start: .4rem; padding: .1rem .45rem;
  border-radius: 999px; background: var(--accent-solid); color: #fff;
  font-size: .72rem; font-weight: 700;
}

/* ── Téléphone ────────────────────────────────────────────────
   Mesuré sur un écran de 390 px : l'en-tête (titre, six boutons sur trois
   lignes, fil d'Ariane sur deux lignes) puis les six filtres empilés
   occupaient deux écrans entiers AVANT le premier logement. On replie les
   filtres, et ce qui s'empilait passe sur une ligne qui défile au doigt.
   Aucune de ces règles ne s'applique au-delà de 640 px. */
@media (max-width: 640px) {
  .nj-hero { padding-block: .9rem .7rem; }
  .nj-hero p { font-size: .92rem; }

  /* Une ligne qui défile plutôt que trois lignes empilées. Le dernier bouton
     est volontairement coupé par le bord : ce débord est ce qui signale
     qu'il y a autre chose à droite. */
  .nj-hero-actions {
    flex-wrap: nowrap; justify-content: flex-start;
    overflow-x: auto; scroll-snap-type: x proximity;
    padding-inline: .9rem; margin-inline: -.9rem;
    scrollbar-width: none;
  }
  .nj-hero-actions::-webkit-scrollbar { display: none; }
  .nj-hero-actions a,
  .nj-hero-actions button {
    flex: 0 0 auto; scroll-snap-align: start;
    font-size: .82rem; padding: .5rem .75rem;
  }

  .nj-fil {
    flex-wrap: nowrap; justify-content: flex-start;
    overflow-x: auto; font-size: .76rem;
    padding-inline: .9rem; margin-inline: -.9rem;
    scrollbar-width: none;
  }
  .nj-fil::-webkit-scrollbar { display: none; }
  .nj-fil li { white-space: nowrap; }

  .nj-shell { padding: .9rem .9rem 7rem; gap: .9rem; }
  .nj-filtres { padding: .8rem; }
  .nj-filtres h2 { display: none; }        /* remplacé par le bouton de repli */
  .nj-filtres-bascule { display: flex; }
  .nj-filtres-bascule[aria-expanded="false"] + .nj-filtres-corps { display: none; }
  .nj-champ { margin-bottom: .8rem; }
  .nj-champ-projet { padding-bottom: .8rem; margin-bottom: .8rem; }
}
</style>
<script>
  /* Posé avant le rendu pour éviter tout clignotement du menu en mode scène. */
  (function () {
    try { if (new URLSearchParams(location.search).has('embed'))
      document.documentElement.classList.add('nj-embed'); } catch (e) {}
  })();
</script>
</head>
<body>

<div id="mainMenu"></div>

<section class="nj-hero">
  <h1 id="njTitre">Choisissez votre logement</h1>
  <p id="njSousTitre">Résidence Al Jawhara — Dcheira El Jihadia, Agadir</p>
  <div class="nj-hero-actions" id="njHeroActions"></div>
  <ol class="nj-fil" id="njFil">
    <li>Vos critères</li>
    <li>Le projet</li>
    <li class="nj-fil-actif">Les logements</li>
    <li>Ma sélection</li>
    <li>Un conseiller</li>
  </ol>
</section>

<div class="nj-shell">
  <aside class="nj-filtres">
    <h2 id="njAffiner">Affiner</h2>

    <div class="nj-champ nj-champ-projet">
      <label for="fProjet" id="lblProjet">Projet</label>
      <select id="fProjet"></select>
    </div>

    <!-- Repli des filtres, sur téléphone uniquement (cf. @media 640px). Sans
         lui, six sélecteurs empilés repoussent le premier logement à deux
         écrans de défilement. Sur grand écran ce bouton est masqué et les
         filtres restent dépliés : rien ne change de ce côté.
         Le sélecteur de projet reste hors du repli — il ne filtre pas, il
         change de projet, et c'est l'action la plus demandée. -->
    <button type="button" class="nj-filtres-bascule" id="njFiltresBascule"
            aria-expanded="false" aria-controls="njFiltresCorps">
      <span id="njFiltresBasculeLbl">Affiner</span>
    </button>

    <div class="nj-filtres-corps" id="njFiltresCorps">
    <div class="nj-champ">
      <label for="fTypologie" id="lblTypologie">Type</label>
      <select id="fTypologie"></select>
    </div>
    <div class="nj-champ">
      <label for="fImmeuble" id="lblImmeuble">Immeuble</label>
      <select id="fImmeuble"></select>
    </div>
    <div class="nj-champ">
      <label for="fNiveau" id="lblNiveau">À partir de l'étage</label>
      <select id="fNiveau"></select>
    </div>
    <div class="nj-champ">
      <label for="fOrientation" id="lblOrientation">Orientation</label>
      <select id="fOrientation"></select>
    </div>
    <div class="nj-champ">
      <label for="fBudget"><span id="lblBudget">Budget maximum</span> <span class="nj-valeur" id="fBudgetVal">—</span></label>
      <input type="range" id="fBudget" min="0" max="100" value="100">
    </div>
    <div class="nj-champ">
      <label for="fSurface"><span id="lblSurface">Surface minimum</span> <span class="nj-valeur" id="fSurfaceVal">—</span></label>
      <input type="range" id="fSurface" min="0" max="100" value="0">
    </div>
    <div class="nj-champ">
      <label class="nj-case" for="fDispo">
        <input type="checkbox" id="fDispo">
        <span id="lblDispoSeuls">Uniquement les logements disponibles</span>
      </label>
    </div>
    <button type="button" class="nj-reinit" id="njReinit">Tout effacer</button>
    </div><!-- /njFiltresCorps -->
  </aside>

  <main>
    <h2 class="nj-projet-bandeau" id="njProjetBandeau"></h2>
    <div class="nj-resultats-tete">
      <p class="nj-compteur" id="njCompteur">…</p>
      <div class="nj-vue" role="group" aria-labelledby="njVueLabel">
        <span class="nj-vue-label" id="njVueLabel">Affichage</span>
        <button type="button" class="nj-vue-btn" data-vue="maquette" id="njVueMaquette" aria-pressed="true">Maquette</button>
        <button type="button" class="nj-vue-btn" data-vue="liste" id="njVueListe" aria-pressed="false">Liste</button>
        <button type="button" class="nj-vue-btn" data-vue="plan" id="njVuePlan" aria-pressed="false">Plan</button>
      </div>
      <p class="nj-legende" id="njLegende">
        <span><i style="background:var(--lot-dispo)"></i>Disponible</span>
        <span><i style="background:var(--lot-optionne)"></i>Optionné</span>
        <span><i style="background:var(--lot-reserve)"></i>Réservé</span>
        <span><i style="background:var(--lot-vendu)"></i>Vendu</span>
      </p>
    </div>
    <div id="njGrille"></div>
  </main>
</div>

<div class="nj-barre" id="njBarre">
  <p class="nj-barre-titre"><span id="njBarreLabel">Ma sélection</span> <span id="njBarreCompte">0/3</span></p>
  <div class="nj-barre-liste" id="njBarreListe"></div>
  <button type="button" class="nj-vider" id="njVider" hidden>✕ Vider</button>
  <button type="button" class="nj-suivant" id="njSuivant" disabled>Envoyer mes choix →</button>
</div>

<!-- <dialog> et non <div> : ouvert par showModal(), il est peint dans la
     « couche supérieure » du navigateur, au-dessus de TOUT — y compris d'un
     élément en plein écran. Un simple div à z-index 10000 passait derrière le
     plan agrandi, car le plein écran ignore les z-index du reste de la page. -->
<dialog class="nj-media-fond" id="njMedia" aria-labelledby="njMediaProjet njMediaTitre">
  <div class="nj-media-boite">
    <header class="nj-media-tete">
      <!-- Le retour vit dans l'en-tête, pas dans le corps : placé au-dessus du
           document, il devenait un élément flex à part entière et réservait
           toute une colonne à gauche du plan. -->
      <button type="button" class="nj-media-retour" id="njMediaRetour" hidden></button>
      <div class="nj-media-titres">
        <span class="nj-media-projet" id="njMediaProjet"></span>
        <h2 id="njMediaTitre"></h2>
      </div>
      <button type="button" class="nj-media-plein" id="njMediaPlein" hidden></button>
      <button type="button" class="nj-media-fermer" id="njMediaFermer">Fermer</button>
    </header>
    <div class="nj-media-corps" id="njMediaCorps"></div>
    <p class="nj-media-note" id="njMediaNote" hidden></p>
  </div>
</dialog>

<p class="nj-sr" id="njLive" role="status" aria-live="polite"></p>

<div id="mainFooter"></div>

<script src="shared/menu.js?v=22"></script>
<script src="disponibilites.js?v=57"></script>
</body>
</html>
