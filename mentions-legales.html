<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narjiss - Mentions légales</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=13">
<style>
.legal-hero {
  padding: 4rem 1.5rem 3rem;
  background: var(--sand);
  text-align: center;
  border-bottom: 1px solid var(--border-subtle);
}
.legal-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4vw, 3rem);
  color: var(--charcoal);
  font-weight: 700;
}
.legal-hero p { color: var(--muted); max-width: 680px; margin: .7rem auto 0; }
.legal-content {
  max-width: 72ch;
  margin: 0 auto;
  padding: 3.5rem 1.5rem;
}
.legal-content h2 {
  color: var(--charcoal);
  font-size: 1.15rem;
  font-weight: 700;
  margin: 2.2rem 0 .75rem;
  border-left: 3px solid var(--ocean);
  padding-left: 1rem;
}
html[dir=rtl] .legal-content h2 {
  border-left: none;
  border-right: 3px solid var(--ocean);
  padding-left: 0;
  padding-right: 1rem;
}
.legal-content h2:first-child { margin-top: 0; }
.legal-content p, .legal-content li { color: var(--text); line-height: 1.9; margin-bottom: .75rem; }
.legal-content ul { padding-left: 1.2rem; margin-bottom: 1rem; }
html[dir=rtl] .legal-content ul { padding-left: 0; padding-right: 1.2rem; }
</style>
</head>
<body>
<div id="mainMenu"></div>
<main>
  <section class="legal-hero">
    <h1 id="pageTitle"></h1>
    <p id="pageSubtitle"></p>
  </section>
  <section class="legal-content" id="legalContent"></section>
</main>
<div id="mainFooter"></div>
<script src="shared/menu.js?v=14"></script>

window.onLanguageChange = function(lang) {
  var t = PAGE_UI[lang];
  document.getElementById("pageTitle").textContent = t.title;
  document.getElementById("pageSubtitle").textContent = t.subtitle;
  document.getElementById("legalContent").innerHTML = t.sections.map(function(s) {
    return "<h2>" + s.h + "</h2><p>" + s.p + "</p>";
  }).join("");
};
document.addEventListener("DOMContentLoaded", function() { initPage("", ""); });
