<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Narjiss">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2430" media="(prefers-color-scheme: dark)">
<title>Narjiss — Localisation</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=24ee7704">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Version allégée de la section « Localisation » de project.html : la carte,
   les POI du quartier, rien d'autre. Pas de dessin, pas de mesure, pas de
   routage — uniquement Leaflet et le panneau de points d'intérêt, pour une
   page qui s'ouvre vite depuis la borne du bureau de vente. */

:root {
  --ink: #1f2430;
  --ivory: #f3f6fa;
  --gold: #c15a00;
  --bronze: #b45309;
  --smoke: #ffffff;
  --surface-2: #eef2f7;
  --muted: #596273;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e4e8f0; --ivory: #0f131a; --gold: #ff9a3d;
  --bronze: #ffb070; --smoke: #171c26; --surface-2: #1f2632; --muted: #9aa4b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #e4e8f0; --ivory: #0f131a; --gold: #ff9a3d;
    --bronze: #ffb070; --smoke: #171c26; --surface-2: #1f2632; --muted: #9aa4b8;
  }
}

body { background: var(--ivory); }

.loc-hero {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: .55rem 0 .35rem;   /* en-tête compact : plus de place pour la carte */
}
.section-kicker {
  color: var(--bronze);
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: 2.2px;
  font-weight: 900;
  margin-bottom: .2rem;
}
.loc-hero h1 {
  margin: 0;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.3rem, 2.4vw, 1.9rem);
  color: var(--ink);
}
html[dir=rtl] .loc-hero h1 { font-family: 'Noto Sans Arabic', serif; }
.loc-hero .loc-lieu { margin: .3rem 0 0; color: var(--muted); }
.loc-retour {
  display: inline-flex; align-items: center; gap: .35rem;
  min-height: 44px; padding: .5rem .9rem; margin-top: .8rem;
  border: 1px solid var(--border-subtle); border-radius: 8px;
  background: var(--smoke); color: var(--ocean-deep);
  font-weight: 700; font-size: .88rem; text-decoration: none;
}

.loc-shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto 2.5rem; }
/* La carte occupe la hauteur restante sous l'en-tête, sinon la page reste à
   moitié vide sur un grand écran. --loc-carte est la hauteur réservée au
   menu, au titre et à la marge basse. */
:root { --loc-carte: calc(100vh - 200px); }
/* Carte pleine largeur, commandes au-dessus, liste dessous.
   L'ancien panneau latéral de 390 px mangeait la moitié d'un écran de
   téléphone : la carte n'y était plus lisible, alors qu'elle est le sujet.
   Une seule composition sert les deux tailles d'écran — seules la hauteur de
   la carte et le nombre de colonnes de la liste changent. */
.map-composition > * { min-width: 0; }
.map-composition {
  display: grid;
  grid-template-rows: auto auto auto;
  /* Sans colonne bornee, la grille se cale sur le contenu le plus large — un
     titre long — et la carte deborde de son cadre, rognee par overflow:hidden. */
  grid-template-columns: minmax(0, 1fr);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(20,20,29,.15);
  border: 1px solid rgba(20,20,29,.08);
  background: var(--surface-2);
}
.map-intro { padding: 1rem 1.2rem .8rem; }
.map-intro p { margin-top: .4rem; color: var(--muted); line-height: 1.6; font-size: .88rem; }

/* Barre de commandes : bascule, filtres, tri, compteur et liens, sur une
   ligne qui se replie d'elle-même quand l'écran se resserre. */
.loc-barre {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem;
  padding: 0 1.2rem .9rem;
  border-bottom: 1px solid rgba(17,24,39,.08);
}
.loc-barre > * { min-width: 0; }
.loc-barre .map-actions { margin-inline-start: auto; }

#projectMap { height: var(--loc-carte); min-height: 420px; width: 100%; z-index: 1; }

.map-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.map-actions a {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: .6rem 1rem; white-space: nowrap;
  border: 1px solid rgba(0,174,239,.24); border-radius: 8px;
  background: var(--smoke); color: var(--ocean-deep);
  font-weight: 700; font-size: .88rem; text-decoration: none;
}

.poi-summary { overflow-y: auto; min-height: 0; max-height: 460px; border-top: 1px solid rgba(17,24,39,.08); }
/* Sous la carte, une seule colonne de categories ferait une bande etroite et
   interminable sur un ecran large : on repartit en colonnes. */
@media (min-width: 900px) {
  .poi-summary .poi-category { break-inside: avoid; }
  .poi-summary > .poi-count { column-span: all; }
  .poi-summary { columns: 2; column-gap: 1.4rem; padding-bottom: .6rem; }
}
@media (min-width: 1300px) { .poi-summary { columns: 3; } }
.poi-count { color: var(--ink); font-size: .9rem; font-weight: 700; padding: 1rem 1.2rem .7rem; }
.poi-count span {
  color: var(--gold); font-family: 'Playfair Display', serif;
  font-size: 1.7rem; margin-right: .35rem;
}
html[dir=rtl] .poi-count span { margin-right: 0; margin-left: .35rem; }
.poi-legend-marker {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid white; box-shadow: 0 1px 4px rgba(20,20,29,.25);
  display: inline-flex; align-items: center; justify-content: center;
  color: white; flex: 0 0 22px;
}
.poi-legend-marker .poi-google-svg { width: 14px; height: 14px; stroke-width: 2.8; }
.poi-category-btn .poi-legend-marker { width: 24px; height: 24px; flex-basis: 24px; }
.poi-category-btn .poi-legend-marker .poi-google-svg { width: 15px; height: 15px; }
.poi-note { color: var(--muted); font-size: .78rem; line-height: 1.55; padding: 1rem 1.2rem; }

/* Commandes de la barre : compteur, catégorie, distance, tri. */
#poiControles { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
/* Le compteur se lit sur la même ligne que les listes déroulantes : à une
   taille plus petite qu'elles, il passait pour une note de bas de page. */
.poi-count-inline { color: var(--muted); font-size: .92rem; font-weight: 700; white-space: nowrap; }
.poi-count-inline b { color: var(--gold); font-size: 1.15rem; font-weight: 800; }
.poi-tri { display: inline-flex; gap: .3rem; }
#poiControles .poi-filter { max-width: 15rem; }
@media (max-width: 560px) {
  /* Chaque ligne compte : au-dessus d'une carte de 55 vh, la barre ne doit pas
     repousser le plan hors de l'écran. Les deux listes déroulantes partagent
     une ligne, le tri en occupe une autre, et le compteur se glisse à côté. */
  #poiControles { width: 100%; gap: .35rem; }
  #poiControles .poi-filter { flex: 1 1 8rem; max-width: none; min-height: 40px; }
  /* Le compteur global occupait une ligne entière au-dessus de la carte, alors
     que chaque entrée de la liste déroulante porte déjà son propre décompte. */
  .poi-count-inline { display: none; }
  .poi-tri { width: 100%; }
  .poi-tri .poi-sort { flex: 1; min-height: 40px; }
  /* Liens de navigation : utiles, mais secondaires devant la carte. */
  .loc-barre .map-actions a { min-height: 38px; font-size: .78rem; }
}

.poi-controls {
  padding: .85rem 1.2rem;
  border-top: 1px solid rgba(17,24,39,.08);
  border-bottom: 1px solid rgba(17,24,39,.08);
  background: var(--smoke);
}
.poi-control-row { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-bottom: .5rem; }
.poi-control-row:last-child { margin-bottom: 0; }
.poi-control-row label {
  color: var(--muted); font-size: .68rem; letter-spacing: 1px; text-transform: uppercase;
}
/* Listes déroulantes et tri : lisibles de loin. À .78rem, les intitulés des
   combos (catégorie, distance, point) tombaient sous la taille du reste de la
   barre — la bascule Quartier/Repères est à .84rem juste à côté. */
.poi-sort,
.poi-filter {
  border: 1px solid rgba(17,24,39,.12); background: var(--surface-2); color: var(--ink);
  border-radius: 7px; padding: .45rem .75rem; font: inherit; font-size: .92rem;
  min-height: 40px;
}
.poi-sort { cursor: pointer; }
.poi-sort.active { background: var(--gold); border-color: var(--gold); color: white; font-weight: 800; }
.poi-filter option { background: var(--smoke); color: var(--ink); font-size: .92rem; }

.poi-category { border-bottom: 1px solid rgba(17,24,39,.08); }
.poi-category-btn {
  width: 100%; display: flex; align-items: center; gap: .55rem;
  padding: .82rem 1.2rem; border: 0; background: transparent; color: var(--ink);
  font: inherit; cursor: pointer; text-align: left; min-height: 44px;
}
html[dir=rtl] .poi-category-btn { text-align: right; }
.poi-category-btn:hover,
.poi-category-btn.active { background: rgba(0,174,239,.08); color: var(--ocean-deep); }
.poi-category-btn .label { flex: 1; min-width: 0; }
/* Le badge porte désormais seul le comptage par catégorie : il doit se lire
   à deux mètres, comme le reste de la page. */
.poi-category-btn .count {
  min-width: 30px; padding: .16rem .5rem; border-radius: 999px;
  background: rgba(0,174,239,.16); color: var(--ocean-deep);
  font-size: .82rem; font-weight: 800; text-align: center;
}
.poi-category-btn .arrow { font-size: .62rem; transition: transform .18s; }
.poi-category-btn.active .arrow { transform: rotate(90deg); }
html[dir=rtl] .poi-category-btn.active .arrow { transform: rotate(-90deg); }
.poi-list { display: none; background: var(--smoke); }
.poi-list.show { display: block; }
.poi-item {
  display: grid; grid-template-columns: 7px 1fr; gap: .6rem; align-items: start;
  width: 100%; border: 0; border-top: 1px solid rgba(17,24,39,.06);
  background: transparent; color: var(--ink); padding: .68rem 1.2rem;
  font: inherit; text-align: left; cursor: pointer; min-height: 44px;
}
html[dir=rtl] .poi-item { text-align: right; }
.poi-item:hover { background: rgba(193,90,0,.08); }
.poi-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-top: .45rem; }
/* Nom et distance : deux blocs isolés, et non deux <span> à la suite.
 *
 * display:block — c'est ce que supposait déjà le margin-top de .poi-meta, sans
 * effet tant que l'élément restait en ligne. Les deux se collaient donc l'un à
 * l'autre, sans même une espace : « École Moussa Ben El Housseine164 m ».
 *
 * unicode-bidi:isolate — beaucoup de nos POI portent un nom bilingue qui se
 * termine en arabe (« École Salam مدرسة السلام »). Sans isolation, l'algorithme
 * bidirectionnel d'Unicode absorbe le nombre qui suit dans la portée arabe et
 * le réaffiche à sa gauche : la distance atterrissait au milieu du libellé.
 * L'isolation coupe la propagation d'un élément à l'autre — c'est le rôle de
 * <bdi>, obtenu ici sans toucher au balisage.
 */
.poi-name, .poi-meta { display: block; unicode-bidi: isolate; }
.poi-name { font-weight: 700; font-size: .82rem; line-height: 1.25; }
.poi-meta { color: var(--muted); font-size: .7rem; margin-top: .18rem; line-height: 1.4; }

.project-popup { min-width: 190px; padding: .55rem .65rem; }
.project-popup .popup-cat {
  color: var(--ocean); font-size: .62rem; font-weight: 800;
  letter-spacing: 1px; text-transform: uppercase;
}
.project-popup .popup-name {
  color: var(--charcoal); font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 800; margin-top: .12rem;
}
.project-popup .popup-address,
.project-popup .popup-meta { color: var(--muted); font-size: .74rem; margin-top: .22rem; }
.project-popup .popup-phone a { color: var(--ocean); text-decoration: none; }
/* La distance est la réponse à la question qu'on se pose devant le plan :
   elle se lit avant l'adresse, la note et les horaires. */
.project-popup .popup-distance { color: var(--gold); font-weight: 700; }

.project-pin-marker {
  position: relative; width: 24px; height: 24px; background: var(--gold);
  border-radius: 50% 50% 50% 0; box-shadow: 0 5px 14px rgba(20,20,29,.28);
  transform: rotate(-45deg);
}
.project-pin-marker::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 9px; height: 9px; background: var(--smoke);
  border-radius: 50%; transform: translate(-50%, -50%);
}
.poi-google-marker {
  width: 34px; height: 34px; border-radius: 50%; border: 3px solid white;
  box-shadow: 0 2px 7px rgba(20,20,29,.35);
  display: flex; align-items: center; justify-content: center; color: white;
}
.poi-google-svg {
  width: 21px; height: 21px; display: block; color: white;
  fill: none; stroke: currentColor; stroke-width: 2.4;
  stroke-linecap: round; stroke-linejoin: round;
}
.poi-google-svg-fill { fill: currentColor; stroke: none; }

@media (max-width: 900px) {
  /* Tout ce qui précède la carte la repousse hors de l'écran. L'en-tête de la
     page nomme déjà le projet : le bloc d'introduction fait doublon ici, et le
     bouton de retour se replie sur une pastille compacte. */
  .map-intro { display: none; }
  .loc-hero { padding-top: .3rem; }
  .loc-hero .loc-lieu { font-size: .85rem; }
  .loc-retour { min-height: 38px; padding: .4rem .7rem; margin-top: .5rem; font-size: .8rem; }
  .loc-barre { padding: .8rem 1rem; gap: .45rem; }
  .loc-barre .map-actions { margin-inline-start: 0; width: 100%; }
  .loc-barre .map-actions a { flex: 1; font-size: .82rem; padding: .5rem .6rem; }
  .poi-summary { max-height: 50vh; }
  /* La carte est le sujet de la page : elle prend la moitie de l ecran. */
  #projectMap { height: 55vh; min-height: 320px; }
}

/* ── Bascule quartier / repères ────────────────────────────────────────────
   Deux onglets en tête du panneau plutôt qu'une bande séparée : les deux jeux
   répondent à la même question de mise en situation, à deux échelles. Les
   montrer ensemble imposait un zoom de compromis — trop large pour lire le
   quartier, trop serré pour situer la ville. */
/* La bascule est désormais dans la barre au-dessus de la carte : ni marge
   propre, ni filet — c'est la barre qui les porte. */
.poi-jeux { display: flex; gap: .3rem; }
.poi-jeu {
  flex: 1;
  min-height: 40px;
  padding: .45rem .6rem;
  border: 1px solid var(--border-medium, rgba(17,24,39,.14));
  border-radius: 999px;
  background: var(--smoke);
  color: var(--muted);
  font: inherit;
  font-size: .84rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
.poi-jeu:hover { border-color: var(--gold); color: var(--gold); }
.poi-jeu.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
  font-weight: 800;
}

/* ── Trajet vers un repère ─────────────────────────────────────────────────
   Le tracé se dessine sous les yeux du visiteur. L'animation porte sur
   stroke-dashoffset, avec la longueur réelle du chemin publiée par le script :
   c'est le navigateur qui dessine, sans minuterie à entretenir. */
/* Couleur du trajet — à changer ICI, et nulle part ailleurs.
   Bleu roi plutôt que l'orange d'origine : le fond OpenStreetMap peint ses
   routes principales en orange et en jaune (#fcd6a4, #f7fabf), si bien que le
   trajet se confondait avec le réseau routier — la seule chose qui lui
   ressemble sur la carte. Rien, en revanche, n'y est un bleu saturé et
   sombre : l'eau est un bleu très pâle (#aad3df).
   Le vert avait le même défaut que l'orange, en pire : OSM colore parcs,
   végétation et terrains de sport en vert, et il y en a tout autour de
   Jawhara.
   Le liseré blanc dessous fait le reste : au-dessus d'un pâté de maisons
   chargé, c'est lui qui garde le trait lisible, quelle que soit la teinte. */
:root { --nj-trajet: #1D4ED8; --nj-trajet-lisere: #ffffff; }
:root[data-theme="dark"] { --nj-trajet: #5B8DEF; --nj-trajet-lisere: #0f131a; }

/* Une règle CSS l'emporte sur l'attribut de présentation que Leaflet pose :
   la couleur passée au script ne sert donc que de repli. */
.nj-trace { stroke: var(--nj-trajet); stroke-linecap: round; }
.nj-trace-lisere { stroke: var(--nj-trajet-lisere); stroke-linecap: round; }
.nj-trace-anime {
  stroke-dasharray: var(--nj-longueur);
  stroke-dashoffset: var(--nj-longueur);
  animation: njTracer 1.1s ease-out forwards;
}
@keyframes njTracer { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .nj-trace-anime { animation: none; stroke-dashoffset: 0; }
}

/* Actions de l'étiquette : zoomer, et tracer le trajet depuis la résidence. */
.popup-actions { display: flex; gap: .3rem; margin-top: .5rem; }
.popup-action {
  flex: 1;
  min-height: 32px;
  padding: .3rem .5rem;
  border: 1px solid var(--gold);
  border-radius: 999px;
  background: transparent;
  color: var(--gold);
  font: inherit;
  font-size: .74rem;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.popup-action:hover { background: var(--gold); color: #fff; }

/* Repère dans la liste : l'emoji tient lieu de pastille de couleur. */
.repere-item { grid-template-columns: 26px 1fr; align-items: center; }
.repere-emoji { font-size: 1.15rem; line-height: 1; text-align: center; }

/* Marqueur de repère sur la carte : plus grand qu'un POI de quartier, et
   porteur de son emoji — aéroport, marina ou stade n'ont pas d'icône dans la
   palette et tomberaient tous sur la même pastille grise. */
.repere-marker {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--smoke);
  border: 2px solid var(--gold);
  box-shadow: 0 4px 14px rgba(20,20,29,.3);
  font-size: 1.15rem;
}

/* Mode « embarqué » (iframe depuis le parcours client ou la démonstration) :
   on ne garde que la carte, le panneau POI et les repères, sans le menu du
   site ni l'en-tête. */
.nj-embed #mainMenu,
.nj-embed .loc-hero,
.nj-embed #mainFooter,
.nj-embed .map-actions,
.nj-embed .loc-retour { display: none !important; }
/* Le body réserve 68px pour le menu fixe. Le menu étant masqué ici, cette
   réserve ne faisait qu'ajouter une bande blanche en haut et pousser la
   colonne d'autant hors du cadre. */
.nj-embed body { padding: 0 !important; margin: 0 !important; }
.nj-embed, .nj-embed body { overflow: hidden; }
/* Colonne flexible plutôt qu'un calc() sur la hauteur de la bande : celle-ci
   dépend de la largeur disponible, qui dépend de la hauteur de la carte, qui
   dépendrait de la bande. Mesurer l'une pour dimensionner l'autre créait une
   boucle — la carte s'était retrouvée à 218px pour une bande annoncée à 502.
   Ici la bande prend ce qu'il lui faut, la carte prend le reste. */
/* width: 100% et pas seulement max-width: none — la règle de base fixe
   « width: min(1180px, …) », qu'un max-width ne desserre pas. La colonne
   restait donc large de 1180 px ; et comme « margin: 0 » annule ici le
   centrage, tout l'espace excédentaire se retrouvait en bande blanche à
   droite de la carte. */
.nj-embed .loc-shell {
  padding: 0; margin: 0; width: 100%; max-width: none;
  display: flex; flex-direction: column; height: 100vh;
}
/* Plein cadre : les angles arrondis et l'ombre portée d'une carte flottante
   n'ont plus de sens quand les bords touchent le bord de l'écran. */
.nj-embed .map-composition {
  flex: 1 1 auto; min-height: 0; height: auto;
  border-radius: 0; border: 0; box-shadow: none;
  /* Barre, puis la carte qui prend TOUT le reste. Sans cette rangée 1fr, la
     carte se calait sur sa hauteur naturelle et se réduisait à un bandeau,
     laissant un grand vide sous le titre. */
  display: grid;
  grid-template-rows: auto 1fr;
}
/* Dans la scène de la démo, le titre du projet est déjà porté par la barre du
   bas : ce bloc ne faisait que repousser la carte. */
.nj-embed .map-intro { display: none; }
/* La liste dépliable ferait double emploi avec la liste déroulante des
   catégories, juste au-dessus, et mangerait la moitié du cadre. */
.nj-embed .poi-summary { display: none; }
.nj-embed .loc-barre { padding: .6rem .9rem; border-bottom: 1px solid rgba(17,24,39,.08); }
/* Cadre embarqué : la carte est projetée sur un grand écran et regardée à
   distance. Les commandes y gagnent un cran de plus que dans la page. */
.nj-embed .poi-sort,
.nj-embed .poi-filter { font-size: 1rem; min-height: 42px; }
.nj-embed .poi-filter option { font-size: 1rem; }

.nj-embed #projectMap { height: 100%; min-height: 0; }

  /* Même en cadre étroit, la carte garde la hauteur restante. */
  .nj-embed .loc-shell { height: 100vh; }
  .nj-embed #projectMap { height: 100%; }
}

/* ── Filtres de POI : la meme gamme pastel que les criteres des logements ──
   Trois menus deroulants gris cote a cote se lisaient comme un formulaire.
   Meme recette que sur disponibilites.html : une teinte par filtre, en gras,
   pour qu'on distingue d'un coup d'oeil « la categorie » du « temps de
   marche » et du « point a rejoindre ».

   La teinte est posee TRANSLUCIDE par-dessus le fond du theme, et non melangee
   a une variable : melangee, elle restait claire en mode nocturne. Ici le fond
   du dessous fournit le clair ou le sombre, la couleur ne fait que teinter. */
.poi-filter { font-weight: 700; }

#poiCatFilter {
  background-image: linear-gradient(rgba(46,125,91,.14), rgba(46,125,91,.14));
  border-color: rgba(46,125,91,.34);
}
#poiDistanceFilter {
  background-image: linear-gradient(rgba(194,118,27,.14), rgba(194,118,27,.14));
  border-color: rgba(194,118,27,.34);
}
#poiPointFilter {
  background-image: linear-gradient(rgba(14,107,168,.14), rgba(14,107,168,.14));
  border-color: rgba(14,107,168,.34);
}
/* Le mode « Reperes » reutilise l'identifiant poiPointFilter pour son unique
   menu : il herite donc du bleu ci-dessus, ce qui est coherent — c'est le meme
   geste, « aller a un endroit ». Pas de regle propre : elle serait morte. */
