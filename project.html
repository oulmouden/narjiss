<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narjiss - Projet</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css">
<link rel="stylesheet" href="assets/vendor/pannellum/pannellum.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@3.1.0/Leaflet.PolylineMeasure.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@3.1.0/Leaflet.PolylineMeasure.js"></script>
<script src="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.js"></script>
<script src="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.umd.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
<style>
:root {
  --ink: #1f2430;
  --ivory: #f3f6fa;
  --gold: #c15a00;
  --gold-soft: #ffb020;
  --bronze: #b45309;
  --jade: #00aeef;
  --smoke: #ffffff;
}
body { background: var(--ivory); }
.project-shell { overflow: hidden; }
.media-showcase {
  background: white;
  border-bottom: 1px solid rgba(17,24,39,.1);
}
.property-toolbar {
  width: min(1600px, calc(100% - 40px));
  margin: 0 auto;
  padding: 1rem 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.property-toolbar a,
.property-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  color: var(--ink);
  text-decoration: none;
  border: 0;
  background: transparent;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
}
.property-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.media-wall {
  width: min(1600px, calc(100% - 40px));
  margin: 0 auto;
  padding-bottom: 1.1rem;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(260px, .58fr) minmax(260px, .58fr);
  grid-template-rows: 305px 305px;
  gap: .7rem;
}
.media-tile {
  position: relative;
  overflow: hidden;
  background: #dbe7f8;
}
.media-tile img,
.media-tile iframe {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: 0;
}
.media-tile.floor-plan-tile {
  background: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
}
.floor-plan-link {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}
.floor-plan-link:hover img,
.floor-plan-link:focus-visible img {
  transform: scale(1.025);
}
.media-tile.floor-plan-tile img {
  object-fit: contain;
  padding: clamp(.55rem, 1.2vw, 1rem);
  transition: transform var(--duration-fast) var(--ease-out);
}
.media-tile.main {
  grid-row: 1 / span 2;
  border-radius: 16px 0 0 16px;
}
.media-tile.top-last { border-radius: 0 16px 0 0; }
.media-tile.last { border-radius: 0 0 16px 0; }
.media-badge,
.floor-badge,
.photos-badge {
  position: absolute;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  border-radius: 7px;
  background: rgba(255,255,255,.94);
  color: var(--ink);
  font-weight: 850;
  box-shadow: 0 8px 22px rgba(17,24,39,.16);
}
.media-badge { top: 1.1rem; left: 1.1rem; padding: .48rem .72rem; }
.media-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5a5f; }
.floor-badge { top: .85rem; left: .85rem; padding: .42rem .65rem; background: rgba(31,36,48,.74); color: white; }
.photos-badge { right: 1.1rem; bottom: 1.1rem; padding: .68rem .9rem; }
.tour-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, rgba(31,36,48,.02), rgba(31,36,48,.36));
}
.tour-trigger {
  width: 156px;
  height: 156px;
  border: 0;
  border-radius: 50%;
  background: rgba(31,36,48,.76);
  color: white;
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 18px 44px rgba(17,24,39,.28);
}
.tour-trigger span { font-size: 3.4rem; line-height: 1; }
.tour-pill {
  position: absolute;
  top: calc(50% + 64px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(31,36,48,.8);
  color: white;
  border-radius: 999px;
  padding: .42rem .75rem;
  font-weight: 900;
  white-space: nowrap;
}
.property-summary {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 1.4rem 0 1.5rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1.4rem;
  align-items: end;
}
.property-summary h1 {
  margin: 0;
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.45rem, 3.1vw, 2.65rem);
  line-height: 1.08;
}
html[dir=rtl] .property-summary h1 {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.25rem, 2.6vw, 2.1rem);
  line-height: 1.24;
}
.property-summary p {
  margin: .55rem 0 0;
  color: var(--muted);
  font-size: 1.05rem;
}
.media-tour-modal {
  position: fixed;
  inset: 0;
  z-index: 12000;
  display: none;
  background: rgba(17,24,39,.72);
  padding: 2rem;
}
.media-tour-modal.open { display: grid; place-items: center; }
.media-tour-panel {
  width: min(1180px, 100%);
  height: min(760px, 86vh);
  background: white;
  border-radius: 12px;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.media-tour-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .8rem 1rem;
  border-bottom: 1px solid rgba(17,24,39,.1);
}
.media-tour-head button {
  border: 0;
  background: #f3f6fa;
  border-radius: 8px;
  padding: .45rem .7rem;
  cursor: pointer;
  font: inherit;
  font-weight: 800;
}
.media-tour-frame,
.media-tour-missing {
  width: 100%;
  height: 100%;
  border: 0;
}
.media-tour-missing {
  display: grid;
  place-items: center;
  text-align: center;
  padding: 2rem;
  color: var(--muted);
}
.media-tour-missing strong { display: block; color: var(--ink); font-size: 1.3rem; margin-bottom: .5rem; }
.project-hero {
  position: relative;
  min-height: clamp(540px, 72vh, 680px);
  display: grid;
  align-items: center;
  color: white;
  background:
    linear-gradient(135deg, rgba(31,36,48,.18) 0%, rgba(0,174,239,.56) 48%, rgba(193,90,0,.36) 100%),
    var(--project-gradient, linear-gradient(135deg, #00aeef, #7dd3fc 58%, #ffb020));
}
.project-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.62), transparent 76%);
}
.hero-inner {
  position: relative;
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 3.25rem 0 3.5rem;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  padding: .38rem .75rem;
  border: 1px solid rgba(255,255,255,.24);
  background: rgba(255,255,255,.1);
  backdrop-filter: blur(12px);
  border-radius: 999px;
  color: rgba(255,255,255,.78);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.hero-title {
  max-width: 900px;
  margin: 1.1rem 0 .85rem;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.85rem, 4.8vw, 3.65rem);
  line-height: 1.04;
  font-weight: 800;
}
html[dir=rtl] .hero-title {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.65rem, 4vw, 3rem);
  line-height: 1.22;
}
.hero-location { color: rgba(255,255,255,.76); font-size: clamp(1rem, 2vw, 1.25rem); }
.hero-panel {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1.5rem;
  align-items: end;
  margin-top: 1.6rem;
}
.hero-summary {
  max-width: 650px;
  color: rgba(255,255,255,.72);
  font-size: 1rem;
}
.hero-actions { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: flex-end; }
.btn-luxe {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  min-height: 46px;
  padding: .76rem 1.22rem;
  border-radius: 8px;
  text-decoration: none;
  font-family: 'Outfit', sans-serif;
  font-size: .92rem;
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: 0;
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.22);
  transition: transform .2s, background .2s, border-color .2s;
}
html[dir=rtl] .btn-luxe {
  font-family: 'Noto Sans Arabic', 'Outfit', sans-serif;
  font-size: .92rem;
  font-weight: 800;
}
.btn-luxe:hover { transform: translateY(-2px); }
.btn-gold {
  background: white;
  color: var(--gold);
  border-color: rgba(193,90,0,.45);
  box-shadow: 0 10px 24px rgba(31,36,48,.12);
}
.btn-gold:hover {
  background: var(--gold);
  color: white;
  border-color: var(--gold);
}
.btn-glass { color: white; background: rgba(255,255,255,.1); backdrop-filter: blur(10px); }
.property-summary .btn-glass {
  color: var(--ocean-deep);
  background: white;
  border-color: rgba(0,174,239,.28);
}
.btn-dark { background: var(--ink); color: white; border-color: var(--ink); }
.signature-strip {
  position: relative;
  background: white;
  color: var(--ink);
  border-top: 1px solid rgba(31,36,48,.08);
  border-bottom: 1px solid rgba(31,36,48,.08);
}
.signature-grid {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.signature-item {
  padding: 1.4rem 1.2rem;
  border-left: 1px solid rgba(31,36,48,.08);
}
.signature-item:last-child { border-right: 1px solid rgba(31,36,48,.08); }
.signature-label {
  color: var(--muted);
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: 1.6px;
}
.signature-value {
  margin-top: .2rem;
  color: var(--ocean-deep);
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
}
html[dir=rtl] .signature-value { font-family: 'Noto Sans Arabic', serif; }
.section {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 2.2rem 0;
}
.section-kicker {
  color: var(--bronze);
  font-size: clamp(1rem, 1.4vw, 1.28rem);
  text-transform: uppercase;
  letter-spacing: 2.4px;
  font-weight: 900;
  margin-bottom: .9rem;
}
.section h2 {
  max-width: 860px;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1rem, 2.15vw, 1.92rem);
  line-height: 1.16;
  color: var(--ink);
}
html[dir=rtl] .section h2 {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(.95rem, 1.85vw, 1.62rem);
  line-height: 1.28;
}
.editorial-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
  gap: 3rem;
  align-items: center;
}
.lead-copy {
  margin-top: 1.4rem;
  color: #55515a;
  font-size: 1.04rem;
  line-height: 1.9;
}
.atelier-card {
  border-radius: 8px;
  min-height: 230px;
  color: white;
  padding: clamp(1.4rem, 3vw, 2rem);
  display: flex;
  align-items: stretch;
  justify-content: center;
  background:
    linear-gradient(150deg, rgba(20,20,29,.90), rgba(20,20,29,.48)),
    var(--project-gradient, linear-gradient(135deg, #102f45, #d8a33d));
  box-shadow: 0 24px 70px rgba(20,20,29,.22);
  overflow: hidden;
  position: relative;
}
.atelier-card::before {
  content: "";
  position: absolute;
  inset: 1rem;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 6px;
  pointer-events: none;
}
.atelier-card::after {
  content: "";
  position: absolute;
  width: 42%;
  aspect-ratio: 1;
  right: -14%;
  bottom: -28%;
  border-radius: 50%;
  background: rgba(255,176,32,.18);
  pointer-events: none;
}
.atelier-content {
  position: relative;
  z-index: 1;
}
.atelier-icon {
  width: 54px;
  height: 54px;
  display: inline-grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.25);
  font-size: 1.85rem;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.25));
  margin-bottom: 1.4rem;
}
.atelier-card h3 {
  max-width: 520px;
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 3.2vw, 3rem);
  line-height: .98;
  margin: 0;
}
html[dir=rtl] .atelier-card h3 { font-family: 'Noto Sans Arabic', serif; line-height: 1.15; }
.atelier-card p {
  margin: .85rem 0 0;
  color: rgba(255,255,255,.76);
  font-size: 1rem;
  line-height: 1.45;
}
.project-visual {
  grid-column: 1 / -1;
  margin-top: 3rem;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(20,20,29,.16);
  border: 1px solid rgba(20,20,29,.08);
  background: var(--ink);
}
.project-visual img {
  display: block;
  width: 100%;
  height: clamp(280px, 36vw, 520px);
  object-fit: cover;
  object-position: center;
}
.project-visual-caption {
  padding: .85rem 1rem;
  color: rgba(255,255,255,.56);
  font-size: .78rem;
}
.experience-band {
  background: var(--smoke);
  border-top: 1px solid rgba(20,20,29,.06);
  border-bottom: 1px solid rgba(20,20,29,.06);
}
.experience-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: rgba(20,20,29,.08);
  border: 1px solid rgba(20,20,29,.08);
}
.experience-card {
  min-height: 190px;
  padding: 1.2rem;
  background: var(--ivory);
}
.experience-card .num {
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 2.1rem;
  font-weight: 800;
}
.experience-card h3 {
  margin: .7rem 0 .45rem;
  color: var(--ink);
  font-size: 1.2rem;
}
.experience-card p { color: #68636b; font-size: .92rem; line-height: 1.7; }
.map-composition {
  display: grid;
  grid-template-columns: 390px 1fr;
  border-radius: 8px;
  overflow: hidden;
  min-height: 520px;
  box-shadow: 0 24px 70px rgba(20,20,29,.15);
  border: 1px solid rgba(20,20,29,.08);
}
.map-aside {
  background: #f8fbff;
  color: var(--ink);
  display: grid;
  grid-template-rows: auto 1fr auto;
  max-height: 680px;
  overflow: hidden;
}
.map-intro {
  padding: 1.35rem 1.5rem 1rem;
  border-bottom: 1px solid rgba(17,24,39,.08);
}
.map-aside h3 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 2.8vw, 2.45rem);
  line-height: 1.08;
}
html[dir=rtl] .map-aside h3 {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.55rem, 2.5vw, 2.1rem);
  line-height: 1.28;
}
.map-aside p { margin-top: 1rem; color: var(--muted); line-height: 1.75; }
.coordinate { color: var(--gold); font-size: .82rem; margin-top: 1rem; font-weight: 800; }
#projectMap { min-height: 680px; width: 100%; z-index: 1; }
.map-composition.map-compact #projectMap { min-height: 380px; }
.map-composition.map-compact .map-aside { max-height: 380px; }
.map-tool-btn {
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: white;
  color: #222;
  font-size: 16px;
  font-weight: 800;
}
.map-tool-btn:hover { background: #f4f4f4; }
.poi-summary {
  overflow-y: auto;
  min-height: 0;
}
.poi-count {
  color: var(--ink);
  font-size: .9rem;
  font-weight: 700;
  padding: 1rem 1.2rem .7rem;
}
.poi-count span {
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 1.7rem;
  margin-right: .35rem;
}
html[dir=rtl] .poi-count span { margin-right: 0; margin-left: .35rem; }
.poi-chips {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
  padding: 0 1.2rem 1rem;
}
.poi-chip {
  display: inline-flex;
  align-items: center;
  gap: .28rem;
  padding: .28rem .55rem;
  border-radius: 999px;
  background: white;
  color: var(--ocean-deep);
  border: 1px solid rgba(0,174,239,.18);
  font-size: .72rem;
}
.poi-legend-marker {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid white;
  box-shadow: 0 1px 4px rgba(20,20,29,.25);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: white;
  flex: 0 0 22px;
}
.poi-legend-marker .poi-google-svg {
  width: 14px;
  height: 14px;
  stroke-width: 2.8;
}
.poi-category-btn .poi-legend-marker {
  width: 24px;
  height: 24px;
  flex-basis: 24px;
}
.poi-category-btn .poi-legend-marker .poi-google-svg {
  width: 15px;
  height: 15px;
}
.poi-note {
  color: var(--muted);
  font-size: .78rem;
  line-height: 1.55;
  padding: 1rem 1.2rem;
}
.map-actions {
  padding: 1rem 1.2rem 1.2rem;
  border-top: 1px solid rgba(17,24,39,.08);
  display: grid;
  gap: .55rem;
}
.map-actions .btn-luxe {
  width: 100%;
  min-height: 42px;
}
.btn-whatsapp {
  display: inline-flex;
  background: #25d366;
  color: white;
  border-color: #25d366;
}
.btn-whatsapp.show { display: inline-flex; }
.map-global-link {
  color: var(--ocean-deep);
  background: white;
  border-color: rgba(0,174,239,.24);
}
.poi-controls {
  padding: .85rem 1.2rem;
  border-top: 1px solid rgba(17,24,39,.08);
  border-bottom: 1px solid rgba(17,24,39,.08);
  background: white;
}
.poi-control-row {
  display: flex;
  align-items: center;
  gap: .45rem;
  flex-wrap: wrap;
  margin-bottom: .5rem;
}
.poi-control-row:last-child { margin-bottom: 0; }
.poi-control-row label {
  color: var(--muted);
  font-size: .68rem;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.poi-sort,
.poi-filter {
  border: 1px solid rgba(17,24,39,.12);
  background: #f8fbff;
  color: var(--ink);
  border-radius: 7px;
  padding: .28rem .55rem;
  font: inherit;
  font-size: .72rem;
}
.poi-sort {
  cursor: pointer;
}
.poi-sort.active {
  background: var(--gold);
  border-color: var(--gold);
  color: white;
