<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narjiss — Démonstration</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=18">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Acte 0 de la démonstration commerciale.

   Page à part entière, et non une option de carte.html : l'intro est faite
   pour une projection devant un client, pas pour un visiteur qui cherche un
   bien. La mêler à la carte publique imposerait à tout le monde une animation
   que l'on ne veut jouer qu'une fois, sur scène.
   ═══════════════════════════════════════════════════════════════════════════ */

html, body { height: 100%; margin: 0; overflow: hidden; }

/* La carte occupe tout l'écran : aucun cadre, aucun titre. Le client doit
   avoir l'impression de regarder le territoire, pas un site web. */
#demoMap {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: #0b1020;
}

/* Le menu est présent dès le départ — donc mesurable — mais invisible : c'est
   ainsi qu'on peut viser la position RÉELLE du logo pour l'atterrissage,
   plutôt que de la coder en dur et de la voir se décaler au premier
   changement de mise en page. */
#mainMenu {
  position: relative;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity .8s ease;
}
#mainMenu.nj-pose { opacity: 1; pointer-events: auto; }

/* ── Rideau ─────────────────────────────────────────────────────────────── */
#njRideau {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: radial-gradient(circle at 50% 45%, #16213e 0%, #070a14 70%);
  transition: opacity 1.6s ease, background 1.6s ease;
}
#njRideau.nj-leve { opacity: 0; pointer-events: none; }

/* ── Logo volant ────────────────────────────────────────────────────────────
   Deux éléments imbriqués, et non un seul : l'enveloppe se déplace
   horizontalement à vitesse constante pendant que le noyau tombe avec une
   accélération. La composition des deux dessine la courbe. Une seule
   transition n'aurait produit qu'une ligne droite, et offset-path n'est pas
   assez répandu pour une démo qui doit marcher sur la machine du client. */
#njVol {
  position: fixed;
  z-index: 35;
  left: 0; top: 0;
  pointer-events: none;
  transition: transform 1.7s linear;
}
#njVolNoyau {
  transition: transform 1.7s cubic-bezier(.55, 0, .85, .35);
}
#njVolLogo {
  display: flex;
  align-items: center;
  gap: .9rem;
  transform-origin: left center;
  transition: transform 1.7s cubic-bezier(.4, 0, .2, 1), opacity .35s ease;
}
#njVolLogo img {
  width: 118px; height: 118px;
  border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,.55);
}
#njVolTexte {
  color: #fff;
  font-family: 'Outfit', sans-serif;
  line-height: 1.05;
  white-space: nowrap;
}
#njVolTexte b {
  display: block;
  font-size: 2.6rem;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--sun, #e8a33d);
}
#njVolTexte span {
  display: block;
  font-size: .95rem;
  letter-spacing: .42em;
  opacity: .8;
}
#njVolLogo.nj-efface { opacity: 0; }

/* ── Accroche ───────────────────────────────────────────────────────────── */
#njAccroche {
  position: fixed;
  left: 50%; top: 62%;
  z-index: 36;
  transform: translate(-50%, 0);
  color: rgba(255,255,255,.82);
  font-family: 'Outfit', sans-serif;
  font-size: 1.05rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  text-align: center;
  opacity: 0;
  transition: opacity .9s ease;
  pointer-events: none;
}
#njAccroche.nj-visible { opacity: 1; }

/* ── Invite finale ──────────────────────────────────────────────────────── */
#njInvite {
  position: fixed;
  left: 50%; bottom: 2.2rem;
  z-index: 38;
  transform: translateX(-50%);
  padding: .7rem 1.5rem;
  border-radius: 999px;
  background: rgba(12,16,28,.82);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: .95rem;
  font-weight: 600;
  box-shadow: 0 16px 44px rgba(0,0,0,.4);
  opacity: 0;
  transition: opacity .7s ease;
  pointer-events: none;
  white-space: nowrap;
}
#njInvite.nj-visible { opacity: 1; }

/* ── Mention « passer » ─────────────────────────────────────────────────── */
#njPasser {
  position: fixed;
  right: 1.1rem; bottom: 1.1rem;
  z-index: 39;
  padding: .4rem .8rem;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 999px;
  background: rgba(12,16,28,.55);
  color: rgba(255,255,255,.8);
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .4s ease;
}
#njPasser:hover { color: #fff; border-color: rgba(255,255,255,.6); }
#njPasser[hidden] { display: none; }

/* ── Scène projet ───────────────────────────────────────────────────────── */
#njScene {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg, #fff);
}
#njScene[hidden] { display: none; }
/* Le navigateur accorde le plein écran mais n'impose aucune taille : sans ces
   règles, l'élément gardait ses dimensions de fenêtre et laissait des bandes
   noires autour — d'où un « appuyez sur Échap » sur un contenu qui, lui,
   n'était pas agrandi. Deux blocs séparés : un sélecteur inconnu invaliderait
   toute la règle qui le contient. */
#njScene:fullscreen { width: 100vw; height: 100vh; inset: 0; }
#njScene:-webkit-full-screen { width: 100vw; height: 100vh; inset: 0; }
#njSceneCadre { width: 100%; height: 100%; border: 0; display: block; }
/* Barre de la démo, en BAS de la scène. Elle était en haut et recouvrait le
   menu de la page chargée : le haut de l'écran appartient au contenu. Le nom
   du projet et le retour y tiennent ensemble — la page interne affiche bien
   son titre, mais il défile, et après deux minutes de présentation plus rien
   ne dit ce qu'on regarde. */
#njSceneBarre {
  position: fixed;
  left: 50%; bottom: 1rem;
  z-index: 52;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: .8rem;
  max-width: calc(100% - 2rem);
  padding: .4rem .5rem .4rem 1.1rem;
  border-radius: 999px;
  background: rgba(12,16,28,.8);
  box-shadow: 0 14px 36px rgba(0,0,0,.42);
  opacity: .62;
  transition: opacity .25s ease;
}
/* Discrète pendant la présentation, franche quand on la cherche : elle ne
   doit pas attirer l'œil au milieu d'une visite 360°. */
#njSceneBarre:hover, #njSceneBarre:focus-within { opacity: 1; }
#njSceneTitre {
  color: #fff;
  font-family: var(--font-serif, 'Playfair Display'), serif;
  font-size: .98rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#njRetourCarte {
  flex: none;
  padding: .35rem .9rem;
  border: 0;
  border-radius: 999px;
  background: rgba(255,255,255,.16);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s ease;
}
#njRetourCarte:hover { background: rgba(255,255,255,.32); }
/* Le plein écran peut être refusé (réglage du navigateur, fenêtre non
   focalisée) : on le dit plutôt que de laisser croire à une panne. */
#njSceneAide {
  color: rgba(255,255,255,.75);
  font-family: 'Outfit', sans-serif;
  font-size: .74rem;
  white-space: nowrap;
}
#njSceneAide[hidden] { display: none; }

/* ── Loupe de la pastille ───────────────────────────────────────────────── */
.nj-nom { overflow: hidden; text-overflow: ellipsis; }
.nj-loupe {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 21px; height: 21px;
  margin-inline-start: .4rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.28);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: .82rem;
  line-height: 1;
  cursor: zoom-in;
  transition: background .18s ease, transform .18s ease;
}
.nj-loupe:hover { background: rgba(255,255,255,.55); transform: scale(1.15); }

/* Attribution obligatoire, mais assourdie : présente et lisible de près,
   invisible depuis le fond de la salle. */
.leaflet-control-attribution {
  background: rgba(12,16,28,.45) !important;
  color: rgba(255,255,255,.55) !important;
  font-size: .62rem !important;
  padding: 1px 6px !important;
}
.leaflet-control-attribution a { color: rgba(255,255,255,.7) !important; }

/* ── Pastilles de projet ─────────────────────────────────────────────────
   Reprises telles quelles de carte.html : la démonstration doit montrer le
   site tel qu'il est, pas une variante inventée pour l'occasion. */
.project-name-marker {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 180px;
  min-width: 92px;
  min-height: 34px;
  padding: .34rem .75rem;
  background: var(--sun);
  color: white;
  border: 2px solid var(--sun);
  border-radius: 999px;
  box-shadow: 0 8px 22px rgba(17,24,39,.28);
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 900;
  line-height: 1.1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}
.project-name-marker::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 12px;
  height: 12px;
  background: var(--sun);
  border-right: 2px solid var(--sun);
  border-bottom: 2px solid var(--sun);
  transform: translateX(-50%) rotate(45deg);
}

/* Douze projets tiennent dans dix kilomètres : à l'échelle d'Agadir, dix
   paires d'étiquettes se recouvraient et six projets seulement restaient
   lisibles. Celles qui se gênent sont remontées, et un fil les rattache à
   leur emplacement réel — décaler sans relier aurait menti sur la position. */
.project-name-marker { transform: translateY(calc(-1 * var(--nj-decalage, 0px))); }
.nj-fil-repere {
  position: absolute;
  left: 50%;
  top: 100%;
  width: 2px;
  height: var(--nj-decalage, 0px);
  margin-top: 4px;
  background: var(--sun);
  opacity: .75;
  transform: translateX(-50%);
  pointer-events: none;
}

/* Chute des pastilles, décalée dans le temps par un délai calculé en JS. */
@keyframes njChute {
  from { opacity: 0; transform: translateY(-38px) scale(.75); }
  60%  { opacity: 1; transform: translateY(5px) scale(1.04); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.nj-tombe .project-name-marker {
  animation: njChute .9s cubic-bezier(.34, 1.4, .5, 1) backwards;
}

/* La cible du scénario respire, pour que le regard du client s'y pose sans
   qu'on ait à la désigner du doigt. */
@keyframes njBattement {
  0%, 100% { box-shadow: 0 8px 22px rgba(17,24,39,.28), 0 0 0 0 rgba(232,163,61,.55); }
  50%      { box-shadow: 0 8px 22px rgba(17,24,39,.28), 0 0 0 16px rgba(232,163,61,0); }
}
.nj-cible .project-name-marker {
  animation: njBattement 1.9s ease-out infinite;
  z-index: 500;
}

/* Une animation d'ouverture est un argument de vente, pas une obligation :
   qui a demandé moins de mouvement obtient la carte, directement. */
@media (prefers-reduced-motion: reduce) {
  #njVol, #njVolNoyau, #njVolLogo, #njRideau, #mainMenu { transition: none !important; }
  .nj-tombe .project-name-marker, .nj-cible .project-name-marker { animation: none !important; }
}
</style>
</head>
<body>

<div id="demoMap"></div>

<div id="mainMenu"></div>

<div id="njRideau"></div>

<div id="njVol"><div id="njVolNoyau"><div id="njVolLogo">
  <img src="images/logo-narjiss.jpg" alt="Narjiss Immobilière">
  <div id="njVolTexte"><b>NARJISS</b><span>IMMOBILIERE</span></div>
</div></div></div>

<!-- Le projet s'ouvre ici, en cadre intégré, plutôt que par une navigation :
     le navigateur quitte le plein écran dès qu'il change de page. En restant
     l'hôte, la démo garde le plein écran ET permet de revenir à la carte pour
     enchaîner sur un autre projet. -->
<div id="njScene" hidden>
  <!-- Pas d'attribut allowfullscreen : « allow » le remplace et Chrome
       avertit quand les deux coexistent. -->
  <iframe id="njSceneCadre" title="Projet" allow="fullscreen; geolocation; xr-spatial-tracking; gyroscope"></iframe>
  <!-- Barre unique en bas : le haut appartient au menu de la page chargée,
       et un rappel pose par-dessus le recouvrait. -->
  <div id="njSceneBarre">
    <span id="njSceneTitre"></span>
    <button type="button" id="njRetourCarte"></button>
    <span id="njSceneAide" hidden></span>
  </div>
</div>

<p id="njAccroche">Agadir</p>
<div id="njInvite"></div>
<button type="button" id="njPasser">Passer ⏎</button>

<script src="shared/menu.js?v=16"></script>
<script>
(function () {
  'use strict';

  var LANGUES = {
    fr: { accroche: 'Agadir', invite: 'Cliquez sur un projet pour commencer', passer: 'Passer ⏎',
          zoomer: 'Zoomer sur le projet', retour: '← Retour à la carte',
          pleinEcranRefuse: 'Plein écran refusé — appuyez sur F11' },
    en: { accroche: 'Agadir', invite: 'Click a project to begin', passer: 'Skip ⏎',
          zoomer: 'Zoom to project', retour: '← Back to map',
          pleinEcranRefuse: 'Full screen blocked — press F11' },
    ar: { accroche: 'أكادير', invite: 'انقر على مشروع للبدء', passer: 'تخطي ⏎',
          zoomer: 'تكبير المشروع', retour: '← العودة إلى الخريطة',
          pleinEcranRefuse: 'تم رفض ملء الشاشة — اضغط F11' },
    es: { accroche: 'Agadir', invite: 'Haga clic en un proyecto para empezar', passer: 'Saltar ⏎',
          zoomer: 'Acercar al proyecto', retour: '← Volver al mapa',
          pleinEcranRefuse: 'Pantalla completa denegada — pulse F11' }
  };

  // Le projet mis en avant : c'est le seul dont tous les médias immersifs
  // existent (360°, vidéos, visite 3D, grille de lots).
  var PROJET_VEDETTE = 'jawhara';

  // Intervalle entre deux pastilles. Devant un client, chaque apparition doit
  // pouvoir être commentée : à 90 ms les douze projets tombaient en une
  // seconde, on n'avait pas le temps de les nommer. À 600 ms, la douzaine
  // s'étale sur sept secondes — le rythme d'une phrase par projet.
  var CADENCE_PASTILLE = 600;

  // Zoom atteint par la loupe. 18 plutôt que le maximum absolu (22) : au-delà
  // de 19, l'imagerie satellite est interpolée et devient floue.
  var ZOOM_RAPPROCHE = 18;

  // Marqueur de version pour la page chargée dans la scène. À incrémenter
  // quand project.html change, sinon le cadre resservira l'ancienne copie.
  var VERSION = '5';

  var carte = null, pastilles = [], langue = 'fr';
  var minuteries = [], termine = false, premierRendu = true;

  function t(cle) { return (LANGUES[langue] || LANGUES.fr)[cle]; }
  function $(id) { return document.getElementById(id); }

  /* Un seul registre de minuteries : « passer » doit pouvoir toutes les
     annuler d'un coup, sinon une étape en retard viendrait réécrire l'état
     final quelques secondes après qu'on l'a atteint. */
  function plusTard(ms, fn) { minuteries.push(window.setTimeout(fn, ms)); }
  function toutAnnuler() { minuteries.forEach(clearTimeout); minuteries = []; }

  function mouvementReduit() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  /* ── Carte ─────────────────────────────────────────────────────────────── */

  function projetsAgadir() {
    // Le cadrage final se déduit des projets réellement présents autour
    // d'Agadir : ajouter un projet demain recadrera la vue tout seul.
    return (window.PROJECTS || []).filter(function (p) {
      return p.lat > 30.0 && p.lat < 30.8 && p.lng > -9.9 && p.lng < -9.2;
    });
  }

  function creerCarte() {
    carte = L.map('demoMap', {
      zoomControl: false,
      maxZoom: 22, zoomSnap: .25
    }).setView([31.5, -8], 5.4);

    // L'attribution reste : l'imagerie satellite d'Esri est sous licence, et
    // la retirer parce que c'est « juste une démo » n'est pas une option. Elle
    // est simplement rendue discrète par le CSS.
    carte.attributionControl.setPrefix('');

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri', maxNativeZoom: 19, maxZoom: 22
    }).addTo(carte);

    // Le décalage dépend des positions à l'écran : il est donc recalculé à
    // chaque déplacement, sans quoi un zoom manuel du présentateur laisserait
    // les étiquettes désolidarisées de leurs points.
    carte.on('moveend zoomend', demelerPastilles);
  }

  function poserPastilles(anime) {
    var liste = window.PROJECTS || [];
    for (var i = 0; i < liste.length; i++) {
      var p = liste[i];
      if (typeof p.lat !== 'number' || typeof p.lng !== 'number') continue;

      var nom = (p.name && (p.name[langue] || p.name.fr)) || p.id;
      var vedette = p.id === PROJET_VEDETTE;
      var classes = (anime ? 'nj-tombe ' : '') + (vedette ? 'nj-cible' : '');

      /* Deux actions distinctes sur une même pastille : le nom ouvre le
         projet, la loupe s'en approche. Les séparer évite qu'un geste de
         cadrage fasse basculer la présentation sur une autre page. */
      var icone = L.divIcon({
        html: '<div class="project-name-marker">' +
                '<span class="nj-fil-repere"></span>' +
                '<span class="nj-nom">' + nom + '</span>' +
                '<button type="button" class="nj-loupe" tabindex="-1" ' +
                  'aria-label="' + t('zoomer') + ' — ' + nom + '" title="' + t('zoomer') + '">⌖</button>' +
              '</div>',
        iconSize: [180, 42], iconAnchor: [90, 40], className: classes
      });

      var marqueur = L.marker([p.lat, p.lng], {
        icon: icone,
        zIndexOffset: vedette ? 2000 : 1000,
        keyboard: true,
        title: nom
      }).addTo(carte);

      /* Écouteur natif posé sur l'élément, et non m.on('click') : le plein
         écran n'est accordé qu'à l'intérieur d'un geste utilisateur, et le
         passage par le système d'événements de Leaflet fait perdre cette
         « activation » — le navigateur ouvrait alors la scène en fenêtré.
         disableClickPropagation empêche par ailleurs la carte de réagir. */
      (function (id, m, libelle) {
        var conteneur = m.getElement();
        if (!conteneur) return;
        L.DomEvent.disableClickPropagation(conteneur);
        conteneur.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (ev.target.closest('.nj-loupe')) {
            carte.flyTo(m.getLatLng(), ZOOM_RAPPROCHE, { duration: 1.8 });
            return;
          }
          ouvrirProjet(id, libelle);
        });
      })(p.id, marqueur, nom);

      /* Le décalage de chute est posé sur l'élément, pas dans la feuille de
         style : le nombre de projets n'est pas connu à l'écriture du CSS.

         Il doit viser .project-name-marker et NON le conteneur renvoyé par
         getElement() : l'animation est déclarée sur l'enfant. Posé sur le
         parent, le délai n'avait aucun effet et les douze pastilles tombaient
         toutes en même temps. */
      if (anime) {
        var conteneur = marqueur.getElement();
        var label = conteneur && conteneur.querySelector('.project-name-marker');
        if (label) label.style.animationDelay = (i * CADENCE_PASTILLE) + 'ms';
      }
      pastilles.push(marqueur);
    }
  }

  /**
   * Écarte verticalement les étiquettes qui se recouvrent.
   *
   * On ne décale qu'en hauteur : le fil de rappel reste alors une simple
   * verticale, sans calcul d'angle, et l'œil suit sans effort. Les étiquettes
   * les plus au nord sont posées d'abord, pour que l'ordre du résultat ne
   * dépende pas de l'ordre de projects.json.
   */
  function demelerPastilles() {
    var elements = [];
    pastilles.forEach(function (m) {
      var el = m.getElement();
      if (!el) return;
      var label = el.querySelector('.project-name-marker');
      if (!label) return;
      label.style.setProperty('--nj-decalage', '0px');   // repartir à plat
      elements.push({ el: el, label: label, point: carte.latLngToContainerPoint(m.getLatLng()) });
    });
    elements.sort(function (a, b) { return a.point.y - b.point.y; });

    var poses = [];
    var seChevauchent = function (a, b) {
      return !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
    };

    elements.forEach(function (e) {
      var r = e.label.getBoundingClientRect();
      var demi = r.width / 2, h = r.height;
      var base = { x1: e.point.x - demi, x2: e.point.x + demi, y1: e.point.y - h, y2: e.point.y };

      var decalage = 0, pas = h + 8, essais = 0;
      var candidat = base;
      while (essais < 8 && poses.some(function (p) { return seChevauchent(candidat, p); })) {
        essais++;
        decalage = essais * pas;
        candidat = { x1: base.x1, x2: base.x2, y1: base.y1 - decalage, y2: base.y2 - decalage };
      }
      poses.push(candidat);
      e.label.style.setProperty('--nj-decalage', decalage + 'px');
    });
  }

  function cadrerAgadir(duree) {
    var proches = projetsAgadir();
    if (!proches.length) { carte.flyTo([30.42, -9.6], 12, { duration: duree }); return; }
    var groupe = L.featureGroup(proches.map(function (p) { return L.marker([p.lat, p.lng]); }));
    carte.flyToBounds(groupe.getBounds().pad(0.55), { duration: duree });
  }

  /* ── Vol du logo ───────────────────────────────────────────────────────── */

  /**
   * Place l'ensemble volant à un point donné de l'écran.
   * On sépare X (enveloppe) et Y (noyau) pour que leurs courbes de temps
   * puissent différer — c'est ce décalage qui produit la trajectoire arquée.
   */
  function placerVol(x, y, echelle) {
    $('njVol').style.transform = 'translateX(' + x + 'px)';
    $('njVolNoyau').style.transform = 'translateY(' + y + 'px)';
    $('njVolLogo').style.transform = 'scale(' + echelle + ')';
  }

  /** Position d'arrivée : celle du vrai logo du menu, mesurée à l'instant. */
  function cibleMenu() {
    var logo = document.querySelector('#mainMenu .logo-image, #mainMenu .logo img, #mainMenu img');
    if (!logo) return { x: 24, y: 18, echelle: .34 };
    var r = logo.getBoundingClientRect();
    return { x: r.left, y: r.top, echelle: Math.max(.22, r.width / 118) };
  }

  function departVol() {
    return {
      x: window.innerWidth / 2 - 190,
      y: window.innerHeight / 2 - 100,
      echelle: 1
    };
  }

  /* ── Déroulé ───────────────────────────────────────────────────────────── */

  function etatFinal() {
    if (termine) return;
    termine = true;
    toutAnnuler();

    $('njRideau').classList.add('nj-leve');
    $('njVolLogo').classList.add('nj-efface');
    $('njAccroche').classList.remove('nj-visible');
    $('mainMenu').classList.add('nj-pose');
    $('njPasser').hidden = true;

    if (!pastilles.length) poserPastilles(false);
    cadrerAgadir(mouvementReduit() ? 0 : .8);

    $('njInvite').textContent = t('invite');
    $('njInvite').classList.add('nj-visible');
  }

  function jouer() {
    var depart = departVol();
    placerVol(depart.x, depart.y, depart.echelle);

    // Sans mouvement : on saute directement à la carte cadrée.
    if (mouvementReduit()) { etatFinal(); return; }

    // 1. Le nom s'installe sous le logo.
    plusTard(700, function () {
      $('njAccroche').textContent = t('accroche');
      $('njAccroche').classList.add('nj-visible');
    });

    // 2. Le rideau se lève : le territoire apparaît derrière la marque.
    plusTard(1700, function () { $('njRideau').classList.add('nj-leve'); });

    // 3. Le logo s'envole vers sa place définitive.
    plusTard(2000, function () {
      $('njAccroche').classList.remove('nj-visible');
      var cible = cibleMenu();
      placerVol(cible.x, cible.y, cible.echelle);
    });

    // 4. Descente sur Agadir, engagée pendant le vol : les deux mouvements
    //    se répondent au lieu de se succéder.
    plusTard(2350, function () { cadrerAgadir(2.6); });

    // 5. Le logo se pose : le vrai menu prend le relais du logo volant.
    plusTard(3700, function () {
      $('mainMenu').classList.add('nj-pose');
      $('njVolLogo').classList.add('nj-efface');
    });

    // 6. Les projets tombent un à un.
    plusTard(4900, function () { poserPastilles(true); });

    // 7. L'invite, une fois la DERNIÈRE pastille posée : le délai se calcule
    //    sur le nombre de projets, il ne peut pas être une constante.
    var finCascade = 4900 + ((window.PROJECTS || []).length * CADENCE_PASTILLE) + 900;
    plusTard(finCascade, function () {
      termine = true;
      $('njPasser').hidden = true;
      demelerPastilles();   // les douze sont posées : on les rend toutes lisibles
      $('njInvite').textContent = t('invite');
      $('njInvite').classList.add('nj-visible');
    });
  }

  /* ── Amorçage ──────────────────────────────────────────────────────────── */

  /* ── Scène projet ──────────────────────────────────────────────────────── */

  /**
   * Ouvre un projet par-dessus la carte, en plein écran.
   *
   * En cadre intégré et non par une navigation : le navigateur quitte le
   * plein écran dès qu'il change de document. En restant l'hôte, la démo le
   * conserve — et permet de revenir choisir un autre projet, ce qu'un aller
   * simple aurait interdit.
   */
  function ouvrirProjet(id, nom) {
    var scene = $('njScene');

    /* L'élément doit être affiché AVANT la demande : un élément masqué ne
       peut pas passer en plein écran. */
    $('njSceneTitre').textContent = nom || '';
    scene.hidden = false;
    $('njRetourCarte').textContent = t('retour');

    /* Puis la demande, immédiatement — avant de charger le cadre. Le
       navigateur n'accorde le plein écran que pendant le bref instant qui
       suit un geste utilisateur ; toute opération intercalée risque de
       consommer cette autorisation. */
    var aide = $('njSceneAide');
    aide.hidden = true;
    var refus = function () {
      // Un refus n'est pas bloquant : la scène couvre déjà toute la fenêtre.
      // Seules les barres du navigateur subsistent, et F11 les enlève.
      aide.textContent = t('pleinEcranRefuse');
      aide.hidden = false;
    };
    var demande = scene.requestFullscreen || scene.webkitRequestFullscreen;
    if (!demande) { refus(); }
    else {
      try {
        var promesse = demande.call(scene);
        // Une demande refusée rejette une promesse : sans interception, la
        // console se remplit d'erreurs à chaque ouverture.
        if (promesse && promesse.catch) promesse.catch(refus);
      } catch (e) { refus(); }
    }

    /* &v= : project.html n'a pas de marqueur de version dans son URL. Sans
       lui, le cadre resservirait indéfiniment la copie en cache du
       navigateur, y compris après un déploiement. */
    $('njSceneCadre').src = 'project.html?id=' + encodeURIComponent(id) +
      '&v=' + VERSION + '#' + langue;
  }

  function fermerScene() {
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
    $('njScene').hidden = true;
    // Vider la source libère la page : sans ça une visite 360° continuerait
    // de tourner derrière la carte.
    $('njSceneCadre').removeAttribute('src');
  }

  function sceneOuverte() { return !$('njScene').hidden; }

  /** Remet la scène à zéro pour un nouveau départ. */
  function reinitialiser() {
    toutAnnuler();
    termine = false;
    pastilles.forEach(function (m) { carte.removeLayer(m); });
    pastilles = [];
    $('njRideau').classList.remove('nj-leve');
    $('njVolLogo').classList.remove('nj-efface');
    $('njInvite').classList.remove('nj-visible');
    $('njAccroche').classList.remove('nj-visible');
    $('mainMenu').classList.remove('nj-pose');
    $('njPasser').hidden = false;
    $('njPasser').textContent = t('passer');
    // Sans transition : le retour au point de départ ne doit pas se voir.
    carte.setView([31.5, -8], 5.4, { animate: false });
  }

  /**
   * Changer de langue relance la démonstration dans cette langue — c'est
   * l'usage attendu : on choisit sa langue, la présentation démarre. Le
   * premier appel vient d'initPage et ne doit rien déclencher, sinon l'intro
   * jouerait deux fois au chargement.
   */
  window.onLanguageChange = function (lang) {
    langue = lang;
    $('njPasser').textContent = t('passer');
    if (premierRendu) { premierRendu = false; return; }
    reinitialiser();
    jouer();
  };

  // Poignée de pilotage : utile pour régler la mise en scène depuis la
  // console, et socle du futur mode kiosque.
  window.njDemo = {
    rejouer: function () { reinitialiser(); jouer(); },
    finir: function () { etatFinal(); },
    carte: function () { return carte; }
  };

  document.addEventListener('DOMContentLoaded', function () {
    creerCarte();

    // « Passer » et Échap/Entrée/Espace : indispensables quand on répète la
    // démonstration vingt fois, ou qu'un client arrive en avance.
    $('njPasser').addEventListener('click', etatFinal);
    $('njRetourCarte').addEventListener('click', fermerScene);
    document.addEventListener('keydown', function (e) {
      // Quand un projet est ouvert, Échap le referme au lieu d'agir sur
      // l'intro, qui est de toute façon terminée à ce stade.
      if (sceneOuverte()) {
        if (e.key === 'Escape') { fermerScene(); }
        return;
      }
      if (['Escape', 'Enter', ' '].indexOf(e.key) >= 0) { e.preventDefault(); etatFinal(); }
    });
    // Sortir du plein écran par la touche du navigateur doit aussi refermer
    // la scène, sinon le projet resterait affiché en fenêtré par-dessus la carte.
    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement && sceneOuverte()) fermerScene();
    });

    // initPage charge data/projects.json, installe le menu, puis appelle
    // onLanguageChange : les pastilles ont besoin des deux.
    initPage('demo', '');

    // ?direct=1 pour ouvrir sur la carte cadrée, sans intro.
    var direct = new URLSearchParams(location.search).has('direct');
    var lancer = function () { if (direct) etatFinal(); else jouer(); };

    // On attend les projets : sans eux, ni pastilles ni cadrage d'Agadir.
    var essais = 0;
    (function attendreProjets() {
      if (window.PROJECTS && window.PROJECTS.length) { lancer(); return; }
      if (++essais > 60) { lancer(); return; }   // au pire, l'intro joue seule
      window.setTimeout(attendreProjets, 100);
    })();
  });
})();
</script>
</body>
</html>
