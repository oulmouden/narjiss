# ============================================================================
#  RÈGLE DE MAINTENANCE nginx — Narjiss (à ajouter UNE SEULE FOIS au vhost)
# ============================================================================
#  ⚠️ OÙ L'AJOUTER — le vhost contient PLUSIEURS blocs « server ». La règle doit
#  aller dans le bloc de TÊTE, celui qui écoute sur « 443 ssl » et porte
#  « server_name www.narjiss.company », au niveau du bloc server lui-même :
#  juste après « root /home/narjiss/htdocs/www.narjiss.company; » et AVANT le
#  premier « location ». À ce niveau, la règle s'évalue en phase rewrite, donc
#  pour TOUTES les requêtes, quel que soit le location qui les servira ensuite.
#
#  NE PAS se contenter du bloc « listen 8080 » (le backend). Panne du
#  31/08/2026 : la règle n'y était que là, or le bloc de tête sert désormais les
#  pages HTML directement depuis le disque —
#      location ~* \.html$   { try_files $uri =404; }
#      location = /          { try_files /index.html =404; }
#  — sans jamais passer par :8080. Résultat : pages en 200, API et JSON en 503.
#  Le site avait l'air en ligne avec un catalogue vide et l'hôtesse IA muette.
#  La copie dans le bloc :8080 peut rester : redondance sans effet de bord.
#
#  Idéalement via CloudPanel : Sites > narjiss > onglet « Vhost » > coller ce
#  bloc au bon endroit > Save (CloudPanel teste et recharge nginx tout seul).
#  Ainsi la règle survit aux régénérations de CloudPanel — une édition faite en
#  SSH directement dans /etc/nginx/sites-enabled/ serait écrasée à la première
#  régénération, sans avertissement.
#
#  Après avoir collé : « bash maintenance.sh on » doit afficher 503 sur les DEUX
#  URL sondées. Un seul 503 = règle dans un seul bloc, correctif incomplet.
#
#  Ensuite, plus jamais besoin de toucher nginx : la maintenance s'active/
#  désactive en créant/supprimant le fichier .maintenance dans le docroot
#  (c'est ce que fait maintenance.sh). Aucun reload nécessaire.
#
#  Renvoie un vrai HTTP 503 (préserve le référencement) et sert maintenance.html.
# ----------------------------------------------------------------------------

  # === Mode maintenance (drapeau .maintenance dans le docroot) ===
  set $maintenance 0;
  if (-f $document_root/.maintenance) { set $maintenance 1; }
  if ($uri = /maintenance.html)       { set $maintenance 0; }  # évite la boucle
  # (optionnel) aperçu admin : décommentez et changez le secret pour voir le
  # vrai site pendant la maintenance via  ?apercu=MON_SECRET
  # if ($arg_apercu = "MON_SECRET")     { set $maintenance 0; }
  if ($maintenance = 1) { return 503; }
  error_page 503 /maintenance.html;
  # =================================================================
