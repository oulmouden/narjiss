<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite 360°</title>

<!--
  PREUVE DE CONCEPT — visionneuse de remplacement pour les tours 3DVista.

  Pourquoi : le Live Tour de 3DVista dépend de remote.3dvista.com et se montre
  capricieux sur smartphone. Ici, tout est servi par notre propre serveur.

  Les images sont EXACTEMENT celles de l'export 3DVista (<tour>/media/…) : cette
  page ne duplique aucun média. La description des scènes vient de
  <tour>/tour-pannellum.json, produit par tools/extract_3dvista_tour.js.

  Choix du tour par l'URL, la page sert les trois :
    tour-360.html?tour=jawhara/Tour
    tour-360.html?tour=jawhara/Tour-FloorPlan
    tour-360.html?tour=jawhara/tour-bureau

  À la racine du site et non dans jawhara/ : deploy.sh n'envoie que les .html
  de la racine (bucket « code ») et le contenu des dossiers de visite
  (bucket « tours »). Une page rangée dans jawhara/ ne partirait jamais.
-->

<link rel="stylesheet" href="assets/vendor/pannellum/pannellum.css">
<style>
  :root {
    --or: #e8a838;
    --nuit: #0f1117;
    --rail: 96px;                          /* hauteur du bandeau de vignettes */
    --marge: env(safe-area-inset-bottom, 0px); /* barre d'accueil des iPhone */
    --barre: 0px;                          /* barre de visite guidée, mesurée en JS */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100vh;
    height: 100dvh;   /* suit le repli des barres du navigateur mobile */
    background: var(--nuit); color: #fff;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    /* Sans ça, un glissement vers le bas dans le panorama déclenche le
       « tirer pour rafraîchir » de Chrome Android au lieu de tourner la vue. */
    overscroll-behavior: none;
  }

  /* Hauteur EXPLICITE, et non un calage par `inset` : pannellum.css impose
     `height: 100%` à son conteneur, ce qui écrasait le calage et faisait
     déborder le panorama de 96 px sous le bandeau — son centre optique se
     retrouvait caché. Le sélecteur par identifiant l'emporte sur la classe. */
  #scene {
    position: absolute; top: 0; left: 0; right: 0;
    height: calc(100dvh - var(--rail) - var(--marge) - var(--barre));
    /* Les gestes appartiennent à Pannellum, pas au navigateur. */
    touch-action: none;
  }

  /* Colonne d'habillage, à droite. Le coin supérieur GAUCHE est celui de
     Pannellum : zoom et plein écran s'y trouvent, et tout ce qu'on y poserait
     les recouvrirait. */
  #surcouche {
    position: absolute; top: 16px; right: 16px; z-index: 6;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: min(340px, 62vw);
    /* Le conteneur laisse passer les gestes vers le panorama ; seuls ses
       enfants reprennent la main. */
    pointer-events: none;
  }

  #surcouche > *, #ligneHaut > * { pointer-events: auto; }

  #ligneHaut {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* Nom de la pièce, en surimpression. */
  #piece {
    padding: 8px 16px; border-radius: 999px;
    background: rgba(15, 17, 23, 0.72);
    backdrop-filter: blur(6px);
    font-size: 15px; font-weight: 600;
    pointer-events: none;
  }

  /* Bandeau de vignettes : accès direct à chaque pièce. */
  #pieces {
    position: absolute; left: 0; right: 0; z-index: 5;
    bottom: var(--barre);   /* posé au-dessus de la barre de visite guidée */
    height: calc(var(--rail) + var(--marge));
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + var(--marge));
    background: rgba(15, 17, 23, 0.92);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain; /* le défilé du rail ne fait pas reculer la page */
  }

  .vignette {
    flex: 0 0 auto; width: 104px; height: 68px;
    border: 2px solid transparent; border-radius: 8px;
    background: #222;
    cursor: pointer; position: relative;
    padding: 0; overflow: hidden;
    transition: border-color 0.15s ease, transform 0.08s ease;
  }

  /* L'aperçu remplit la vignette. `object-fit: cover` recadre au centre : sur
     un panorama équirectangulaire, cela tombe sur l'horizon — bien plus
     parlant qu'une réduction complète où l'on ne verrait que du plafond et du
     sol étirés. */
  .vignette img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 6px;
  }

  .vignette:hover { border-color: rgba(232, 168, 56, 0.6); }
  .vignette:active { transform: translateY(1px); }
  .vignette[aria-current="true"] { border-color: var(--or); }

  .vignette span {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 3px 6px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
    border-radius: 0 0 6px 6px;
    font-size: 10px; line-height: 1.2;
    /* Les noms de pièces sont longs ("chambre parentale virtuelle") : on coupe
       plutôt que de laisser la vignette s'étirer et casser l'alignement. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Bascule vide ↔ meublé. Placée sous le nom de la pièce, à la même verticale :
     c'est une propriété de la pièce affichée, pas une commande de la visite. */
  #variante {
    padding: 9px 16px; border: 0; border-radius: 999px;
    background: var(--or); color: #1b1400;
    font-family: inherit; font-size: 14px; font-weight: 700;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }

  #variante[hidden] { display: none; }
  #variante:hover { background: #f2b74a; }

  /* Mention de l'ameublement virtuel.
     Le meublé est le plus souvent une image de synthèse : elle ne doit jamais
     pouvoir passer pour l'état réel du bien. La mention reste donc affichée tant
     que cette vue est à l'écran — discrète, mais présente. */
  #mention {
    padding: 5px 12px; border-radius: 999px;
    background: rgba(15, 17, 23, 0.72);
    backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px; font-weight: 500;
    text-align: right;
    pointer-events: none;
  }

  #mention[hidden] { display: none; }

  /* --- Plan de sol ------------------------------------------------------
     Repris de l'export 3DVista : image du plan et position de chaque pièce. */
  #planBtn {
    padding: 8px 14px; border: 0; border-radius: 999px;
    background: rgba(15, 17, 23, 0.72);
    backdrop-filter: blur(6px);
    color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }

  #planBtn[aria-expanded="true"] { background: var(--or); color: #1b1400; }

  #plan {
    width: min(300px, 46vw);
    padding: 8px;
    border-radius: 12px;
    background: rgba(15, 17, 23, 0.92);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  #plan[hidden] { display: none; }

  /* Conteneur au ratio exact du plan : les pastilles sont posées en
     POURCENTAGE, elles restent donc justes à n'importe quelle taille. */
  #planCadre { position: relative; width: 100%; }
  #planCadre img { display: block; width: 100%; border-radius: 6px; }

  .planPt {
    position: absolute;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 0; padding: 0;
    border-radius: 50%;
    background: rgba(232, 168, 56, 0.85);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }

  .planPt[aria-current="true"] {
    background: #fff;
    box-shadow: 0 0 0 3px var(--or), 0 0 10px rgba(232, 168, 56, 0.9);
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
  }

  /* Le visiteur guidé voit où il se trouve, mais ne s'y déplace pas. */
  body.suit-le-guide .planPt { pointer-events: none; }

  /* Écran bas — téléphone en paysage : la colonne se resserre, les `top` ne
     sont plus à régler puisque tout est en flux. */
  @media (max-height: 480px) {
    #surcouche { top: 10px; right: 10px; gap: 6px; }
    #plan { width: min(220px, 34vw); }
    #planBtn { padding: 5px 10px; font-size: 12px; }
    #piece { padding: 5px 12px; font-size: 13px; }
    #variante { padding: 6px 12px; font-size: 12px; }
    #mention { font-size: 11px; padding: 4px 10px; }
  }

  #erreur {
    position: absolute; inset: 0; z-index: 10;
    display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }

  #erreur code {
    font-size: 12px; color: rgba(255, 255, 255, 0.6);
    max-width: 90vw; word-break: break-all;
  }

  /* Les flèches de passage d'une pièce à l'autre. Pannellum place un div vide,
     qu'il positionne à chaque image via un `transform` EN LIGNE.

     D'où la règle absolue : ne jamais animer `transform` sur ce div. Une
     animation CSS l'emporte sur le style en ligne — elle remplacerait donc le
     positionnement par son propre `scale`, et les pastilles s'empileraient
     toutes à l'origine du conteneur, hors écran, invisibles mais cliquables.

     Le div ne sert donc qu'à la position et à la zone de clic ; toute
     l'apparence, animation comprise, vit dans l'élément interne. */
  /* Aucune marge négative ici : Pannellum centre déjà la pastille sur son point,
     en retranchant la moitié de sa taille dans le `transform` qu'il calcule
     (`f[0] += (largeurToile - div.offsetWidth) / 2`). Une marge en plus
     décalerait chaque passage d'une demi-pastille vers le haut à gauche. */
  .passage {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }

  .passage b {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: rgba(232, 168, 56, 0.94);
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    color: #1b1400; font-size: 22px; font-weight: 700; line-height: 1;
    animation: pulse 2.2s ease-in-out infinite;
  }

  /* Passage habillé d'une image : on retire le fond et le cadre, l'image parle
     d'elle-même (flèche au sol, pictogramme). */
  .passage b.passage-image {
    background: none;
    box-shadow: none;
  }

  .passage b img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1);    opacity: 0.92; }
    50%      { transform: scale(1.12); opacity: 1; }
  }

  /* Un mouvement permanent gêne certaines personnes : on le coupe si le
     système le demande, la pastille reste parfaitement visible. */
  @media (prefers-reduced-motion: reduce) {
    .passage b { animation: none; }
  }

  /* Visiteur d'une visite guidée : il suit, il ne pilote pas. Les flèches et
     les vignettes deviennent inertes — sinon il change de pièce et la
     resynchronisation le ramène 200 ms plus tard, ce qui donne un va-et-vient
     incompréhensible. Même parti pris que le verrouillage du panorama et des
     cartes dans shared/liveguide.js. */
  body.suit-le-guide .passage,
  body.suit-le-guide .vignette { pointer-events: none; }

  /* Le visiteur guidé ne navigue pas : le bandeau ne lui sert à rien et, sur
     un téléphone, la barre de visite guidée viendrait s'empiler par-dessus.
     On le retire et l'image récupère la place. */
  body.suit-le-guide #pieces { display: none; }
  body.suit-le-guide #scene { height: calc(100dvh - var(--marge) - var(--barre)); }

  @media (max-width: 560px) {
    :root { --rail: 84px; }
    .vignette { width: 88px; height: 58px; }
    #piece { font-size: 13px; padding: 6px 12px; }
  }

  /* Téléphone en paysage : l'écran ne fait plus que ~375 px de haut, où le
     bandeau normal mangerait le quart de l'image. On le compacte — c'est
     justement l'orientation qu'on prend pour regarder un panorama. */
  @media (max-height: 480px) {
    :root { --rail: 62px; }
    .vignette { width: 74px; height: 42px; }
    .vignette span { font-size: 9px; }
    #pieces { gap: 6px; padding: 6px 10px calc(6px + var(--marge)); }
    #piece { font-size: 12px; padding: 5px 10px; top: 10px; left: 10px; }
  }
</style>
</head>
<body>

<div id="scene"></div>

<!-- Tout notre habillage tient dans une colonne à DROITE : le coin supérieur
     gauche appartient à Pannellum, qui y place ses commandes de zoom et de
     plein écran. Une colonne en flux plutôt que des `top` en pixels — un nom de
     pièce sur deux lignes décalait tout le reste. -->
<div id="surcouche">
  <div id="ligneHaut">
    <div id="piece">Chargement…</div>
    <button id="planBtn" type="button" aria-expanded="false" aria-controls="plan" hidden>🗺️ Plan</button>
  </div>
  <button id="variante" type="button" hidden></button>
  <div id="mention" hidden></div>
  <div id="plan" hidden>
    <div id="planCadre"><img id="planImg" alt="Plan de l'étage"></div>
  </div>
</div>

<div id="pieces"></div>

<div id="erreur">
  <strong>La visite n'a pas pu être chargée.</strong>
  <code id="erreurDetail"></code>
</div>

<!-- menu.js n'est pas là pour construire le menu (initPage n'est jamais appelé)
     mais pour installLiveGuide() : il détient LIVEGUIDE_VERSION, la version de
     cache de la visite guidée. La dupliquer ici, c'est se garantir un jour de
     débogage sur un liveguide.js périmé servi depuis le cache. -->
<script src="shared/menu.js?v=39"></script>
<script src="assets/vendor/pannellum/pannellum.js"></script>
<script>
(function () {
  'use strict';

  // Visiteur d'une visite guidée ? Détection identique à celle de liveguide.js,
  // faite AVANT de créer le panorama : il faut le brider dès sa construction.
  var suitLeGuide = (function () {
    try {
      var p = new URLSearchParams(location.search);
      if (p.get('lg')) return true;
      return sessionStorage.getItem('lg_role') === 'viewer';
    } catch (e) { return false; }
  })();
  if (suitLeGuide) document.body.classList.add('suit-le-guide');

  // Charge la visite guidée (config + css + cœur). Sans appel, cette page
  // resterait muette pendant une visite : elle n'a pas le reste du site.
  if (typeof installLiveGuide === 'function') installLiveGuide('');

  // Dossier du tour, choisi par l'URL. Filtré : on n'accepte qu'un chemin
  // relatif simple, sans remontée d'arborescence ni protocole.
  var demande = new URLSearchParams(location.search).get('tour') || '';
  var DOSSIER = /^[A-Za-z0-9_-]+(\/[A-Za-z0-9_-]+)*$/.test(demande)
    ? demande + '/'
    : 'jawhara/Tour/';
  var CONFIG = DOSSIER + 'tour-pannellum.json';

  var visionneuse = null;
  var scenes = {};

  fetch(CONFIG)
    .then(function (r) {
      if (!r.ok) throw new Error(CONFIG + ' → HTTP ' + r.status);
      return r.json();
    })
    .then(demarrer)
    .catch(function (e) { echouer(e.message); });

  /** Première valeur réellement fournie ; '' et null ne comptent pas. */
  function choisir(a, b) {
    return (a === undefined || a === null || a === '') ? b : a;
  }

  function demarrer(tour) {
    scenes = tour.scenes;
    var style = tour.passageStyle || {}; // habillage commun des passages
    appliquerEtat(tour, new URLSearchParams(location.search).get('etat'));

    var config = {
      default: {
        firstScene: tour.firstScene,
        sceneFadeDuration: 900,   // enchaînement doux, comme 3DVista
        autoLoad: true,
        hotSpotDebug: false,
        // Pendant une visite guidée, le visiteur regarde : on coupe ses propres
        // commandes. Appliqué ici plutôt que de compter sur le crochet de
        // liveguide.js — celui-ci n'enveloppe pannellum.viewer que s'il s'est
        // chargé avant, ce que rien ne garantit sur cette page.
        draggable: !suitLeGuide,
        mouseZoom: !suitLeGuide,
        keyboardZoom: !suitLeGuide,
        showControls: !suitLeGuide,
        autoRotate: false
      },
      scenes: {}
    };

    Object.keys(scenes).forEach(function (id) {
      var s = scenes[id];

      var scene = {
        title: s.title,
        yaw: s.yaw,
        pitch: s.pitch,
        hotSpots: (s.hotSpots || []).map(function (h) {
          return {
            pitch: h.pitch,
            yaw: h.yaw,
            type: 'scene',
            text: h.text,
            sceneId: h.sceneId,
            targetYaw: h.targetYaw,
            cssClass: 'passage',
            createTooltipFunc: dessinerPassage,
            // Habillage transmis au dessin : le style de la visite, que chaque
            // passage peut surcharger. Sans cela il faudrait régler les
            // quarante-deux passages un par un pour changer une couleur.
            createTooltipArgs: {
              libelle: h.text,
              icone:   choisir(h.icone, style.icone),
              image:   choisir(h.image, style.image),
              couleur: choisir(h.couleur, style.couleur),
              taille:  choisir(h.taille, style.taille)
            }
          };
        })
      };

      // Deux origines possibles, et c'est ce qui rend la visionneuse
      // indépendante de 3DVista :
      //
      //   `panorama` → une simple photo ÉQUIRECTANGULAIRE, telle que la sort un
      //                Ricoh Theta. Aucun traitement, aucun découpage : c'est
      //                la voie des visites montées dans notre back-office.
      //   `path`     → la pyramide de tuiles reconstruite depuis un export
      //                3DVista (voir tools/extract_3dvista_tour.js).
      if (s.panorama) {
        scene.type = 'equirectangular';
        scene.panorama = DOSSIER + s.panorama;
        if (s.hfov) scene.hfov = s.hfov;
      } else {
        scene.type = 'multires';
        scene.multiRes = {
          basePath: DOSSIER,
          path: s.path,
          extension: 'webp',
          tileResolution: tour.tileResolution,
          // Pyramide complète : le niveau 1 tient en une tuile, chaque niveau
          // suivant double. Numérotation reconstruite par l'extracteur — celle
          // de 3DVista est inversée (voir tools/extract_3dvista_tour.js).
          maxLevel: s.maxLevel,
          cubeResolution: s.faceSize
        };
      }

      config.scenes[id] = scene;
    });

    visionneuse = pannellum.viewer('scene', config);

    // La visite guidée en direct lit cette variable pour diffuser l'angle de vue
    // (voir shared/liveguide.js). On la pose explicitement : le crochet de
    // liveguide n'enveloppe pannellum.viewer que si son script s'est chargé
    // avant celui-ci, ce qui n'est pas garanti.
    window.LG_PANO = visionneuse;

    visionneuse.on('scenechange', function (id) { marquerPiece(id); });
    visionneuse.on('load', function () { marquerPiece(visionneuse.getScene()); });
    visionneuse.on('error', function (msg) { echouer(msg); });

    construireVignettes();
    construirePlan(tour.map);
    marquerPiece(tour.firstScene);
  }

  /* --- Plan de sol -------------------------------------------------------
     Les pastilles sont positionnées en POURCENTAGE des dimensions logiques du
     plan données par 3DVista, et non en pixels : le panneau peut alors être
     redimensionné librement — il l'est d'ailleurs selon la taille de l'écran. */
  function construirePlan(plan) {
    if (!plan || !plan.points || !plan.points.length) return; // export sans plan

    var btn = document.getElementById('planBtn');
    var panneau = document.getElementById('plan');
    var cadre = document.getElementById('planCadre');
    var img = document.getElementById('planImg');

    img.src = DOSSIER + plan.image;
    img.alt = 'Plan de l\'étage — ' + plan.points.length + ' pièces';

    // Les deux prises de vue d'une même pièce ont chacune leur pastille dans
    // l'export : on les ramène à la pièce mère et on n'en garde qu'une, sinon
    // deux points se superposeraient au même endroit du plan.
    var posees = {};
    plan.points.forEach(function (p) {
      var cible = pieceMere(p.sceneId);
      if (posees[cible]) return;
      posees[cible] = true;

      var pt = document.createElement('button');
      pt.type = 'button';
      pt.className = 'planPt';
      pt.dataset.scene = cible;
      pt.title = (scenes[cible] || p).title;
      pt.setAttribute('aria-label', 'Aller : ' + pt.title);
      pt.style.left = (p.x / plan.width * 100) + '%';
      pt.style.top = (p.y / plan.height * 100) + '%';
      pt.addEventListener('click', function () {
        if (visionneuse) visionneuse.loadScene(cible);
      });
      cadre.appendChild(pt);
    });

    btn.hidden = false;
    btn.addEventListener('click', function () {
      var ouvert = panneau.hidden;
      panneau.hidden = !ouvert;
      btn.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
    });
  }

  // Pannellum crée un div nu par point de passage : on y met la flèche et son
  // infobulle native (l'attribut title suffit, et fonctionne au toucher).
  /**
   * Dessine un passage. `args` porte le libellé et l'habillage éventuel.
   *
   * L'apparence n'a rien d'imposé par Pannellum : il ne fournit qu'un div vide
   * et sa position. Tout le reste — forme, couleur, symbole ou image — est à
   * nous, et se règle passage par passage depuis le JSON :
   *
   *   "icone"   : un caractère ou un emoji à la place du chevron ("↑", "🚪")
   *   "image"   : une image (flèche au sol, pictogramme), relative au tour
   *   "couleur" : la teinte de la pastille
   */
  function dessinerPassage(element, args) {
    element.classList.add('passage');
    element.title = 'Aller : ' + args.libelle;

    // Pastille dans un enfant, jamais sur `element` lui-même : voir la règle
    // sur `transform` dans la feuille de style.
    var pastille = document.createElement('b');

    if (args.image) {
      var img = document.createElement('img');
      img.src = DOSSIER + args.image;
      img.alt = '';
      pastille.appendChild(img);
      pastille.classList.add('passage-image');
    } else {
      pastille.textContent = args.icone || '›';
    }

    if (args.couleur) pastille.style.background = args.couleur;
    // La taille seule suffit : le centrage est l'affaire de Pannellum.
    if (args.taille) element.style.width = element.style.height = args.taille + 'px';

    element.appendChild(pastille);
  }

  /**
   * Pièces dans l'ordre de visite.
   *
   * L'ordre est porté par un champ `ordre` EXPLICITE, et non par l'ordre des
   * clés de l'objet : celui-ci se trouve préservé par JavaScript comme par PHP,
   * mais s'y fier reviendrait à faire dépendre le parcours d'un détail
   * d'implémentation, qu'un simple passage par un autre outil casserait sans
   * bruit. Les pièces sans `ordre` — un export 3DVista, par exemple — gardent
   * leur ordre d'apparition.
   */
  function piecesOrdonnees() {
    var ids = Object.keys(scenes);
    return ids.slice().sort(function (a, b) {
      var oa = typeof scenes[a].ordre === 'number' ? scenes[a].ordre : ids.indexOf(a);
      var ob = typeof scenes[b].ordre === 'number' ? scenes[b].ordre : ids.indexOf(b);
      return oa - ob;
    });
  }

  function construireVignettes() {
    var rail = document.getElementById('pieces');
    piecesOrdonnees().forEach(function (id) {
      var s = scenes[id];
      // Une prise de vue secondaire n'a pas sa vignette : c'est la même pièce,
      // atteinte par la bascule vide/meublé.
      if (s.secondaire) return;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'vignette';
      b.dataset.scene = id;
      b.title = s.title;

      // Vignette dédiée si l'export en fournit une (3DVista en génère), sinon
      // le panorama lui-même — une visite montée à la main n'a que ça.
      //
      // Un <img loading="lazy"> et non un fond CSS : le repli sur le panorama
      // ferait sans cela télécharger toutes les photos pleine taille au seul
      // affichage du bandeau. En paresseux, seules les vignettes réellement
      // visibles sont chargées.
      var source = s.thumbnail || s.panorama;
      if (source) {
        var vue = document.createElement('img');
        vue.loading = 'lazy';
        vue.decoding = 'async';
        vue.alt = '';
        vue.src = DOSSIER + source;
        b.appendChild(vue);
      }

      var nom = document.createElement('span');
      nom.textContent = s.title || '(sans nom)';
      b.appendChild(nom);
      b.addEventListener('click', function () {
        if (visionneuse) visionneuse.loadScene(id);
      });
      rail.appendChild(b);
    });
  }

  /**
   * Fait entrer TOUTE la visite dans l'état demandé — meublé ou vide.
   *
   *   tour-360.html?tour=jawhara/Tour            → visite du bien nu
   *   tour-360.html?tour=jawhara/Tour&etat=meuble → visite aménagée
   *
   * Deux liens à diffuser, un seul jeu de fichiers : le même tour, pris par un
   * bout ou par l'autre. Et la bascule pièce par pièce reste disponible des
   * deux côtés — devant un bien meublé on veut vérifier l'état réel, devant un
   * bien nu on veut se projeter.
   *
   * Le point délicat : il ne suffit pas de changer la pièce d'entrée. Les
   * PASSAGES visent des scènes précises ; sans les rediriger, la première porte
   * franchie ramènerait le visiteur dans l'autre état, et la visite deviendrait
   * un panachage incohérent.
   */
  function appliquerEtat(tour, voulu) {
    if (voulu !== 'meuble' && voulu !== 'vide') return; // rien demandé : on garde l'export tel quel

    // Pour une scène donnée, celle des deux qui correspond à l'état demandé.
    function versEtat(id) {
      var s = scenes[id];
      if (!s || !s.variante || !s.etat) return id;
      return s.etat === voulu ? id : s.variante;
    }

    Object.keys(scenes).forEach(function (id) {
      var s = scenes[id];
      if (!s.etat || !s.variante) return;
      // Seule la prise de vue de l'état voulu figure au bandeau et sur le plan.
      s.secondaire = s.etat !== voulu;
    });

    // Le NOM d'une pièce est celui de la pièce, pas de son ameublement : les
    // deux prises de vue portent donc le même titre, celui de la version nue.
    // Sans cela, une visite aménagée afficherait « Salon virtuel », « Cuisine
    // Virtuelle » — l'étiquette d'un fichier, pas un nom de pièce.
    Object.keys(scenes).forEach(function (id) {
      var s = scenes[id];
      if (s.etat === 'vide' && s.variante && scenes[s.variante]) {
        scenes[s.variante].title = s.title;
      }
    });

    Object.keys(scenes).forEach(function (id) {
      (scenes[id].hotSpots || []).forEach(function (h) {
        if (!h.sceneId) return;
        var vers = versEtat(h.sceneId);
        if (vers === h.sceneId) return;
        h.sceneId = vers;
        // Le libellé avait été figé sur l'ancienne cible : on le reprend, sinon
        // la flèche annoncerait une pièce et en ouvrirait une autre.
        if (scenes[vers] && scenes[vers].title) h.text = scenes[vers].title;
      });
    });

    tour.firstScene = versEtat(tour.firstScene);

    // Les points du plan aussi, sans quoi ils renverraient vers l'autre état.
    if (tour.map && tour.map.points) {
      tour.map.points.forEach(function (p) { p.sceneId = versEtat(p.sceneId); });
    }
  }

  /* --- Vide ↔ meublé -----------------------------------------------------
     Deux prises de vue d'une même pièce, l'une nue et l'autre aménagée. Elles
     restent deux scènes à part entière — les passages continuent d'y mener —
     mais une seule apparaît dans le bandeau et sur le plan : la seconde est
     marquée `secondaire` et ne s'atteint que par la bascule.

     Le basculement conserve l'angle et le zoom courants : c'est ce qui en fait
     un avant/après, et non deux photos sans rapport. */

  /** La pièce telle qu'elle figure au bandeau, pour une scène quelconque. */
  function pieceMere(id) {
    var s = scenes[id];
    return (s && s.secondaire && s.variante) ? s.variante : id;
  }

  document.getElementById('variante').addEventListener('click', function () {
    var s = scenes[visionneuse && visionneuse.getScene()];
    if (!s || !s.variante || !visionneuse) return;
    // On repart exactement de la même orientation et du même zoom.
    visionneuse.loadScene(s.variante, visionneuse.getPitch(), visionneuse.getYaw(), visionneuse.getHfov());
  });

  function majVariante(s) {
    var b = document.getElementById('variante');
    var autre = s && s.variante ? scenes[s.variante] : null;
    b.hidden = !autre;
    if (autre) {
      b.textContent = s.varianteLabel || ('Voir ' + autre.title);
      b.title = 'Même point de vue, ' + (s.varianteLabel || autre.title).toLowerCase();
    }

    // L'ameublement est presque toujours une image de synthèse : on le dit,
    // tant que cette vue reste affichée. Un acheteur ne doit pas confondre un
    // rendu avec l'état réel du bien.
    var m = document.getElementById('mention');
    // On se fie à l'ÉTAT de la prise de vue, jamais à `secondaire` : ce dernier
    // dit seulement laquelle figure au bandeau, et il s'inverse en mode meublé.
    // La mention doit suivre le meublé, pas la mise en avant — sans quoi une
    // visite entièrement aménagée n'en porterait aucune.
    var virtuel = !!(s && (s.etat ? s.etat === 'meuble' : s.secondaire));
    m.hidden = !virtuel;
    if (virtuel) m.textContent = s.mention || 'Aménagement virtuel — à titre d\'illustration';
  }

  function marquerPiece(id) {
    var s = scenes[id];
    document.getElementById('piece').textContent = (s && s.title) || '';
    majVariante(s);

    // Sur une prise de vue secondaire, c'est la pièce mère qui reste soulignée :
    // le visiteur n'a pas changé de pièce, seulement d'ameublement.
    var repere = pieceMere(id);

    var rail = document.getElementById('pieces');
    Array.prototype.forEach.call(rail.children, function (b) {
      var actif = b.dataset.scene === repere;
      b.setAttribute('aria-current', actif ? 'true' : 'false');
      if (actif) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    });

    // Sur le plan aussi : le visiteur doit voir où il se trouve. Une pièce peut
    // n'avoir aucune pastille (3DVista n'en place pas partout), le repère reste
    // alors simplement éteint.
    Array.prototype.forEach.call(document.querySelectorAll('.planPt'), function (pt) {
      pt.setAttribute('aria-current', pt.dataset.scene === repere ? 'true' : 'false');
    });
  }

  function echouer(detail) {
    document.getElementById('erreur').style.display = 'flex';
    document.getElementById('erreurDetail').textContent = detail || '';
    document.getElementById('piece').style.display = 'none';
  }

  /* --- Place laissée à la barre de visite guidée --------------------------
     liveguide.js pose une barre fixe en bas de page. Sa hauteur varie : elle
     passe sur deux ou trois lignes sur un téléphone. On la mesure pour que le
     panorama et le bandeau s'arrêtent juste au-dessus, plutôt que d'être
     recouverts. */
  function suivreLaBarre() {
    var barre = document.querySelector('.lg-hostbar, .lg-viewerbar');
    var h = barre ? Math.round(barre.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty('--barre', h + 'px');
    // Pannellum ne surveille que le redimensionnement de la FENÊTRE. Sans cet
    // appel, sa toile garderait son ancienne hauteur et l'image serait étirée.
    if (visionneuse && visionneuse.resize) visionneuse.resize();
    return barre;
  }

  // La barre arrive tard : liveguide charge son SDK, s'authentifie, puis
  // l'injecte. On l'attend, puis on suit ses changements de taille.
  new MutationObserver(function () {
    var barre = suivreLaBarre();
    if (barre && !barre.__suivie) {
      barre.__suivie = true;
      new ResizeObserver(suivreLaBarre).observe(barre);
    }
  }).observe(document.body, { childList: true });

  window.addEventListener('resize', suivreLaBarre);
})();
</script>
</body>
</html>
