
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --ocean: #1B6B93;
  --sun: #E8A838;
  --sand: #F2E8D5;
  --charcoal: #1E1E2A;
  --text: #2A2A3A;
  --muted: #7A7A8A;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', sans-serif;
  background: #FDFAF5;
  color: var(--text);
  line-height: 1.6;
}
html[dir=rtl] body { font-family: 'Noto Sans Arabic', 'Outfit', sans-serif; }

.lang-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(30,30,42,.95);
  display: flex; justify-content: center; gap: .3rem;
  padding: .5rem 1rem;
}
.lang-btn {
  background: transparent; border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.6); padding: .3rem .7rem;
  border-radius: 6px; cursor: pointer; font-size: .8rem;
  font-family: inherit;
}
.lang-btn:hover { background: rgba(255,255,255,.1); color: white; }
.lang-btn.active { background: var(--ocean); color: white; border-color: var(--ocean); }

.hero {
  margin-top: 42px;
  padding: 4rem 2rem;
  background: linear-gradient(160deg, #0F4C75, var(--ocean), var(--sun));
  text-align: center;
  color: white;
}
.hero-badge {
  display: inline-block;
  background: rgba(255,255,255,.15);
  padding: .3rem 1rem;
  border-radius: 30px;
  font-size: .75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4.5vw, 3rem);
  margin-bottom: .5rem;
}
html[dir=rtl] .hero h1 { font-family: 'Noto Sans Arabic', serif; }
.hero h1 em { color: #F5C96A; font-style: italic; }
.hero p { opacity: .8; max-width: 500px; margin: 0 auto; }

.stats {
  display: flex; justify-content: center; flex-wrap: wrap;
  background: var(--charcoal);
}
.stat-item {
  flex: 1; min-width: 120px; max-width: 180px;
  padding: 1rem; text-align: center;
  border-right: 1px solid rgba(255,255,255,.05);
}
.stat-item:last-child { border-right: none; }
.stat-item .se { font-size: 1.2rem; }
.stat-item .sl {
  color: rgba(212,193,161,1); font-size: .65rem;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.stat-item .sv {
  color: #F5C96A; font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 600;
}

.map-section { padding: 3rem 1.5rem; max-width: 1200px; margin: 0 auto; }
.section-title { text-align: center; margin-bottom: 1.5rem; }
.section-title h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; color: var(--charcoal);
}
html[dir=rtl] .section-title h2 { font-family: 'Noto Sans Arabic', serif; }
.section-title p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }

.map-layout {
  display: grid; grid-template-columns: 280px 1fr;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,.1);
  min-height: 550px; background: white;
}
@media (max-width: 768px) {
  .map-layout { grid-template-columns: 1fr; }
  .sidebar { max-height: 300px; }
}

.sidebar { background: var(--charcoal); overflow-y: auto; }
.sidebar-title {
  padding: 1rem 1.2rem .5rem; color: rgba(212,193,161,1);
  font-size: .65rem; letter-spacing: 2px; text-transform: uppercase;
}
.cat {
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.cat-btn {
  display: flex; align-items: center; gap: .5rem;
  width: 100%; padding: .7rem 1.2rem;
  border: none; background: transparent;
  color: rgba(255,255,255,.7);
  font-family: inherit; font-size: .85rem;
  cursor: pointer; text-align: left;
}
html[dir=rtl] .cat-btn { text-align: right; }
.cat-btn:hover { background: rgba(255,255,255,.05); color: white; }
.cat-btn.active { background: var(--ocean); color: white; }
.cat-btn .emoji { font-size: 1rem; width: 24px; }
.cat-btn .label { flex: 1; }
.cat-btn .count {
  background: rgba(255,255,255,.1);
  padding: .1rem .4rem; border-radius: 8px;
  font-size: .65rem;
}
.cat-btn.active .count { background: rgba(255,255,255,.2); }
.cat-btn .arrow {
  font-size: .55rem; transition: transform .2s;
  color: rgba(255,255,255,.3);
}
.cat-btn.open .arrow { transform: rotate(90deg); }

.cat-list { display: none; background: rgba(0,0,0,.2); }
.cat-list.show { display: block; }
.poi {
  display: flex; align-items: center; gap: .5rem;
  padding: .45rem 1.2rem .45rem 2.7rem;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,.02);
}
html[dir=rtl] .poi { padding: .45rem 2.7rem .45rem 1.2rem; }
.poi:hover { background: rgba(255,255,255,.05); }
.poi .dot {
  width: 5px; height: 5px;
  border-radius: 50%; background: var(--sun);
}
.poi .name {
  flex: 1; color: rgba(255,255,255,.65);
  font-size: .75rem; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.poi:hover .name { color: white; }
.poi .rating { color: #F5C96A; font-size: .7rem; }

#map { width: 100%; height: 100%; min-height: 550px; }

.popup-card { padding: .8rem 1rem; min-width: 200px; }
.popup-card .pc-cat {
  font-size: .55rem; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--ocean);
  font-weight: 600; margin-bottom: .15rem;
}
.popup-card .pc-name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--charcoal); margin-bottom: .15rem;
}
html[dir=rtl] .popup-card .pc-name { font-family: 'Noto Sans Arabic', serif; }
.popup-card .pc-addr,
.popup-card .pc-det {
  font-size: .72rem; color: var(--muted);
}
.popup-card .pc-rt {
  color: var(--sun); font-size: .75rem;
  margin-top: .2rem;
}
.popup-card .pc-phone {
  font-size: .72rem; color: var(--ocean);
  margin-top: .2rem;
}
.popup-card .pc-phone a { color: var(--ocean); text-decoration: none; }

footer {
  text-align: center; padding: 1rem;
  color: var(--muted); font-size: .75rem;
  background: var(--sand);
}

.loading {
  padding: 3rem; text-align: center;
  color: rgba(255,255,255,.4);
}
</style>
</head>
<body>

<div class="lang-bar">
  <button class="lang-btn active" data-lang="fr">🇫🇷 FR</button>
  <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
  <button class="lang-btn" data-lang="ar">🇲🇦 عربي</button>
  <button class="lang-btn" data-lang="es">🇪🇸 ES</button>
</div>

<section class="hero">
  <div class="hero-badge" id="heroBadge">Chargement...</div>
  <h1 id="heroTitle">Carte <em>Interactive</em></h1>
  <p id="heroSubtitle"></p>
</section>

<div class="stats" id="statsBar"></div>

<section class="map-section">
  <div class="section-title">
    <h2 id="mapTitle">Carte du Quartier</h2>
    <p id="mapSubtitle">Cliquez sur une catégorie</p>
  </div>
  <div class="map-layout">
    <div class="sidebar" id="sidebar">
      <div class="loading">Chargement...</div>
    </div>
    <div id="map"></div>
  </div>
</section>

<footer><span id="footerName">Carte</span> — © OpenStreetMap</footer>

<script>
// === TRADUCTIONS ===
var UI = {
  fr: {
    heroSub: "points d'intérêt à proximité",
    mapTitle: "Carte du Quartier",
    mapSub: "Cliquez sur une catégorie pour déplier la liste",
    sbTitle: "Points d'intérêt",
    lieux: "lieux",
    yourRes: "votre résidence",
    reviews: "avis",
    cats: { pharmacie:"Pharmacies", magasin:"Supermarchés", boulangerie:"Boulangeries", mosquee:"Mosquées", ecole:"Écoles", cafe:"Cafés", banque:"Banques", sante:"Santé", hammam:"Hammams" }
  },
  en: {
    heroSub: "points of interest nearby",
    mapTitle: "Neighborhood Map",
    mapSub: "Click a category to expand the list",
    sbTitle: "Points of Interest",
    lieux: "places",
    yourRes: "your residence",
    reviews: "reviews",
    cats: { pharmacie:"Pharmacies", magasin:"Supermarkets", boulangerie:"Bakeries", mosquee:"Mosques", ecole:"Schools", cafe:"Cafés", banque:"Banks", sante:"Healthcare", hammam:"Hammams" }
  },
  ar: {
    heroSub: "نقاط اهتمام بالقرب",
    mapTitle: "خريطة الحي",
    mapSub: "انقر على فئة لتوسيع القائمة",
    sbTitle: "نقاط الاهتمام",
    lieux: "مكان",
    yourRes: "إقامتك",
    reviews: "تقييم",
    cats: { pharmacie:"الصيدليات", magasin:"المتاجر", boulangerie:"المخابز", mosquee:"المساجد", ecole:"المدارس", cafe:"المقاهي", banque:"البنوك", sante:"الصحة", hammam:"الحمامات" }
  },
  es: {
    heroSub: "puntos de interés cercanos",
    mapTitle: "Mapa del Barrio",
    mapSub: "Haz clic en una categoría",
    sbTitle: "Puntos de Interés",
    lieux: "lugares",
    yourRes: "tu residencia",
    reviews: "reseñas",
    cats: { pharmacie:"Farmacias", magasin:"Supermercados", boulangerie:"Panaderías", mosquee:"Mezquitas", ecole:"Escuelas", cafe:"Cafés", banque:"Bancos", sante:"Salud", hammam:"Hammams" }
  }
};

var currentLang = 'fr';
var allLayers = [];
var markerMap = {};

var map = L.map('map').setView([31, -8], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19
}).addTo(map);

function makeIcon(emoji) {
  return L.divIcon({
    html: '<div style="background:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid white">' + emoji + '</div>',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14],
    className: ''
  });
}

function makeHomeIcon() {
  return L.divIcon({
    html: '<div style="background:#1B6B93;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:3px solid white;box-shadow:0 0 0 5px rgba(27,107,147,.2),0 4px 12px rgba(0,0,0,.3)">🏠</div>',
    iconSize: [38, 38],
    iconAnchor: [19, 19],
    popupAnchor: [0, -22],
    className: ''
  });
}

function makePopup(p) {
  var t = UI[currentLang];
  var cat = p.cat === 'home' ? t.yourRes : (t.cats[p.cat] || p.cat);
  var rating = p.note ? '<div class="pc-rt">★ ' + p.note + '/5' + (p.avis ? ' · ' + p.avis + ' ' + t.reviews : '') + '</div>' : '';
  var phone = p.tel ? '<div class="pc-phone">📞 <a href="tel:' + p.tel.replace(/\s/g,'') + '">' + p.tel + '</a></div>' : '';
  var hours = p.horaires ? '<div class="pc-det">🕐 ' + p.horaires + '</div>' : '';
  return '<div class="popup-card"><div class="pc-cat">' + cat + '</div><div class="pc-name">' + p.nom + '</div><div class="pc-addr">' + p.adresse + '</div>' + hours + rating + phone + '</div>';
}

function parseCSV(text) {
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l) { return l.trim(); });
  if (lines.length < 2) return [];
  var sep = lines[0].indexOf(';') >= 0 ? ';' : ',';
  var hdr = lines[0].replace(/^\uFEFF/,'').split(sep);
  var idx = {};
  for (var i = 0; i < hdr.length; i++) {
    var h = hdr[i].trim().toLowerCase();
    if (h.indexOf('cat') >= 0) idx.cat = i;
    else if (h.indexOf('emoji') >= 0) idx.emoji = i;
    else if (h.indexOf('nom') >= 0 || h.indexOf('name') >= 0) idx.nom = i;
    else if (h.indexOf('adresse') >= 0 || h.indexOf('address') >= 0) idx.adresse = i;
    else if (h.indexOf('note') >= 0) idx.note = i;
    else if (h.indexOf('lat') >= 0) idx.lat = i;
    else if (h.indexOf('lng') >= 0 || h.indexOf('lon') >= 0) idx.lng = i;
    else if (h.indexOf('avis') >= 0) idx.avis = i;
    else if (h.indexOf('tel') >= 0 || h.indexOf('phone') >= 0) idx.tel = i;
    else if (h.indexOf('horaire') >= 0 || h.indexOf('notes') >= 0) idx.horaires = i;
  }
  var pois = [];
  for (var i = 1; i < lines.length; i++) {
    var c = lines[i].split(sep);
    var lat = parseFloat(c[idx.lat]);
    var lng = parseFloat(c[idx.lng]);
    if (isNaN(lat) || isNaN(lng)) continue;
    pois.push({
      cat: (c[idx.cat] || '').trim().toLowerCase(),
      emoji: (c[idx.emoji] || '📍').trim(),
      nom: (c[idx.nom] || '').trim(),
      adresse: (c[idx.adresse] || '').trim(),
      note: parseFloat(c[idx.note]) || null,
      lat: lat, lng: lng,
      avis: parseInt(c[idx.avis]) || null,
      tel: (c[idx.tel] || '').trim(),
      horaires: (c[idx.horaires] || '').trim()
    });
  }
  return pois;
}

function buildMap(pois) {
  var t = UI[currentLang];

  for (var i = 0; i < allLayers.length; i++) map.removeLayer(allLayers[i]);
  allLayers = [];
  markerMap = {};

  var home = null;
  for (var i = 0; i < pois.length; i++) {
    if (pois[i].cat === 'home') { home = pois[i]; break; }
  }
  if (home) map.setView([home.lat, home.lng], 15);

  for (var i = 0; i < pois.length; i++) {
    var p = pois[i];
    var ic = p.cat === 'home' ? makeHomeIcon() : makeIcon(p.emoji);
    var layer = L.marker([p.lat, p.lng], { icon: ic }).bindPopup(makePopup(p));
    layer._cat = p.cat;
    layer.addTo(map);
    allLayers.push(layer);
    markerMap[i] = layer;
  }

  var catOrder = [];
  var catItems = {};
  for (var i = 0; i < pois.length; i++) {
    var p = pois[i];
    if (p.cat === 'home') continue;
    if (!catItems[p.cat]) {
      catItems[p.cat] = [];
      catOrder.push(p.cat);
    }
    catItems[p.cat].push({ p: p, idx: i });
  }

  if (home) {
    document.getElementById('heroBadge').textContent = home.adresse || '';
    document.getElementById('heroTitle').innerHTML = '<em>' + home.nom + '</em>';
    document.getElementById('heroSubtitle').textContent = (pois.length - 1) + ' ' + t.heroSub;
    document.getElementById('footerName').textContent = home.nom;
    document.title = home.nom;
  }

  document.getElementById('mapTitle').textContent = t.mapTitle;
  document.getElementById('mapSubtitle').textContent = t.mapSub;

  var sb = document.getElementById('statsBar');
  sb.innerHTML = '';
  for (var i = 0; i < catOrder.length; i++) {
    var cat = catOrder[i];
    var items = catItems[cat];
    sb.innerHTML += '<div class="stat-item"><div class="se">' + items[0].p.emoji + '</div><div class="sl">' + (t.cats[cat] || cat) + '</div><div class="sv">' + items.length + '</div></div>';
  }

  var sd = document.getElementById('sidebar');
  var html = '<div class="sidebar-title">' + t.sbTitle + ' — ' + (pois.length - 1) + ' ' + t.lieux + '</div>';

  for (var i = 0; i < catOrder.length; i++) {
    var cat = catOrder[i];
    var items = catItems[cat];
    html += '<div class="cat">';
    html += '<button class="cat-btn" data-cat="' + cat + '"><span class="emoji">' + items[0].p.emoji + '</span><span class="label">' + (t.cats[cat] || cat) + '</span><span class="count">' + items.length + '</span><span class="arrow">▶</span></button>';
    html += '<div class="cat-list" id="list-' + cat + '">';
    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      var rt = item.p.note ? '⭐' + item.p.note : '';
      html += '<div class="poi" data-idx="' + item.idx + '"><span class="dot"></span><span class="name">' + item.p.nom + '</span><span class="rating">' + rt + '</span></div>';
    }
    html += '</div></div>';
  }
  sd.innerHTML = html;

  var btns = sd.querySelectorAll('.cat-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      toggleCat(this, this.getAttribute('data-cat'));
    });
  }
  var pois_el = sd.querySelectorAll('.poi');
  for (var i = 0; i < pois_el.length; i++) {
    pois_el[i].addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      var l = markerMap[idx];
      if (l) {
        map.setView(l.getLatLng(), 17);
        l.openPopup();
      }
    });
  }

  if (allLayers.length > 1) {
    map.fitBounds(L.featureGroup(allLayers).getBounds().pad(0.15));
  }
}

function toggleCat(btn, cat) {
  var list = document.getElementById('list-' + cat);
  var open = btn.classList.contains('open');

  var allBtns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < allBtns.length; i++) {
    allBtns[i].classList.remove('open', 'active');
  }
  var allLists = document.querySelectorAll('.cat-list');
  for (var i = 0; i < allLists.length; i++) {
    allLists[i].classList.remove('show');
  }

  if (!open) {
    btn.classList.add('open', 'active');
    list.classList.add('show');
    for (var i = 0; i < allLayers.length; i++) {
      if (allLayers[i]._cat === cat || allLayers[i]._cat === 'home') {
        map.addLayer(allLayers[i]);
      } else {
        map.removeLayer(allLayers[i]);
      }
    }
  } else {
    for (var i = 0; i < allLayers.length; i++) {
      map.addLayer(allLayers[i]);
    }
  }
}

function getBaseName() {
  var p = window.location.pathname;
  var f = p.split('/').pop() || 'index.html';
  return f.replace(/\.html?$/i, '');
}

function switchLang(lang) {
  currentLang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;

  var btns = document.querySelectorAll('.lang-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].getAttribute('data-lang') === lang) {
      btns[i].classList.add('active');
    }
  }

  window.location.hash = lang;

  var base = getBaseName();
  var csvFile = base + '_' + lang + '.csv';

  fetch(csvFile)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(text) {
      var pois = parseCSV(text);
      console.log('Loaded ' + csvFile + ': ' + pois.length + ' POI');
      buildMap(pois);
    })
    .catch(function(err) {
      console.error('Error loading ' + csvFile + ':', err.message);
      // Fallback to French
      if (lang !== 'fr') {
        fetch(base + '_fr.csv')
          .then(function(r) { return r.text(); })
          .then(function(t) {
            var pois = parseCSV(t);
            buildMap(pois);
          });
      }
    });
}

// INIT
document.addEventListener('DOMContentLoaded', function() {
  var btns = document.querySelectorAll('.lang-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      switchLang(this.getAttribute('data-lang'));
    });
  }

  var hash = window.location.hash.replace('#', '');
  var lang = ['fr','en','ar','es'].indexOf(hash) >= 0 ? hash : 'fr';
  switchLang(lang);
});
</script>
</body>
</html>
