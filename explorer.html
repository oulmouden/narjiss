<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<script>(function(){try{var t=localStorage.getItem("nj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Narjiss">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2430" media="(prefers-color-scheme: dark)">
<title>Narjiss - Explorer les projets</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css?v=1fbf57b6">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body {
  background: var(--bg);
  color: var(--text);
}
.explorer-shell {
  min-height: calc(100vh - 60px);
  display: grid;
  grid-template-rows: auto 1fr;
}
.searchbar {
  position: sticky;
  top: 68px;
  z-index: 800;
  background: rgba(255, 255, 255, .97);
  border-bottom: 1px solid var(--border-subtle);
  box-shadow: 0 6px 20px rgba(17, 24, 39, .07);
  padding: .75rem 1rem;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.searchbar-inner {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) repeat(2, auto);
  gap: .6rem;
  align-items: center;
  max-width: 1540px;
  margin: 0 auto;
}
.search-box {
  height: 48px;
  display: flex;
  align-items: center;
  gap: .65rem;
  background: var(--surface);
  border: 1px solid rgba(17, 24, 39, .18);
  border-radius: 8px;
  padding: 0 .9rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(17,24,39,.04);
}
.search-box span {
  color: var(--ocean);
  font-size: 1.15rem;
  font-weight: 900;
}
.search-box input {
  border: 0;
  outline: 0;
  width: 100%;
  font: inherit;
  font-size: .98rem;
  color: var(--text);
  background: transparent;
}
.filter-btn,
.save-btn {
  height: 48px;
  border-radius: 8px;
  border: 1.5px solid var(--border-medium);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-weight: 700;
  padding: 0 1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  white-space: nowrap;
  transition: background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast), box-shadow var(--duration-fast), transform var(--duration-fast);
}
@media (hover: hover) {
  .filter-btn:hover,
  .save-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(17, 24, 39, .1);
  }
}
.filter-btn.active {
  background: var(--ocean);
  border-color: var(--ocean);
  color: white;
}
.save-btn {
  border-color: var(--ocean);
  background: var(--ocean);
  color: white;
}
.view-select {
  height: 48px;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: 0 .85rem;
  border: 1.5px solid var(--border-medium);
  border-radius: 8px;
  background: var(--surface);
  white-space: nowrap;
  transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
}
.view-select:focus-within {
  border-color: var(--ocean);
  box-shadow: 0 0 0 3px rgba(0, 106, 255, .14);
}
.view-select-label {
  color: var(--muted);
  font-weight: 700;
  font-size: .9rem;
}
.view-select select {
  border: 0;
  outline: 0;
  background: transparent;
  font: inherit;
  font-weight: 800;
  color: var(--ocean);
  cursor: pointer;
  padding: 0;
}
.explorer-layout {
  display: grid;
  grid-template-columns: var(--map-w, clamp(340px, 40vw, 460px)) 11px minmax(0, 1fr);
  min-height: calc(100vh - 132px);
}
.split-handle {
  position: sticky;
  top: 132px;
  height: calc(100vh - 132px);
  cursor: col-resize;
  background: var(--surface-raised);
  border: 0;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  transition: background var(--duration-fast);
}
.split-handle::before {
  content: "";
  width: 3px;
  height: 42px;
  border-radius: 999px;
  background: var(--border-medium);
  transition: background var(--duration-fast);
}
.split-handle:hover,
.split-handle:focus-visible,
.split-handle.is-dragging {
  background: rgba(0, 106, 255, .12);
  outline: 0;
}
.split-handle:hover::before,
.split-handle:focus-visible::before,
.split-handle.is-dragging::before {
  background: var(--ocean);
}
body.is-splitting {
  user-select: none;
  cursor: col-resize;
}
.explorer-layout.view-map,
.explorer-layout.view-list {
  grid-template-columns: minmax(0, 1fr);
}
.explorer-layout.view-map .results-pane,
.explorer-layout.view-list .map-pane,
.explorer-layout.view-map .split-handle,
.explorer-layout.view-list .split-handle {
  display: none;
}
.explorer-layout.view-map .map-pane {
  border-right: 0;
}
.map-pane {
  position: sticky;
  top: 132px;
  height: calc(100vh - 132px);
  border-right: 1px solid var(--border-subtle);
  background: var(--surface-raised);
}
#explorerMap {
  width: 100%;
  height: 100%;
}
.results-pane {
  min-width: 0;
  background: var(--surface);
  padding: 1.45rem clamp(1rem, 2vw, 1.8rem) 3rem;
  overflow: hidden;
}
.results-head {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: end;
  margin-bottom: 1.15rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(17, 24, 39, .1);
}
.results-title h1 {
  margin: 0;
  font-size: clamp(1.45rem, 2vw, 2rem);
  line-height: 1.1;
  font-weight: 850;
  letter-spacing: 0;
}
.results-title p {
  margin: .4rem 0 0;
  color: var(--muted);
  font-weight: 700;
  font-size: .96rem;
}
.listing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 1rem;
}
.listing-card {
  display: block;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: transform var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out), border-color var(--duration-normal);
}
@media (hover: hover) {
  .listing-card:hover,
  .listing-card.highlight {
    transform: translateY(-4px);
    border-color: rgba(0, 174, 239, .4);
    box-shadow: var(--shadow-lg);
  }
}
.listing-media {
  position: relative;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, #0c2340, #00aeef);
  background-size: cover;
  background-position: center;
}
.listing-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.42));
}
.listing-badges {
  position: absolute;
  top: .75rem;
  left: .75rem;
  right: 3.1rem;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  gap: .4rem;
}
html[dir=rtl] .listing-badges {
  left: 3.1rem;
  right: .75rem;
  flex-direction: row-reverse;
}
.listing-badge {
  flex: 0 0 auto;
  min-width: 104px;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: oklch(55% 0.17 152);
  color: white;
  border-radius: 6px;
  padding: .32rem .62rem;
  font-size: .78rem;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.favorite {
  position: absolute;
  right: .75rem;
  top: .65rem;
  z-index: 2;
  color: white;
  font-size: 2.05rem;
  line-height: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.listing-dots {
  position: absolute;
  z-index: 2;
  bottom: .7rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: .28rem;
}
.listing-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.72);
}
.listing-body {
  padding: .9rem .95rem 1rem;
}
.listing-name {
  font-size: 1.18rem;
  font-weight: 850;
  line-height: 1.1;
  margin-bottom: .35rem;
}
.listing-meta {
  color: var(--text);
  font-size: .93rem;
  line-height: 1.45;
  font-weight: 650;
}
.listing-types {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  min-width: 0;
}
.listing-type {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 104px;
  min-height: 30px;
  padding: .32rem .62rem;
  border-radius: 999px;
  border: 0;
  /* --ocean-deep est une couleur de texte : sous du blanc elle ne donne que
     3,76:1. --accent-solid est l'aplat prevu pour ca. */
  background: var(--accent-solid);
  color: var(--on-accent);
  cursor: pointer;
  font-family: inherit;
  font-size: .78rem;
  font-weight: 800;
  line-height: 1.2;
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
.listing-address {
  color: var(--muted);
  margin-top: .35rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.listing-provider {
  margin-top: .65rem;
  color: var(--muted);
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.project-price-marker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 92px;
  max-width: 168px;
  height: 34px;
  padding: 0 .78rem;
  border-radius: 999px;
  background: var(--sun);
  color: white;
  border: 2px solid white;
  box-shadow: 0 6px 16px rgba(17,24,39,.32);
  font-weight: 900;
  font-size: .78rem;
  line-height: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.leaflet-marker-icon.is-active .project-price-marker {
  background: #9a4700;
  color: white;
  transform: scale(1.08);
}
.map-pane.map-compact {
  height: 42vh;
  min-height: 320px;
}
.map-tool-btn {
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  font-weight: 800;
}
.map-tool-btn:hover { background: var(--surface-raised); }
.popup-card {
  min-width: 180px;
}
.pc-cat {
  color: var(--sun);
  font-size: .72rem;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.pc-name {
  margin-top: .25rem;
  color: var(--text);
  font-size: 1rem;
  font-weight: 850;
}
.pc-loc {
  margin: .28rem 0 .6rem;
  color: var(--muted);
  font-size: .86rem;
}
.listing-type.is-active {
  background: var(--sun);
  box-shadow: 0 0 0 2px var(--sun-light);
}
.listing-type:hover { filter: brightness(1.12); }
.listing-type:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.listing-type:active { transform: scale(.97); }

.popup-card .listing-types {
  margin: .4rem 0 .35rem;
}
.popup-card .listing-type {
  min-height: 22px;
  min-width: 86px;
  background: var(--ocean-deep);
  color: white;
  font-size: .66rem;
  box-shadow: none;
}
.pc-link {
  color: var(--ocean);
  font-weight: 850;
  text-decoration: none;
}
.empty-state {
  padding: 3rem 1rem;
  text-align: center;
  color: var(--muted);
}
@media (max-width: 980px) {
  .searchbar { top: 64px; }
  .searchbar-inner {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .search-box { flex: 1 1 100%; }
  .filter-btn, .save-btn { flex: 0 0 auto; }
  .view-select { flex: 1 1 auto; justify-content: center; }
  .explorer-layout {
    grid-template-columns: 1fr;
  }
  .split-handle {
    display: none;
  }
  .map-pane {
    position: relative;
    top: auto;
    height: 48vh;
    min-height: 340px;
    border-right: 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .explorer-layout.view-map .map-pane {
    height: calc(100vh - 132px);
    border-bottom: 0;
  }
}
@media (max-width: 560px) {
  .searchbar-inner {
    grid-template-columns: 1fr 1fr;
    gap: .5rem;
  }
  .filter-btn,
  .save-btn {
    padding: 0 .7rem;
    justify-content: center;
  }
  .results-pane {
    padding: 1rem .85rem 2rem;
  }
  .results-head {
    display: block;
  }
}
</style>

<body>
<div id="mainMenu"></div>
<main class="explorer-shell">
  <section class="searchbar">
    <div class="searchbar-inner">
      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Adresse, quartier, ville">
      </label>
      <button class="save-btn" type="button" id="resetBtn">Réinitialiser</button>
      <div class="view-select">
        <span class="view-select-label" id="viewSelectLabel">Affichage</span>
        <select id="viewSelect" aria-label="Affichage carte ou liste">
          <option value="map">Carte</option>
          <option value="list">Liste</option>
          <option value="both" selected>Les deux</option>
        </select>
      </div>
    </div>
  </section>
  <section class="explorer-layout" id="explorerLayout">
    <aside class="map-pane">
      <div id="explorerMap"></div>
    </aside>
    <div class="split-handle" id="splitHandle" role="separator" tabindex="0"
         aria-orientation="vertical" aria-label="Redimensionner la carte"
         title="Glisser pour redimensionner — double-clic pour réinitialiser"></div>
    <section class="results-pane">
      <div class="results-head">
        <div class="results-title">
          <h1 id="resultsTitle">Projets immobiliers Narjiss</h1>
          <p id="resultsCount"></p>
        </div>
      </div>
      <div class="listing-grid" id="listingGrid"></div>
    </section>
  </section>
</main>
<div id="mainFooter"></div>
<script src="shared/menu.js?v=82772e6c"></script>

</body>
