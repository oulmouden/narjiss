<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narjiss - Explorer les projets</title>
<link rel="icon" type="image/jpeg" href="images/logo-narjiss.jpg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/menu.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body {
  background: #f3f6fa;
  color: #1f2430;
}
.explorer-shell {
  min-height: calc(100vh - 60px);
  display: grid;
  grid-template-rows: auto 1fr;
}
.searchbar {
  position: sticky;
  top: 68px;
  z-index: 800;
  background: rgba(255, 255, 255, .97);
  border-bottom: 1px solid var(--border-subtle);
  box-shadow: 0 6px 20px rgba(17, 24, 39, .07);
  padding: .75rem 1rem;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.searchbar-inner {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) repeat(4, auto);
  gap: .6rem;
  align-items: center;
  max-width: 1540px;
  margin: 0 auto;
}
.search-box {
  height: 48px;
  display: flex;
  align-items: center;
  gap: .65rem;
  background: white;
  border: 1px solid rgba(17, 24, 39, .18);
  border-radius: 8px;
  padding: 0 .9rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(17,24,39,.04);
}
.search-box span {
  color: var(--ocean);
  font-size: 1.15rem;
  font-weight: 900;
}
.search-box input {
  border: 0;
  outline: 0;
  width: 100%;
  font: inherit;
  font-size: .98rem;
  color: #1f2430;
  background: transparent;
}
.filter-btn,
.save-btn {
  height: 48px;
  border-radius: 8px;
  border: 1.5px solid var(--border-medium);
  background: white;
  color: var(--text);
  font: inherit;
  font-weight: 700;
  padding: 0 1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  white-space: nowrap;
  transition: background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast), box-shadow var(--duration-fast), transform var(--duration-fast);
}
@media (hover: hover) {
  .filter-btn:hover,
  .save-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(17, 24, 39, .1);
  }
}
.filter-btn.active {
  background: var(--ocean);
  border-color: var(--ocean);
  color: white;
}
.save-btn {
  border-color: var(--ocean);
  background: var(--ocean);
  color: white;
}
.explorer-layout {
  display: grid;
  grid-template-columns: clamp(340px, 40vw, 460px) minmax(0, 1fr);
  min-height: calc(100vh - 132px);
}
.map-pane {
  position: sticky;
  top: 132px;
  height: calc(100vh - 132px);
  border-right: 1px solid var(--border-subtle);
  background: #e9eef5;
}
#explorerMap {
  width: 100%;
  height: 100%;
}
.results-pane {
  min-width: 0;
  background: #fff;
  padding: 1.45rem clamp(1rem, 2vw, 1.8rem) 3rem;
  overflow: hidden;
}
.results-head {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: end;
  margin-bottom: 1.15rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid rgba(17, 24, 39, .1);
}
.results-title h1 {
  margin: 0;
  font-size: clamp(1.45rem, 2vw, 2rem);
  line-height: 1.1;
  font-weight: 850;
  letter-spacing: 0;
}
.results-title p {
  margin: .4rem 0 0;
  color: #596273;
  font-weight: 700;
  font-size: .96rem;
}
.sort-control {
  border: 1px solid rgba(0, 106, 255, .2);
  border-radius: 999px;
  background: rgba(0, 106, 255, .07);
  color: var(--ocean);
  font: inherit;
  font-weight: 800;
  padding: .55rem .85rem;
  cursor: pointer;
  white-space: nowrap;
}
.listing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 1rem;
}
.listing-card {
  display: block;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
  background: white;
  color: inherit;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: transform var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out), border-color var(--duration-normal);
}
@media (hover: hover) {
  .listing-card:hover,
  .listing-card.highlight {
    transform: translateY(-4px);
    border-color: rgba(0, 174, 239, .4);
    box-shadow: var(--shadow-lg);
  }
}
.listing-media {
  position: relative;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, #0c2340, #00aeef);
  background-size: cover;
  background-position: center;
}
.listing-media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.03), rgba(0,0,0,.42));
}
.listing-badges {
  position: absolute;
  top: .75rem;
  left: .75rem;
  right: 3.1rem;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  gap: .4rem;
}
html[dir=rtl] .listing-badges {
  left: 3.1rem;
  right: .75rem;
  flex-direction: row-reverse;
}
.listing-badge {
  flex: 0 0 auto;
  min-width: 104px;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: oklch(55% 0.17 152);
  color: white;
  border-radius: 999px;
  padding: .32rem .62rem;
  font-size: .78rem;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.favorite {
  position: absolute;
  right: .75rem;
  top: .65rem;
  z-index: 2;
  color: white;
  font-size: 2.05rem;
  line-height: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,.45);
}
.listing-dots {
  position: absolute;
  z-index: 2;
  bottom: .7rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: .28rem;
}
.listing-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,.72);
}
.listing-body {
  padding: .9rem .95rem 1rem;
}
.listing-name {
  font-size: 1.18rem;
  font-weight: 850;
  line-height: 1.1;
  margin-bottom: .35rem;
}
.listing-meta {
  color: #2a2d38;
  font-size: .93rem;
  line-height: 1.45;
  font-weight: 650;
}
.listing-types {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  min-width: 0;
}
.listing-type {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 104px;
  min-height: 30px;
  padding: .32rem .62rem;
  border-radius: 999px;
  border: 0;
  background: var(--ocean-deep);
  color: white;
  font-size: .78rem;
  font-weight: 800;
  line-height: 1.2;
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
.listing-address {
  color: #596273;
  margin-top: .35rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.listing-provider {
  margin-top: .65rem;
  color: #7a858c;
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.project-price-marker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 92px;
  max-width: 168px;
  height: 34px;
  padding: 0 .78rem;
  border-radius: 999px;
  background: #c15a00;
  color: white;
  border: 2px solid white;
  box-shadow: 0 6px 16px rgba(17,24,39,.32);
  font-weight: 900;
  font-size: .78rem;
  line-height: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.leaflet-marker-icon.is-active .project-price-marker {
  background: #9a4700;
  color: white;
  transform: scale(1.08);
}
.map-pane.map-compact {
  height: 42vh;
  min-height: 320px;
}
.map-tool-btn {
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: white;
  color: #222;
  font-size: 16px;
  font-weight: 800;
}
.map-tool-btn:hover { background: #f4f4f4; }
.popup-card {
  min-width: 180px;
}
.pc-cat {
  color: var(--sun);
  font-size: .72rem;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.pc-name {
  margin-top: .25rem;
  color: #1f2430;
  font-size: 1rem;
  font-weight: 850;
}
.pc-loc {
  margin: .28rem 0 .6rem;
  color: #596273;
  font-size: .86rem;
}
.popup-card .listing-types {
  margin: .4rem 0 .35rem;
}
.popup-card .listing-type {
  min-height: 22px;
  min-width: 86px;
  background: var(--ocean-deep);
  color: white;
  font-size: .66rem;
  box-shadow: none;
}
.pc-link {
  color: var(--ocean);
  font-weight: 850;
  text-decoration: none;
}
.empty-state {
  padding: 3rem 1rem;
  text-align: center;
  color: #66747d;
}
@media (max-width: 980px) {
  .searchbar { top: 64px; }
  .searchbar-inner {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
  }
  .search-box { flex: 1 1 100%; }
  .filter-btn, .save-btn { flex: 0 0 auto; }
  .explorer-layout {
    grid-template-columns: 1fr;
  }
  .map-pane {
    position: relative;
    top: auto;
    height: 48vh;
    min-height: 340px;
    border-right: 0;
    border-bottom: 1px solid var(--border-subtle);
  }
}
@media (max-width: 560px) {
  .searchbar-inner {
    grid-template-columns: 1fr 1fr;
    gap: .5rem;
  }
  .filter-btn,
  .save-btn {
    padding: 0 .7rem;
    justify-content: center;
  }
  .results-pane {
    padding: 1rem .85rem 2rem;
  }
  .results-head {
    display: block;
  }
  .sort-control {
    margin-top: .75rem;
  }
}
</style>
</head>
<body>
<div id="mainMenu"></div>
<main class="explorer-shell">
  <section class="searchbar">
    <div class="searchbar-inner">
      <label class="search-box">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Adresse, quartier, ville">
      </label>
      <button class="filter-btn active" type="button" data-filter="all" id="filterAll">Tous</button>
      <button class="filter-btn" type="button" data-filter="tour" id="filterTour">Visite 360</button>
      <button class="filter-btn" type="button" data-filter="poi" id="filterPoi">+50 POI</button>
      <button class="save-btn" type="button" id="resetBtn">Réinitialiser</button>
    </div>
  </section>
  <section class="explorer-layout">
    <aside class="map-pane">
      <div id="explorerMap"></div>
    </aside>
    <section class="results-pane">
      <div class="results-head">
        <div class="results-title">
          <h1 id="resultsTitle">Projets immobiliers Narjiss</h1>
          <p id="resultsCount"></p>
        </div>
        <button class="sort-control" type="button" id="sortBtn">Tri: Plus de POI ↓</button>
      </div>
      <div class="listing-grid" id="listingGrid"></div>
    </section>
  </section>
</main>
<div id="mainFooter"></div>
<script src="shared/menu.js"></script>
<script src="explorer.js"></script>
</body>
</html>
