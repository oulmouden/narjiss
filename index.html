var SLIDER_IMAGES = [];

var sliderIndex = 0;
var sliderTimer = null;
var PROJECT_SLIDERS = {};
var projectSliderTimer = null;

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, function(ch) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
  });
}

function initHomeSlider() {
  var slider = document.getElementById('homeSlider');
  var track = document.getElementById('sliderTrack');
  var dots = document.getElementById('sliderDots');
  var prev = document.getElementById('sliderPrev');
  var next = document.getElementById('sliderNext');
  if (!slider || !track || !dots || !SLIDER_IMAGES.length) return;
  if (sliderTimer) window.clearInterval(sliderTimer);
  sliderTimer = null;
  sliderIndex = 0;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var slidesHtml = '';
  var dotsHtml = '';
  for (var i = 0; i < SLIDER_IMAGES.length; i++) {
    slidesHtml += '<div class="slider-slide' + (i === 0 ? ' active' : '') + '">' +
      '<img src="' + escapeHtml(SLIDER_IMAGES[i].src) + '" alt="' + escapeHtml(SLIDER_IMAGES[i].alt) + '" loading="' + (i === 0 ? 'eager' : 'lazy') + '">' +
    '</div>';
    dotsHtml += '<button type="button" class="slider-dot' + (i === 0 ? ' active' : '') + '" data-slide="' + i + '" aria-label="Afficher l’image ' + (i + 1) + '"></button>';
  }
  track.innerHTML = slidesHtml;
  dots.innerHTML = dotsHtml;
  dots.classList.toggle('many', SLIDER_IMAGES.length > 12);

  function showSlide(index) {
    var slides = track.querySelectorAll('.slider-slide');
    var dotButtons = dots.querySelectorAll('.slider-dot');
    sliderIndex = (index + slides.length) % slides.length;
    for (var j = 0; j < slides.length; j++) {
      slides[j].classList.toggle('active', j === sliderIndex);
      dotButtons[j].classList.toggle('active', j === sliderIndex);
    }
  }

  function startSlider() {
    if (reduceMotion) return;
    stopSlider();
    sliderTimer = window.setInterval(function() {
      showSlide(sliderIndex + 1);
    }, 5200);
  }

  function stopSlider() {
    if (sliderTimer) window.clearInterval(sliderTimer);
    sliderTimer = null;
  }

  if (prev) {
    prev.addEventListener('click', function() {
      showSlide(sliderIndex - 1);
      startSlider();
    });
  }
  if (next) {
    next.addEventListener('click', function() {
      showSlide(sliderIndex + 1);
      startSlider();
    });
  }
  var dotButtons = dots.querySelectorAll('.slider-dot');
  for (var d = 0; d < dotButtons.length; d++) {
    dotButtons[d].addEventListener('click', function() {
      showSlide(parseInt(this.getAttribute('data-slide'), 10));
      startSlider();
    });
  }
  slider.addEventListener('mouseenter', stopSlider);
  slider.addEventListener('mouseleave', startSlider);
  slider.addEventListener('focusin', stopSlider);
  slider.addEventListener('focusout', startSlider);
  if (!reduceMotion) startSlider();
}

function projectSliderHtml(project, lang) {
  var images = PROJECT_SLIDERS[project.id];
  if (!images || !images.length) return '';
  var html = '<div class="project-card-slider" data-project-slider="' + project.id + '">';
  for (var i = 0; i < images.length; i++) {
    html += '<img class="project-card-slide' + (i === 0 ? ' active' : '') + '" src="' + images[i] + '" alt="' + escapeHtml(project.name[lang]) + '" loading="lazy">';
  }
  if (images.length > 1) {
    html += '<div class="project-card-dots" aria-hidden="true">';
    for (var d = 0; d < Math.min(images.length, 6); d++) {
      html += '<span class="' + (d === 0 ? 'active' : '') + '"></span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function projectTypesHtml(project, lang) {
  var types = project.types && project.types[lang];
  if (!types || !types.length) return '';
  var html = '<div class="project-types" aria-label="Types de biens">';
  for (var i = 0; i < types.length; i++) {
    html += '<span class="project-type">' + escapeHtml(types[i]) + '</span>';
  }
  html += '</div>';
  return html;
}

function startProjectCardSliders() {
  if (projectSliderTimer) window.clearInterval(projectSliderTimer);
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;
  var sliders = document.querySelectorAll('[data-project-slider]');
  if (!sliders.length) return;
  projectSliderTimer = window.setInterval(function() {
    for (var i = 0; i < sliders.length; i++) {
      var slides = sliders[i].querySelectorAll('.project-card-slide');
      if (slides.length < 2) continue;
      var dots = sliders[i].querySelectorAll('.project-card-dots span');
      var active = 0;
      for (var j = 0; j < slides.length; j++) {
        if (slides[j].classList.contains('active')) active = j;
      }
      var next = (active + 1) % slides.length;
      slides[active].classList.remove('active');
      slides[next].classList.add('active');
      for (var d = 0; d < dots.length; d++) {
        dots[d].classList.toggle('active', d === next % dots.length);
      }
    }
  }, 3600);
}

function loadProjectSliders() {
  return fetch('data/project-sliders.json?v=2')
    .then(function(res) {
      if (!res.ok) return {};
      return res.json();
    })
    .then(function(data) {
      data = data || {};
      var checks = [];
      var validSliders = {};
      Object.keys(data).forEach(function(projectId) {
        var images = Array.isArray(data[projectId]) ? data[projectId] : [];
        checks.push(Promise.all(images.map(function(src) {
          return imageExists(src).then(function(exists) {
            return exists ? src : null;
          });
        })).then(function(existingImages) {
          existingImages = existingImages.filter(Boolean);
          if (existingImages.length) {
            validSliders[projectId] = existingImages;
          }
        }));
      });
      return Promise.all(checks).then(function() {
        PROJECT_SLIDERS = validSliders;
      });
    })
    .catch(function() {
      PROJECT_SLIDERS = {};
    });
}

function imageExists(src) {
  return new Promise(function(resolve) {
    if (!src) {
      resolve(false);
      return;
    }

    var image = new Image();
    image.onload = function() { resolve(true); };
    image.onerror = function() { resolve(false); };
    image.src = src;
  });
}

function sliderAltFromPath(path) {
  var file = String(path || '').split('/').pop() || '';
  var label = file.replace(/\.(jpe?g|png|webp)$/i, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return label ? 'Projet immobilier Narjiss - ' + label : 'Projet immobilier Narjiss';
}

function loadHomeSliderImages() {
  return fetch('data/home-slider-images.json?v=3')
    .then(function(res) {
      if (!res.ok) return [];
      return res.json();
    })
    .then(function(images) {
      SLIDER_IMAGES = (images || []).filter(function(src) {
        return /\.(jpe?g|png|webp)$/i.test(src);
      }).map(function(src) {
        return {
          src: src,
          alt: sliderAltFromPath(src)
        };
      });
    })
    .catch(function() {
      SLIDER_IMAGES = [];
    });
}

  startProjectCardSliders();

  var fg = document.getElementById('featuresGrid');
  fg.innerHTML = '';

  for (var i = 0; i < t.features.length; i++) {
    var f = t.features[i];
    if (i < 2) {
      fg.innerHTML +=
        '<div class="feature-card feature-main">' +

            '<h3>' + f.title + '</h3>' +

    } else {
      secondaryHtml +=
        '<div class="feature-card feature-secondary">' +
          '<div class="feature-icon" aria-hidden="true">' + f.icon + '</div>' +
          '<div class="feature-text">' +
            '<h3>' + f.title + '</h3>' +
            '<p>' + f.desc + '</p>' +
          '</div>' +
        '</div>';
    }
  }
  if (secondaryHtml) {
    fg.innerHTML += '<div class="features-secondary-stack">' + secondaryHtml + '</div>';
  }
};

document.addEventListener('DOMContentLoaded', function() {
  loadHomeSliderImages().then(initHomeSlider);
  initPage('home', '');
  loadProjectSliders().then(function() {
    var lang = typeof currentLang !== 'undefined' ? currentLang : 'fr';
    if (window.onLanguageChange) window.onLanguageChange(lang);
  });
});
</script>
</body>
